[project]
name = "rag-eval"
version = "0.1.0"
description = "RAG quality evaluation harness: layered metrics, baseline diff, regression-ready"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# v0 核心链路零依赖即可运行；接入真实被测系统时再按需安装
full = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "numpy>=1.26",
  "ragas>=0.2",
]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_eval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
