name: api-tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # UTC 18:00 = 北京时间次日 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  # 同一分支的新提交取消上一次运行，省 runner 也省排队
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ------------------------------------------------------------------------
  # 第一档：PR 门禁。目标 60 秒内出结果，任何一个红都不许合。
  # ------------------------------------------------------------------------
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Smoke gate
        run: |
          pytest -m "smoke and not destructive" \
            -n auto --dist loadscope \
            --reruns 2 --reruns-delay 1 \
            --html=out/smoke.html --self-contained-html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: out/smoke.html
          retention-days: 7

  # ------------------------------------------------------------------------
  # 第二档：主干全量。多 Python 版本矩阵，排除 slow。
  # 矩阵的意义是抓「只用某个版本才有的语法/行为」，不是凑数。
  # ------------------------------------------------------------------------
  full:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Full suite
        run: |
          pytest -m "not slow" \
            -n auto --dist loadscope \
            --junitxml=out/junit.xml \
            --html=out/full-${{ matrix.python-version }}.html --self-contained-html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-report-${{ matrix.python-version }}
          path: out/
          retention-days: 14

  # ------------------------------------------------------------------------
  # 第三档：夜间。跑 slow、跑全量，并做一次「契约漂移演练」。
  #
  # 演练这一步是刻意保留的：它证明契约测试真的会拦，而不是写了没人验证。
  # 用 continue-on-error 让它不影响流水线结论，产物单独归档。
  # ------------------------------------------------------------------------
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Full suite including slow
        run: |
          pytest \
            -n auto --dist loadscope \
            --html=out/nightly.html --self-contained-html

      - name: Contract drift drill (expected to fail)
        continue-on-error: true
        run: |
          pytest -m contract --schema-drift \
            --html=out/drift-drill.html --self-contained-html || echo "漂移已被检出，符合预期"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: out/
          retention-days: 30

  # ------------------------------------------------------------------------
  # 接真实环境时，把上面 job 的 run 改成：
  #   pytest -m smoke --base-url "${{ secrets.STAGING_BASE_URL }}" --env staging
  # 并在 GitHub Secrets 里放地址与凭据。
  # 注意 --env prod 会自动跳过 destructive 用例，这是最后一道保险。
  # ------------------------------------------------------------------------
