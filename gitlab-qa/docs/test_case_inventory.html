fail": null, "skip": null, "doc": "", "fixtures": ["gl"], "estimate": 1, "id": "API-USER-004", "nodeid": "tests/api/test_users.py::test_user_keys_are_listed", "executable": 1, "estimated": false}, {"name": "test_user_projects_are_listed", "line": 92, "cls": null, "epic": "GitLab API", "feature": "用户", "story": "用户可见项目", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl"], "estimate": 1, "id": "API-USER-005", "nodeid": "tests/api/test_users.py::test_user_projects_are_listed", "executable": 1, "estimated": false}, {"name": "test_project_candidate_users", "line": 105, "cls": null, "epic": "GitLab API", "feature": "用户", "story": "项目成员候选用户", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "a_project"], "estimate": 1, "id": "API-USER-006", "nodeid": "tests/api/test_users.py::test_project_candidate_users", "executable": 1, "estimated": false}, {"name": "test_admin_can_delete_user", "line": 117, "cls": null, "epic": "GitLab API", "feature": "用户", "story": "管理员可删除用户", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "创建 → 删除 → 查不到。删不干净的用户会留在实例上，\n下一轮再建同名用户时 409，而报错指向的是创建，根因却在上一轮。\n\n删除是**两阶段**的（GitLab 19.0.1 实测）：DELETE 立刻回 204，\n用户 state 由 active 变 blocked，真正的物理清除由后台任务完成——\n实测 60 秒后 GET 仍是 200。所以「删完立刻断言 404」必然假红。\n这里认两个信号中的任意一个：对象消失，或已被停用（blocked）。\n两者都证明删除生效了；都等不到才算失败。", "fixtures": ["gl"], "estimate": 1, "id": "API-USER-007", "nodeid": "tests/api/test_users.py::test_admin_can_delete_user", "executable": 1, "estimated": false}, {"name": "test_admin_can_create_user", "line": 165, "cls": null, "epic": "GitLab API", "feature": "用户", "story": "管理员可创建用户", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "创建用户需要管理员。非管理员拿到 403 时按设计 skip——\n把「身份不够」报成「功能有缺陷」是最容易误导人的一类假红。", "fixtures": ["gl"], "estimate": 1, "id": "API-USER-008", "nodeid": "tests/api/test_users.py::test_admin_can_create_user", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_wikis.py", "code": "WIKI", "name": "test_wikis.py", "doc": "项目 Wiki 页面：slug 语义 + CRUD + 校验。\n\n全部期望值来自本实例实测（GitLab 19.0.1）：\n  · POST {title, content} → 201，slug 由 title 派生（保留大小写：\n    \"Home Page\" → \"Home-Page\"）\n  · **slug 查找大小写不敏感**：GET /wikis/home-page 也能命中\n    slug 为 \"Home-Page\" 的页，且响应里存的是原始 slug\n  · PUT 改 title → 200，**slug 随之重算**，旧 slug 立即 404\n  · PUT 只传 title 不传 content → 200，content 保持不变（部分更新语义）\n  · PUT 空 body → 200，页面原样返回（无操作）\n  · 重复 title → 400 'Duplicate page: A page with that title\n    already exists in the file Home-Page.md'\n  · 空白 title（\"  \"）→ 400 \"title can't be blank\"\n  · 缺 content → 400 'content is missing'\n  · DELETE → 204；重复删 404；不存在的页 404\n  · 项目不存在 → 404 'Project Not Found'\n覆盖缺口来源：wikis 模块 12 个操作 QA 只覆盖 1 个（GET 列表）。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_wiki_crud_roundtrip", "line": 62, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "CRUD 全链路", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "创建 → 按 slug 单查 → 更新内容 → 删除 → 404。\n\nslug 取自创建响应而不是自己拼——slug 派生规则（大小写、\n连字符、去空格）是服务端行为，用例里复刻一遍就是循环论证。", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-001", "nodeid": "tests/api/test_wikis.py::test_wiki_crud_roundtrip", "executable": 1, "estimated": false}, {"name": "test_wiki_slug_lookup_is_case_insensitive", "line": 95, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "slug 大小写不敏感查找", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测：slug 存储保留大小写（\"Home-Page\"），但查找不区分——\n小写 \"home-page\" 同样命中，响应里回的是原始大小写。\n\n这条怪癖意味着\"按 URL 猜 slug\"的集成代码在大小写上怎么写\n都能过——但一旦上游把查找改成精确匹配，所有小写链接会同时断。", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-002", "nodeid": "tests/api/test_wikis.py::test_wiki_slug_lookup_is_case_insensitive", "executable": 1, "estimated": false}, {"name": "test_wiki_rename_changes_slug", "line": 120, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "改标题重算 slug", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "PUT 改 title → slug 随之重算，旧 slug 立即 404。\n\n这是 wiki 最坑的语义：改个标题，所有指向旧 slug 的链接\n全部失效（没有重定向）。集成方必须从更新响应里重新拿 slug。", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-003", "nodeid": "tests/api/test_wikis.py::test_wiki_rename_changes_slug", "executable": 1, "estimated": false}, {"name": "test_wiki_update_title_keeps_content", "line": 151, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "只改标题保留内容", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "PUT 只传 title → 200，content 原样保留（部分更新语义，实测）。", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-004", "nodeid": "tests/api/test_wikis.py::test_wiki_update_title_keeps_content", "executable": 1, "estimated": false}, {"name": "test_wiki_update_empty_body_is_noop", "line": 179, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "空 body 更新无操作", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测：PUT 空 body → 200，页面原样返回（既不报错也不清空）。", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-005", "nodeid": "tests/api/test_wikis.py::test_wiki_update_empty_body_is_noop", "executable": 1, "estimated": false}, {"name": "test_wiki_duplicate_title_is_400", "line": 203, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "重复标题拒绝", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "同 title 二次创建 → 400 'Duplicate page'（wiki 以 title 唯一）。", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-006", "nodeid": "tests/api/test_wikis.py::test_wiki_duplicate_title_is_400", "executable": 1, "estimated": false}, {"name": "test_wiki_blank_title_is_400", "line": 224, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "空白标题拒绝", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测：title=\"  \"（纯空白）→ 400 \"can't be blank\"。\n\n空白标题会派生出空 slug，页面上表现为一条点不开的记录——\n必填校验必须把\"空白\"和\"缺失\"同等对待（实测确认是这么做的）。", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-007", "nodeid": "tests/api/test_wikis.py::test_wiki_blank_title_is_400", "executable": 1, "estimated": false}, {"name": "test_wiki_missing_content_is_400", "line": 240, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "必填 content", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-008", "nodeid": "tests/api/test_wikis.py::test_wiki_missing_content_is_400", "executable": 1, "estimated": false}, {"name": "test_wiki_double_delete_is_404", "line": 254, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "重复删除幂等", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-009", "nodeid": "tests/api/test_wikis.py::test_wiki_double_delete_is_404", "executable": 1, "estimated": false}, {"name": "test_wiki_delete_missing_is_404", "line": 269, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "删除不存在的页面", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["wiki_scope", "gl"], "estimate": 1, "id": "API-WIKI-010", "nodeid": "tests/api/test_wikis.py::test_wiki_delete_missing_is_404", "executable": 1, "estimated": false}, {"name": "test_wikis_on_missing_project_is_404", "line": 279, "cls": null, "epic": "GitLab API", "feature": "Wiki", "story": "404 防枚举语义", "severity": "normal", "marks": [], "params": [{"argnames": "method", "count": 2, "ids": ["GET", "POST"], "auto_ids": false}], "param_ids": ["GET", "POST"], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "method"], "estimate": 2, "id": "API-WIKI-011", "nodeid": "tests/api/test_wikis.py::test_wikis_on_missing_project_is_404", "executable": 2, "estimated": false}], "collection_error": false}]}, {"key": "SEC", "name": "安全测试", "desc": "越权（授权绕过）、数据暴露面、请求头安全、注入防护、批量赋值、速率限制、会话与数据作用域隔离。", "order": 2, "modules": [{"file": "tests/security/test_authz.py", "code": "AUTHZ", "name": "test_authz.py", "doc": "越权（授权绕过）：测的是\"别人能不能动我的东西\"。\n\n这一组是四类里最容易被写成假绿的。两个前提缺一不可：\n\n1. **必须有第二个身份**。用管理员去访问管理员资源永远 200，断言恒真。\n   没配 GITLAB_MEMBER_TOKEN 时这类用例 skip（根 conftest 的 member_client 已处理）。\n\n2. **403 和 404 都要接受**。GitLab 对\"无权限的私有资源\"刻意返回 404 而不是 403，\n   因为 403 会泄露\"这个资源存在\"。所以断言写 `in (403, 404)`，\n   但**绝不能接受 200** —— 200 就是越权成功，是最严重的缺陷。\n\n顺便覆盖\"字段级越权\"：端点放行了，但普通用户不该看到管理员的邮箱。\n端点级都没问题的系统，字段级经常漏。", "marks": ["security", "requires_token"], "cases": [{"name": "test_member_identity_is_valid", "line": 28, "cls": null, "epic": "GitLab 安全", "feature": "越权", "story": "对照组：第二身份本身有效且不是管理员", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "这一条不测越权，测的是**下面所有越权用例的前提**。\n\n没有它，GITLAB_MEMBER_TOKEN 一旦过期，越权用例会拿到 401，\n而 401 在\"允许的状态码\"里 —— 全套越权用例照样绿。\n那是比不做测试更危险的假绿：报告上一片通过，实际一条都没验证。\n\n所以先证明：这个身份能用（200）、且确实不是管理员（is_admin=False）。", "fixtures": ["target", "member_client"], "estimate": 1, "id": "SEC-AUTHZ-001", "nodeid": "tests/security/test_authz.py::test_member_identity_is_valid", "executable": 1, "estimated": false}, {"name": "test_member_cannot_read_admins_private_project", "line": 62, "cls": null, "epic": "GitLab 安全", "feature": "越权", "story": "普通用户读不到管理员的私有项目", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl", "member_client", "private_project"], "estimate": 1, "id": "SEC-AUTHZ-002", "nodeid": "tests/security/test_authz.py::test_member_cannot_read_admins_private_project", "executable": 1, "estimated": false}, {"name": "test_member_cannot_delete_admins_project", "line": 88, "cls": null, "epic": "GitLab 安全", "feature": "越权", "story": "普通用户删不掉管理员的项目", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl", "member_client", "private_project"], "estimate": 1, "id": "SEC-AUTHZ-003", "nodeid": "tests/security/test_authz.py::test_member_cannot_delete_admins_project", "executable": 1, "estimated": false}, {"name": "test_member_cannot_create_issue_in_admins_project", "line": 107, "cls": null, "epic": "GitLab 安全", "feature": "越权", "story": "普通用户不能在别人的项目里写数据", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl", "member_client", "private_project"], "estimate": 1, "id": "SEC-AUTHZ-004", "nodeid": "tests/security/test_authz.py::test_member_cannot_create_issue_in_admins_project", "executable": 1, "estimated": false}, {"name": "test_anonymous_cannot_read_private_project", "line": 131, "cls": null, "epic": "GitLab 安全", "feature": "越权", "story": "匿名访问私有项目被拒", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "anon_client", "private_project"], "estimate": 1, "id": "SEC-AUTHZ-005", "nodeid": "tests/security/test_authz.py::test_anonymous_cannot_read_private_project", "executable": 1, "estimated": false}, {"name": "test_member_cannot_see_admin_email", "line": 144, "cls": null, "epic": "GitLab 安全", "feature": "越权", "story": "普通用户看不到管理员的邮箱（字段级）", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "端点级放行不等于字段安全。\n\n普通用户可以 GET /users/:id（公开档案），但不该拿到 email——\nGitLab 只给管理员返回该字段。这类\"字段级越权\"端点扫描器扫不出来，\n只有写断言才能拦住回归。", "fixtures": ["target", "gl", "member_client"], "estimate": 1, "id": "SEC-AUTHZ-006", "nodeid": "tests/security/test_authz.py::test_member_cannot_see_admin_email", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/security/test_data_scope.py", "code": "SCOPE", "name": "test_data_scope.py", "doc": "数据可见范围（横向越权）：别人的数据会不会出现在我的视野里。\n\n和 test_authz.py 的分工：\n\n    test_authz.py      —— 直接点名访问（我知道 id，能不能拿到）\n    test_data_scope.py —— 不点名，从列表 / 搜索 / 统计里\"漏\"出来\n\n后者更贴近真实泄露：攻击者往往拿不到确切 id，\n但列表接口、全局搜索、导出功能会把私有数据整批带出来。\n这一类缺陷在\"点名访问\"的测试里永远是绿的。\n\n另一条纪律同 authz：**403 和 404 都接受，200 一律不接受**。\n但对列表类接口要反过来判——\"列表里没有它\"才是正确结果。", "marks": ["security", "requires_token"], "cases": [{"name": "test_member_project_list_excludes_admins_private_project", "line": 28, "cls": null, "epic": "GitLab 安全", "feature": "数据范围", "story": "普通用户的项目列表里没有管理员的私有项目", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "列全部项目，私有项目不能出现在普通用户的列表里。\n\n这是「批量泄露」最典型的形态：单个详情接口都守得住，\n列表接口按 visible_to_user 过滤时漏了一个条件就全漏了。", "fixtures": ["target", "gl", "member_client", "private_project"], "estimate": 1, "id": "SEC-SCOPE-001", "nodeid": "tests/security/test_data_scope.py::test_member_project_list_excludes_admins_private_project", "executable": 1, "estimated": false}, {"name": "test_member_search_misses_private_project", "line": 59, "cls": null, "epic": "GitLab 安全", "feature": "数据范围", "story": "全局搜索不命中管理员的私有项目", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "搜索是另一个\"批量泄露\"的高发区。\n\n搜索往往走独立索引，权限过滤和列表接口不是同一套代码，\n列表守住了、搜索没守住的情况非常常见（真实事故里的常客）。", "fixtures": ["target", "member_client", "private_project"], "estimate": 1, "id": "SEC-SCOPE-002", "nodeid": "tests/security/test_data_scope.py::test_member_search_misses_private_project", "executable": 1, "estimated": false}, {"name": "test_member_cannot_read_private_issue", "line": 83, "cls": null, "epic": "GitLab 安全", "feature": "数据范围", "story": "普通用户读不到私有议题", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "私有项目里的议题，普通用户点名访问也要被拒。", "fixtures": ["target", "gl", "member_client", "private_project", "data_factory"], "estimate": 1, "id": "SEC-SCOPE-003", "nodeid": "tests/security/test_data_scope.py::test_member_cannot_read_private_issue", "executable": 1, "estimated": false}, {"name": "test_member_cannot_comment_on_private_issue", "line": 106, "cls": null, "epic": "GitLab 安全", "feature": "数据范围", "story": "普通用户不能在私有议题下留言", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "写权限比读权限更容易漏：读可能被缓存挡住，写一定落到业务逻辑。", "fixtures": ["target", "gl", "member_client", "private_project", "data_factory"], "estimate": 1, "id": "SEC-SCOPE-004", "nodeid": "tests/security/test_data_scope.py::test_member_cannot_comment_on_private_issue", "executable": 1, "estimated": false}, {"name": "test_member_cannot_add_self_to_project", "line": 131, "cls": null, "epic": "GitLab 安全", "feature": "数据范围", "story": "普通用户不能把自己加成项目成员", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "把自己加进别人的项目 = 一次完整的权限提升。\n\n这条比\"读不到\"更严重：成功一次，后面所有越权断言都会失效，\n因为那个身份从此就是合法成员了。", "fixtures": ["target", "gl", "member_client", "private_project"], "estimate": 1, "id": "SEC-SCOPE-005", "nodeid": "tests/security/test_data_scope.py::test_member_cannot_add_self_to_project", "executable": 1, "estimated": false}, {"name": "test_member_cannot_change_application_settings", "line": 159, "cls": null, "epic": "GitLab 安全", "feature": "数据范围", "story": "普通用户改不了实例级设置", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "改实例设置是最高权限操作，普通 Token 必须被拒。\n\n而且不能只看返回码——有些实现返回 200 但什么都没改。\n所以改之前先读一份，改之后再读一次做比对。", "fixtures": ["target", "gl", "member_client"], "estimate": 1, "id": "SEC-SCOPE-006", "nodeid": "tests/security/test_data_scope.py::test_member_cannot_change_application_settings", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/security/test_exposure.py", "code": "EXPOSE", "name": "test_exposure.py", "doc": "暴露面：测的是\"不该开的东西有没有开着、该加的头有没有加\"。\n\n这类用例最容易写成\"扫一遍就完\"，价值在于**可回归**：\n今天关了公开注册，三个月后有人为了拉人又打开，这条用例会红。\n\n断言口径说明（避免假绿）：\n  - 安全响应头：`X-Content-Type-Options` / `X-Frame-Options` 必须存在；\n    `Referrer-Policy` 只记录不强断言——GitLab 各版本对 API 响应不一致，\n    强断言会变成噪声。\n  - HSTS：只在 https 目标上断言。本地 http 靶场没有 HSTS 是正常的。\n  - 公开注册：默认要求关闭。这条红了就是**真发现**，不是用例写错了。", "marks": ["security", "requires_token"], "cases": [{"name": "test_api_response_has_security_headers", "line": 26, "cls": null, "epic": "GitLab 安全", "feature": "暴露面", "story": "API 响应带基础安全头", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl"], "estimate": 1, "id": "SEC-EXPOSE-001", "nodeid": "tests/security/test_exposure.py::test_api_response_has_security_headers", "executable": 1, "estimated": false}, {"name": "test_public_signup_is_disabled", "line": 56, "cls": null, "epic": "GitLab 安全", "feature": "暴露面", "story": "公开注册处于关闭状态", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "企业内网实例必须关闭自助注册——否则任何人都能拿到一个合法账号。\n\n这条用例红了，说明实例配置有问题，而不是用例写错了。\n修法（二选一）：\n  界面：Admin → Settings → General → Sign-up restrictions → 取消 Sign-up enabled\n  API ：PUT /application/settings?signup_enabled=false", "fixtures": ["target", "gl"], "estimate": 1, "id": "SEC-EXPOSE-002", "nodeid": "tests/security/test_exposure.py::test_public_signup_is_disabled", "executable": 1, "estimated": false}, {"name": "test_anonymous_list_only_returns_public_projects", "line": 86, "cls": null, "epic": "GitLab 安全", "feature": "暴露面", "story": "匿名列表只返回公开项目", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "匿名能列项目本身不一定是问题，泄露私有项目才是。\n\n所以断言写的是\"每一条都必须是 public\"，而不是\"匿名不能访问列表\"——\n后者在默认配置下就会红，属于把产品行为当成缺陷。", "fixtures": ["target", "anon_client", "data_factory"], "estimate": 1, "id": "SEC-EXPOSE-003", "nodeid": "tests/security/test_exposure.py::test_anonymous_list_only_returns_public_projects", "executable": 1, "estimated": false}, {"name": "test_admin_endpoints_reject_anonymous", "line": 119, "cls": null, "epic": "GitLab 安全", "feature": "暴露面", "story": "管理员端点匿名不可达", "severity": "blocker", "marks": [], "params": [{"argnames": "path", "count": 3, "ids": ["/application/settings", "/application/statistics", "/users"], "auto_ids": false}], "param_ids": ["/application/settings", "/application/statistics", "/users"], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "anon_client", "path"], "estimate": 3, "id": "SEC-EXPOSE-004", "nodeid": "tests/security/test_exposure.py::test_admin_endpoints_reject_anonymous", "executable": 3, "estimated": false}], "collection_error": false}, {"file": "tests/security/test_headers.py", "code": "HEADER", "name": "test_headers.py", "doc": "传输层与浏览器侧安全头。\n\nAPI 安全头（nosniff / X-Frame-Options）在 exposure 那组已经测过，\n这里补的是**Web 页面**这一侧——用户真正用浏览器访问的部分：\n\n- Cookie 属性：HttpOnly / Secure / SameSite。API 鉴权靠 Token，\n  浏览器会话靠 Cookie，两者是两套凭据，只测一套等于只锁了一扇门。\n- CORS：跨域配置写宽了，任何一个恶意页面都能带着用户的登录态读数据。\n- 危险 HTTP 方法：TRACE 之类的加固项，很多加固清单第一条就是它。\n\n判定口径沿用例一贯原则：**弱项只记录，强项才断言**。\n比如 CSP，GitLab 各版本差异很大，强断言会让用例天天红；\n而 Cookie 的 HttpOnly 是\"有没有\"的二选一，没有就该红。", "marks": ["security"], "cases": [{"name": "test_session_cookie_is_httponly", "line": 49, "cls": null, "epic": "GitLab 安全", "feature": "Cookie", "story": "会话 Cookie 带 HttpOnly", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "会话 Cookie 必须 HttpOnly：否则一段 XSS 就能把登录态偷走。\n\n这一条是「XSS 能不能升级为会话劫持」的分水岭，\n所以即便注入类用例全绿，这条红了也要立刻修。", "fixtures": ["target"], "estimate": 1, "id": "SEC-HEADER-001", "nodeid": "tests/security/test_headers.py::test_session_cookie_is_httponly", "executable": 1, "estimated": false}, {"name": "test_session_cookie_is_secure_over_https", "line": 77, "cls": null, "epic": "GitLab 安全", "feature": "Cookie", "story": "https 下 Cookie 带 Secure", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "只在 https 目标上断言 Secure。\n\nhttp 的本地靶场没有 Secure 是正常的，强断言会把\"环境差异\"\n伪装成\"安全缺陷\"，这正是安全用例失去信任的典型方式。", "fixtures": ["target"], "estimate": 1, "id": "SEC-HEADER-002", "nodeid": "tests/security/test_headers.py::test_session_cookie_is_secure_over_https", "executable": 1, "estimated": false}, {"name": "test_session_cookie_declares_samesite", "line": 101, "cls": null, "epic": "GitLab 安全", "feature": "Cookie", "story": "Cookie 声明了 SameSite", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "SameSite 只记录不强制断言：各版本默认值不同（有的靠浏览器默认 Lax）。\n\n记录进报告的意义在于：一旦要排查 CSRF 类问题，\n这里能直接看到实例当前的取值，不用再去抓包。", "fixtures": ["target"], "estimate": 1, "id": "SEC-HEADER-003", "nodeid": "tests/security/test_headers.py::test_session_cookie_declares_samesite", "executable": 1, "estimated": false}, {"name": "test_cors_has_no_dangerous_combination", "line": 128, "cls": null, "epic": "GitLab 安全", "feature": "CORS", "story": "不回显任意 Origin、不通配 + 凭据", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "CORS 的判据是「组合」，不是单个头。\n\n这里踩过一次坑，值得写下来：GitLab 的 API 默认返回\n`Access-Control-Allow-Origin: *`，第一版的用例直接断言 `!= \"*\"`，\n于是**每条运行都红**。但那是 GitLab 的既定设计——\nAPI 用 `PRIVATE-TOKEN` 头认证，不靠 Cookie，\n浏览器在没有 `Allow-Credentials` 时不会附带任何凭据，\n所以 `*` 不带凭据是安全的。\n\n真正危险的是两种组合：\n  1. `*` 或回显请求方的 Origin，**同时** `Allow-Credentials: true`\n     —— 等价于对任意站点开放带登录态的跨域读取；\n  2. 回显请求方的 Origin（origin reflection）——\n     说明服务端把输入原样带回头里，往往还带着别的注入面。\n\n把判据从\"单头\"改成\"组合\"，用例才既不会天天假红，\n又能在真的配错时红得有说服力。", "fixtures": ["target"], "estimate": 1, "id": "SEC-HEADER-004", "nodeid": "tests/security/test_headers.py::test_cors_has_no_dangerous_combination", "executable": 1, "estimated": false}, {"name": "test_dangerous_http_methods_are_rejected", "line": 179, "cls": null, "epic": "GitLab 安全", "feature": "HTTP 方法", "story": "非常规方法被拒绝", "severity": "normal", "marks": [], "params": [{"argnames": "method", "count": 2, "ids": ["TRACE", "TRACK"], "auto_ids": false}], "param_ids": ["TRACE", "TRACK"], "xfail": null, "skip": null, "doc": "TRACE / TRACK 应当被拒绝（405 / 403 / 400 都可接受）。\n\n用 raw 发送器而不是 requests：后者对非常规方法的处理本身就有差异，\n测不到\"服务端到底放不放行\"。\n另外这两个方法常用于跨站追踪（XST），是加固清单里的常客。", "fixtures": ["target", "method"], "estimate": 2, "id": "SEC-HEADER-005", "nodeid": "tests/security/test_headers.py::test_dangerous_http_methods_are_rejected", "executable": 2, "estimated": false}], "collection_error": false}, {"file": "tests/security/test_injection.py", "code": "INJECT", "name": "test_injection.py", "doc": "注入与转义：测的是\"用户输入会不会被当成代码执行\"。\n\n接口层的注入测试有个容易走偏的方向：想直接证明\"注入成功\"。\n实际上能自动断言的只有三件事：\n\n1. **载荷被原样存取**（应用没把用户的字改掉，也没崩）；\n2. **服务端没有把载荷当模板求值**（{{7*7}} 存进去还是 {{7*7}}，不是 49）；\n3. **错误响应不吐内部信息**（注入失败时不能把 SQL 报错、堆栈带出来）。\n\n真正\"浏览器里会不会执行\"——那是 UI 层的 XSS 验证，接口层最多断到\n`Content-Type: application/json`（JSON 不会被当 HTML 渲染）。\n把这条边界说清楚，比写一个\"看起来在测 XSS\"的假断言有价值。", "marks": ["security", "requires_token", "destructive"], "cases": [{"name": "test_xss_payload_is_stored_literally", "line": 41, "cls": null, "epic": "GitLab 安全", "feature": "注入与转义", "story": "XSS 载荷被原样存储，不被求值", "severity": "critical", "marks": [], "params": [{"argnames": "payload", "count": null, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl", "data_factory", "payload"], "estimate": 1, "id": "SEC-INJECT-001", "nodeid": "tests/security/test_injection.py::test_xss_payload_is_stored_literally", "executable": 31, "estimated": false}, {"name": "test_template_payload_is_not_evaluated", "line": 70, "cls": null, "epic": "GitLab 安全", "feature": "注入与转义", "story": "模板语法不被求值", "severity": "critical", "marks": [], "params": [{"argnames": "payload", "count": null, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "{{ 7 * 7 }} 存进去就该是 {{ 7 * 7 }}。\n\n如果读回变成 \"49\"，说明服务端把用户输入送进了模板引擎求值——\n这是 SSTI（服务端模板注入），危害远大于反射型 XSS。", "fixtures": ["target", "gl", "data_factory", "payload"], "estimate": 1, "id": "SEC-INJECT-002", "nodeid": "tests/security/test_injection.py::test_template_payload_is_not_evaluated", "executable": 3, "estimated": false}, {"name": "test_sqli_in_search_does_not_leak_or_break", "line": 98, "cls": null, "epic": "GitLab 安全", "feature": "注入与转义", "story": "搜索参数注入不生效且不泄露 SQL 报错", "severity": "blocker", "marks": [], "params": [{"argnames": "payload", "count": null, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl", "data_factory", "payload"], "estimate": 1, "id": "SEC-INJECT-003", "nodeid": "tests/security/test_injection.py::test_sqli_in_search_does_not_leak_or_break", "executable": 4, "estimated": false}, {"name": "test_path_traversal_is_rejected", "line": 130, "cls": null, "epic": "GitLab 安全", "feature": "注入与转义", "story": "路径穿越读不到系统文件", "severity": "blocker", "marks": [], "params": [{"argnames": "payload", "count": null, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "必须用原始请求，否则测的是客户端不是服务端。\n\nrequests / urllib3 会把 `../` 先归一化掉，恶意路径根本到不了服务端——\n用例\"通过\"只是因为载荷没发出去。实测就是这么被坑的：\n三个载荷全部返回 text/html 登录页，看起来像\"被拦了\"，其实请求早被改写。\n\n判定口径（重要，避免误报）：\n  - 4xx        → 明确拒绝\n  - 2xx 且正文无 /etc/passwd 特征 → 反代把路径归一化到了别的页面，不算漏洞\n  - 正文含 root:x:0:0 之类            → 真读到系统文件，安全缺陷", "fixtures": ["target", "payload"], "estimate": 1, "id": "SEC-INJECT-004", "nodeid": "tests/security/test_injection.py::test_path_traversal_is_rejected", "executable": 5, "estimated": false}], "collection_error": false}, {"file": "tests/security/test_leak.py", "code": "LEAK", "name": "test_leak.py", "doc": "敏感字段泄露：测的是\"响应里有没有不该出现的东西\"。\n\n为什么只扫键名不扫值：值里出现 \"token\" 太常见（URL、分支名、issue 描述），\n误报会让人把整个安全套件关掉——这比不测更糟。\n而\"响应里多出一个 access_token 字段\"几乎一定是问题。\n\n第二个重点是**错误响应**。正常响应大家都会检查，出错的路径反而最容易吐内部信息：\n堆栈、SQL 报错、部署绝对路径。所以每个 4xx 都要单独扫一遍。", "marks": ["security", "requires_token"], "cases": [{"name": "test_version_and_metadata_have_no_secrets", "line": 29, "cls": null, "epic": "GitLab 安全", "feature": "信息泄露", "story": "版本与元信息接口不含凭据字段", "severity": "critical", "marks": [], "params": [{"argnames": "path", "count": 2, "ids": ["/version", "/metadata"], "auto_ids": false}], "param_ids": ["/version", "/metadata"], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl", "path"], "estimate": 2, "id": "SEC-LEAK-001", "nodeid": "tests/security/test_leak.py::test_version_and_metadata_have_no_secrets", "executable": 2, "estimated": false}, {"name": "test_current_user_has_no_credentials", "line": 46, "cls": null, "epic": "GitLab 安全", "feature": "信息泄露", "story": "当前用户响应不含凭据字段", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl"], "estimate": 1, "id": "SEC-LEAK-002", "nodeid": "tests/security/test_leak.py::test_current_user_has_no_credentials", "executable": 1, "estimated": false}, {"name": "test_project_list_has_no_secrets", "line": 58, "cls": null, "epic": "GitLab 安全", "feature": "信息泄露", "story": "项目列表不含凭据字段", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "列表接口是**批量暴露面**：一个字段泄露，一次就暴露 N 个项目。\n\n断言必须用**非管理员视角**，这一点是本项目实测修正的：\n\n  管理员读 /projects，列表里每个项目都带 runners_token。\n  这是权限模型内的行为（admin 对任何项目都有 maintainer 权限），\n  报成失败属于误报；但它确实说明「列表接口会带凭据」，\n  所以要看的是——**普通用户读列表时带不带**。\n\n普通用户看公开项目时若也能拿到 runners_token，任何登录用户都能把\nrunner 注册到别人的项目上，直接截获 CI 任务。那才是缺陷。", "fixtures": ["target", "gl", "member_client", "data_factory"], "estimate": 1, "id": "SEC-LEAK-003", "nodeid": "tests/security/test_leak.py::test_project_list_has_no_secrets", "executable": 1, "estimated": false}, {"name": "test_non_member_cannot_see_runners_token", "line": 100, "cls": null, "epic": "GitLab 安全", "feature": "信息泄露", "story": "非项目成员看不到 runner 注册令牌", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "区分\"谁能看到\"比\"有没有\"更重要。\n\n- owner / maintainer 能看到 runners_token：产品设计，不是缺陷\n- 非成员看到：泄露。拿到这个值可以直接注册 runner，把 CI 任务\n  导到自己的机器上执行——等于接管构建链路。\n\n所以先确认 owner 视角确实有该字段（否则这条用例失去意义），\n再断言非成员视角没有。", "fixtures": ["target", "gl", "member_client", "data_factory"], "estimate": 1, "id": "SEC-LEAK-004", "nodeid": "tests/security/test_leak.py::test_non_member_cannot_see_runners_token", "executable": 1, "estimated": false}, {"name": "test_bad_request_body_has_no_stacktrace", "line": 135, "cls": null, "epic": "GitLab 安全", "feature": "信息泄露", "story": "参数错误响应不吐堆栈", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl"], "estimate": 1, "id": "SEC-LEAK-005", "nodeid": "tests/security/test_leak.py::test_bad_request_body_has_no_stacktrace", "executable": 1, "estimated": false}, {"name": "test_unauthorized_body_has_no_stacktrace", "line": 152, "cls": null, "epic": "GitLab 安全", "feature": "信息泄露", "story": "未授权响应不吐堆栈", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "拿一个格式合法但无效的 PAT 去打受保护端点。\n\n这类响应最容易被框架的异常兜底页处理，从而带出堆栈。", "fixtures": ["target", "settings"], "estimate": 1, "id": "SEC-LEAK-006", "nodeid": "tests/security/test_leak.py::test_unauthorized_body_has_no_stacktrace", "executable": 1, "estimated": false}, {"name": "test_not_found_body_has_no_stacktrace", "line": 175, "cls": null, "epic": "GitLab 安全", "feature": "信息泄露", "story": "404 响应不吐堆栈", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["target", "gl"], "estimate": 1, "id": "SEC-LEAK-007", "nodeid": "tests/security/test_leak.py::test_not_found_body_has_no_stacktrace", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/security/test_mass_assignment.py", "code": "MASS", "name": "test_mass_assignment.py", "doc": "批量赋值（Mass Assignment）：客户端能不能改到不该改的字段。\n\n原理：很多服务端直接把请求体塞进模型（`Model.new(params)`），\n于是客户端多传一个字段就能改到本该由服务端决定的属性。\n典型后果：自己给自己提权、伪造作者、篡改计数。\n\n测试写法上有一个关键点：**只传不该生效的字段，并且断言它没生效**，\n而不是传了之后看有没有报错。因为\"字段被忽略\"和\"字段生效了\"都不会报错，\n只有回读比对才能分辨。\n\n刻意不做的一项：用 `POST /users` 传 `admin: true` 验证提权。\n那样一旦防护失效，会在实例上真的留下一个管理员账号——\n收益（多一条用例）小于风险（留下一个真管理员）。", "marks": ["security", "requires_token"], "cases": [{"name": "test_project_ignores_client_supplied_id", "line": 28, "cls": null, "epic": "GitLab 安全", "feature": "批量赋值", "story": "客户端指定的项目 id 被忽略", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "请求体里带一个 id，服务端必须用自己的主键生成逻辑覆盖它。\n\n如果生效了，攻击者就能创建出 id 与已有资源冲突、或指向预留 id 的项目。", "fixtures": ["target", "gl", "data_factory"], "estimate": 1, "id": "SEC-MASS-001", "nodeid": "tests/security/test_mass_assignment.py::test_project_ignores_client_supplied_id", "executable": 1, "estimated": false}, {"name": "test_project_ignores_read_only_counters", "line": 48, "cls": null, "epic": "GitLab 安全", "feature": "批量赋值", "story": "只读计数字段不可注入", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "star_count / forks_count / open_issues_count 是派生值，不接受写入。\n\n这类字段被写进去不会直接造成安全问题，但说明\"请求体直接进了模型\"——\n同一个入口上往往还挂着真正危险的字段，所以它是个**廉价的探针**。", "fixtures": ["target", "gl", "data_factory"], "estimate": 1, "id": "SEC-MASS-002", "nodeid": "tests/security/test_mass_assignment.py::test_project_ignores_read_only_counters", "executable": 1, "estimated": false}, {"name": "test_issue_cannot_hijack_existing_iid", "line": 73, "cls": null, "epic": "GitLab 安全", "feature": "批量赋值", "story": "不能顶替已存在的议题编号", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "指定一个已占用的 iid 去创建议题：必须被拒，绝不能顶掉原议题。\n\n这条用例的判据是实测换来的。第一版写的是\"客户端传的 iid 必须被忽略\"，\n结果红了——实际响应里 iid 就是我传的那个值。查下来是 GitLab 的有意设计：\n为了从 Jira / GitHub 迁移时能**保留原编号**，创建接口允许指定 iid。\n\n所以\"能指定 iid\"本身不是缺陷。真正要防的是另一件事：\n能不能用一个已存在的编号把别人的议题**顶掉**。\n在靠 \"#12\" 引用议题的工作流里，那等于篡改历史记录。\n\n教训：安全用例的判据要落在\"会造成什么后果\"上，\n而不是落在\"服务端有没有接受这个字段\"上。", "fixtures": ["target", "gl", "a_project", "data_factory"], "estimate": 1, "id": "SEC-MASS-003", "nodeid": "tests/security/test_mass_assignment.py::test_issue_cannot_hijack_existing_iid", "executable": 1, "estimated": false}, {"name": "test_issue_ignores_author_and_timestamps", "line": 122, "cls": null, "epic": "GitLab 安全", "feature": "批量赋值", "story": "作者与时间戳不可伪造", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "作者、创建时间、关闭时间不能由客户端指定。\n\n「伪造作者」是审计场景里最要命的一条：\n日志和审计记录都以这个字段为准，能改它就能把操作嫁祸给别人。", "fixtures": ["target", "gl", "a_project", "data_factory"], "estimate": 1, "id": "SEC-MASS-004", "nodeid": "tests/security/test_mass_assignment.py::test_issue_ignores_author_and_timestamps", "executable": 1, "estimated": false}, {"name": "test_member_cannot_promote_self", "line": 163, "cls": null, "epic": "GitLab 安全", "feature": "批量赋值", "story": "普通用户不能给自己提权", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "普通用户把自己改成管理员，必须失败。\n\n这是批量赋值里后果最严重的一条，也是唯一必须\"真的去试\"的：\n只读不看写，永远不会知道防护有没有生效。\n试完立刻回读确认——不能只看接口返回了 403，\n有些实现会返回 200 但悄悄忽略字段。", "fixtures": ["target", "member_client"], "estimate": 1, "id": "SEC-MASS-005", "nodeid": "tests/security/test_mass_assignment.py::test_member_cannot_promote_self", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/security/test_rate_limit.py", "code": "RATE", "name": "test_rate_limit.py", "doc": "限流与暴力破解防护。\n\n这一组有个额外的自我约束：**不允许把管理员账号锁住**。\n所以失败登录用的是一批不存在的用户名——既触发失败计数，\n又不会让真实账号进入锁定状态。\n（GitLab 的失败登录计数器是按 IP + 用户名双重计的，\n  一直用真实用户名重试会锁住账号，届时连用例都没法收拾。）\n\n判定口径：不强断言\"必须返回 429\"。\nGitLab CE 是否开启 Rack::Attack 取决于实例配置，\n没开不是缺陷、只是没启用。真正必须成立的只有一条：\n**错误凭据永远不能登录成功**。\n429 出现了就在报告里明确记一笔\"限流已生效\"。", "marks": ["security"], "cases": [{"name": "test_repeated_failed_logins_never_succeed", "line": 35, "cls": null, "epic": "GitLab 安全", "feature": "限流", "story": "连续失败登录不会成功", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "连试 6 次错误密码：一次都不能成功，且最好能观察到限流。\n\n用不存在的用户名是刻意的——真实用户名连续失败会触发账号锁定，\n把自己锁在外面不说，还会让后续所有用例一起红。", "fixtures": ["target"], "estimate": 1, "id": "SEC-RATE-001", "nodeid": "tests/security/test_rate_limit.py::test_repeated_failed_logins_never_succeed", "executable": 1, "estimated": false}, {"name": "test_rate_limit_headers_are_consistent", "line": 80, "cls": null, "epic": "GitLab 安全", "feature": "限流", "story": "限流响应头自洽", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "如果实例声明了 RateLimit-Limit，那么 Remaining 不该超过 Limit。\n\n不一致说明限流计数实现有问题（比如每节点各算一份），\n用户会看到\"明明还有配额却被拒\"。\n没有这些头就 skip——那是没启用，不是错。", "fixtures": ["target"], "estimate": 1, "id": "SEC-RATE-002", "nodeid": "tests/security/test_rate_limit.py::test_rate_limit_headers_are_consistent", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/security/test_session.py", "code": "SESSION", "name": "test_session.py", "doc": "令牌与会话语义：认证环节本身有没有漏洞。\n\n这一组测的是「门」而不是「房间」：前面几组假设\"认证是可靠的\"，\n然后去看门里面有没有越权。这里反过来——先确认这道门本身关得上。\n\n三条最容易被写错的地方：\n1. **只测不带凭据，不测带假凭据**。前者只能证明\"没钥匙进不去\"，\n   证明不了\"假钥匙也进不去\"，而这两条在实现里是不同分支。\n2. **只测 Header，不测 Query**。GitLab 历史上支持 `?private_token=` 传参，\n   两种入口只要有一个被漏掉鉴权，另一个正常也等于没防住。\n3. **Token 明文回显没人查**。响应里把 token 原样吐回来，\n   日志、代理、浏览器历史各存一份，等于到处发钥匙。", "marks": ["security", "requires_token"], "cases": [{"name": "test_bogus_token_rejected_everywhere", "line": 33, "cls": null, "epic": "GitLab 安全", "feature": "会话", "story": "假 Token 在任何端点都被拒", "severity": "blocker", "marks": [], "params": [{"argnames": "path", "count": 3, "ids": ["/user", "/projects", "/application/settings"], "auto_ids": false}], "param_ids": ["/user", "/projects", "/application/settings"], "xfail": null, "skip": null, "doc": "拿一个形似而实非的 Token 打三类端点：私有资源、列表、管理端点。\n\n覆盖三个而不是一个，是因为「认证中间件」在不同路由组上可能不是同一套：\n公开路由、普通路由、管理路由各走各的，少测一个就有一处可能没挂上。", "fixtures": ["target", "path"], "estimate": 3, "id": "SEC-SESSION-001", "nodeid": "tests/security/test_session.py::test_bogus_token_rejected_everywhere", "executable": 3, "estimated": false}, {"name": "test_empty_token_header_is_rejected", "line": 52, "cls": null, "epic": "GitLab 安全", "feature": "会话", "story": "空凭据头被拒而不是当匿名放行", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "显式带上空值的 PRIVATE-TOKEN 头，必须被当成\"凭据无效\"而不是\"没带\"。\n\n这两种输入在实现里经常被合并处理：`if token:` 判断下空串等于没带，\n于是走匿名分支——如果匿名分支恰好放行，空凭据就成了后门。", "fixtures": ["target"], "estimate": 1, "id": "SEC-SESSION-002", "nodeid": "tests/security/test_session.py::test_empty_token_header_is_rejected", "executable": 1, "estimated": false}, {"name": "test_truncated_token_is_rejected", "line": 71, "cls": null, "epic": "GitLab 安全", "feature": "会话", "story": "截断的真实 Token 无效", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "真 Token 砍掉一半必须失效：证明校验的是完整值而不是\"看着像\"。\n\n这条能拦住一类很隐蔽的实现错误：只校验前缀（比如只认 `glpat-`），\n后面随便填什么都放行。冒烟层用的是完全随机的假 Token，\n抓不到\"前缀正确但值不对\"这种情况。", "fixtures": ["target", "settings"], "estimate": 1, "id": "SEC-SESSION-003", "nodeid": "tests/security/test_session.py::test_truncated_token_is_rejected", "executable": 1, "estimated": false}, {"name": "test_token_is_never_echoed_back", "line": 94, "cls": null, "epic": "GitLab 安全", "feature": "会话", "story": "Token 不在响应正文里回显", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "任何响应正文里都不该出现本次使用的 Token 明文。\n\n为什么要查：日志采集、APM、反向代理日志普遍会存响应体，\n一旦回显，凭据就散落到一堆地方，而轮换 Token 时没人想得到要去清那些日志。", "fixtures": ["target", "gl", "settings"], "estimate": 1, "id": "SEC-SESSION-004", "nodeid": "tests/security/test_session.py::test_token_is_never_echoed_back", "executable": 1, "estimated": false}, {"name": "test_unauthorized_response_has_no_stacktrace", "line": 121, "cls": null, "epic": "GitLab 安全", "feature": "会话", "story": "401 响应不带堆栈", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "鉴权失败的响应体必须干净。\n\n401 是最容易被\"调试友好\"化的一条路径——有人为了让接入方好排查，\n在错误体里塞上异常名和堆栈，于是每个扫接口的脚本都能拿到内部实现细节。", "fixtures": ["target"], "estimate": 1, "id": "SEC-SESSION-005", "nodeid": "tests/security/test_session.py::test_unauthorized_response_has_no_stacktrace", "executable": 1, "estimated": false}, {"name": "test_query_param_token_agrees_with_header", "line": 139, "cls": null, "epic": "GitLab 安全", "feature": "会话", "story": "Header 与 Query 传参的认证结论一致", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "`?private_token=` 与 Header 两种传参方式必须得出同一个认证结论。\n\n不一致意味着有一条旁路：比如 Header 走了校验、Query 参数被框架直接\n透传到某个内部调用里。这种问题在只测一种入口时永远发现不了。", "fixtures": ["target", "settings"], "estimate": 1, "id": "SEC-SESSION-006", "nodeid": "tests/security/test_session.py::test_query_param_token_agrees_with_header", "executable": 1, "estimated": false}], "collection_error": false}]}, {"key": "E2E", "name": "端到端流程测试", "desc": "跨资源真实业务流：议题全生命周期、项目从创建到归档的全链路。", "order": 3, "modules": [{"file": "tests/e2e/test_issue_lifecycle.py", "code": "ISSUE-LC", "name": "test_issue_lifecycle.py", "doc": "端到端：议题在两个客户端之间来回走一遍。\n\ne2e 的价值不在于\"多跑一遍功能\"，而在于证明**两套客户端说的是同一件事**：\nAPI 写进去的，界面能看见；界面上操作的，接口能查到。\n任何一端有自己的缓存 / 权限过滤 / 索引延迟，都会在这里现形——\n而单端的用例永远是绿的。\n\n所以每条用例都写成\"一头写、另一头读\"，绝不两头都用同一端。", "marks": ["e2e", "destructive", "requires_token"], "cases": [{"name": "test_issue_created_via_api_is_visible_in_ui", "line": 26, "cls": null, "epic": "端到端", "feature": "议题生命周期", "story": "API 创建的议题在 UI 上可见", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "API 写 → UI 读。", "fixtures": ["signed_in", "settings", "data_factory"], "estimate": 1, "id": "E2E-ISSUE-LC-001", "nodeid": "tests/e2e/test_issue_lifecycle.py::test_issue_created_via_api_is_visible_in_ui", "executable": 1, "estimated": false}, {"name": "test_issue_created_in_ui_is_queryable_and_closable", "line": 49, "cls": null, "epic": "端到端", "feature": "议题生命周期", "story": "UI 创建的议题 API 查得到，关闭后 UI 状态同步", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "UI 写 → API 读 → API 改 → UI 读。四个方向都走一遍。\n\n单向的 e2e（比如只验 UI 建的 API 能查到）价值有限：\n真实缺陷往往出在\"状态变更之后另一端的视图没更新\"上。", "fixtures": ["signed_in", "settings", "data_factory", "gl"], "estimate": 1, "id": "E2E-ISSUE-LC-002", "nodeid": "tests/e2e/test_issue_lifecycle.py::test_issue_created_in_ui_is_queryable_and_closable", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/e2e/test_project_lifecycle.py", "code": "PROJ-LC", "name": "test_project_lifecycle.py", "doc": "端到端：项目生命周期在 API 与 UI 之间的一致性。\n\ne2e 的定位是「证明两套客户端说的是同一件事」：\nAPI 建的数据 UI 能看见，API 删掉的 UI 上也要消失。\n它不重复验证单点功能，只验证串起来之后对不对。", "marks": ["e2e", "destructive", "requires_token"], "cases": [{"name": "test_project_created_via_api_is_visible_in_ui", "line": 22, "cls": null, "epic": "端到端", "feature": "项目生命周期", "story": "API 创建的项目在 UI 上可见", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["signed_in", "settings", "data_factory"], "estimate": 1, "id": "E2E-PROJ-LC-001", "nodeid": "tests/e2e/test_project_lifecycle.py::test_project_created_via_api_is_visible_in_ui", "executable": 1, "estimated": false}, {"name": "test_project_deleted_via_api_disappears_from_ui", "line": 43, "cls": null, "epic": "端到端", "feature": "项目生命周期", "story": "API 删除的项目从 UI 上消失", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "先看见、再删掉、再确认看不见。\n\n只测\"删完之后看不见\"是不够的：如果第一步的可见性本来就没生效\n（比如列表压根加载不出来），删完依然\"看不见\"，用例照样绿。\n所有\"消失类\"断言都必须先证明它**曾经出现过**。", "fixtures": ["signed_in", "settings", "data_factory", "gl"], "estimate": 1, "id": "E2E-PROJ-LC-002", "nodeid": "tests/e2e/test_project_lifecycle.py::test_project_deleted_via_api_disappears_from_ui", "executable": 1, "estimated": false}], "collection_error": false}]}, {"key": "PERF", "name": "性能门禁测试", "desc": "带阈值的 API 延迟门禁（P95/错误率），不达标即失败——没有判定标准的性能测试不叫测试。", "order": 4, "modules": [{"file": "tests/perf/test_api_perf.py", "code": "API-P95", "name": "test_api_perf.py", "doc": "性能门禁。\n\n设计原则：性能测试是「门禁」不是「压测报告」，所以它必须有通过/失败的判定，\n且判定阈值可从 CI 覆盖。没有阈值的性能测试等于没有测试。\n\n另外一个纪律：这组用例带 requires_token，\n**绝不能对公共实例（如 gitlab.com）跑并发请求**——那是对别人的服务发起攻击。", "marks": ["perf", "requires_token"], "cases": [{"name": "test_projects_list_latency", "line": 36, "cls": null, "epic": "性能", "feature": "API 响应", "story": "项目列表接口 P95 达标", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "settings", "perf_thresholds", "request"], "estimate": 1, "id": "PERF-API-P95-001", "nodeid": "tests/perf/test_api_perf.py::test_projects_list_latency", "executable": 1, "estimated": false}, {"name": "test_project_detail_latency", "line": 68, "cls": null, "epic": "性能", "feature": "API 响应", "story": "项目详情接口 P95 达标", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "a_project", "perf_thresholds", "request"], "estimate": 1, "id": "PERF-API-P95-002", "nodeid": "tests/perf/test_api_perf.py::test_project_detail_latency", "executable": 1, "estimated": false}, {"name": "test_no_rate_limit_storm", "line": 89, "cls": null, "epic": "性能", "feature": "API 稳定性", "story": "并发下不出现限流风暴", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "并发跑完之后，被限流的次数应该是 0。\n\n如果这里红了，说明测试的并发度超过了服务配额——\n要么调低并发，要么给测试账号提配额，不能靠重试硬扛。", "fixtures": ["gl", "perf_thresholds"], "estimate": 1, "id": "PERF-API-P95-003", "nodeid": "tests/perf/test_api_perf.py::test_no_rate_limit_storm", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/perf/test_perf_deep.py", "code": "DEEP", "name": "test_perf_deep.py", "doc": "性能门禁（第二组）：深分页 / 搜索 / 写路径 / 吞吐 / 抖动。\n\n第一组（test_api_perf.py）回答「接口快不快」；这一组回答另外四个问题：\n\n1. **深分页会不会越来越慢** —— 第一页 50ms、第五页 3s 是典型的\n   未加索引或 N+1 查询，只测第一页永远发现不了。\n2. **写路径能不能扛** —— 读写混跑时写入往往是被拖垮的那一方，\n   而只读压测报告一片绿会让人误判容量。\n3. **吞吐有没有下限** —— 延迟达标但 RPS 只有 2，说明连接池或线程被打满。\n4. **延迟稳不稳** —— P50 很快、P99 很慢，用户体验是「时快时慢」，\n   只看 P95 会被平均掉。\n\n纪律同第一组：绝不对公共实例跑并发请求。", "marks": ["perf", "requires_token"], "cases": [{"name": "test_deep_pagination_latency", "line": 33, "cls": null, "epic": "性能", "feature": "列表", "story": "深分页不出现性能塌陷", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "翻到第 3 页的耗时不应该比第 1 页差一个量级。\n\n这条用例专门抓「只有第一页快」：分页实现里 `OFFSET` 越大越慢、\n或每页都重算一遍权限，都会在这里现形，而在第一页上完全看不出来。", "fixtures": ["gl", "perf", "sampler_of", "perf_thresholds"], "estimate": 1, "id": "PERF-DEEP-001", "nodeid": "tests/perf/test_perf_deep.py::test_deep_pagination_latency", "executable": 1, "estimated": false}, {"name": "test_search_latency", "line": 58, "cls": null, "epic": "性能", "feature": "搜索", "story": "搜索接口 P95 达标", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "搜索是全站最重的只读接口之一（跨项目全文匹配）。\n\n单独给它一条用例，是因为它常常在别的接口都正常时先崩——\n而\"搜索很慢\"这种问题，用户会描述成\"系统卡\"，没人会想到是搜索接口。", "fixtures": ["gl", "perf", "perf_thresholds"], "estimate": 1, "id": "PERF-DEEP-002", "nodeid": "tests/perf/test_perf_deep.py::test_search_latency", "executable": 1, "estimated": false}, {"name": "test_mixed_read_workload", "line": 88, "cls": null, "epic": "性能", "feature": "混合负载", "story": "读写混合下只读接口仍达标", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "把三个高频只读端点混着压，模拟真实访问而不是单点打靶。\n\n单端点压测的问题是：每个接口各自都达标，合起来却互相抢资源。\n这里按比例轮转，测的是「一起访问时的表现」。", "fixtures": ["gl", "perf", "sampler_of", "perf_thresholds"], "estimate": 1, "id": "PERF-DEEP-003", "nodeid": "tests/perf/test_perf_deep.py::test_mixed_read_workload", "executable": 1, "estimated": false}, {"name": "test_throughput_floor", "line": 116, "cls": null, "epic": "性能", "feature": "吞吐", "story": "吞吐不低于下限", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "延迟达标不等于容量够。\n\n一个接口 P95 200ms 但每秒只能处理 2 个请求，压测报告照样全绿，\n上线后在真实并发下直接雪崩。所以吞吐必须单独设一道门。", "fixtures": ["gl", "perf", "sampler_of", "perf_thresholds"], "estimate": 1, "id": "PERF-DEEP-004", "nodeid": "tests/perf/test_perf_deep.py::test_throughput_floor", "executable": 1, "estimated": false}, {"name": "test_latency_jitter_is_bounded", "line": 140, "cls": null, "epic": "性能", "feature": "稳定性", "story": "延迟抖动在可接受范围", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "P99/P50 比值过大 = 用户体验时快时慢。\n\n这类问题在平均值和 P95 上都看不出来：\n一半请求 20ms、一成请求 2s，P95 可能还是 200ms。\n但用户遇到的是那 10%，他们只会说\"这系统很卡\"。\n\n本地单节点实例抖动本来就不小，所以阈值给得宽（默认 6 倍），\n目的是抓\"长尾失控\"而不是抓噪声。", "fixtures": ["gl", "perf", "sampler_of", "perf_thresholds"], "estimate": 1, "id": "PERF-DEEP-005", "nodeid": "tests/perf/test_perf_deep.py::test_latency_jitter_is_bounded", "executable": 1, "estimated": false}, {"name": "test_write_path_latency", "line": 169, "cls": null, "epic": "性能", "feature": "写路径", "story": "创建并删除项目的往返耗时达标", "severity": "normal", "marks": ["destructive"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "写入路径单独压：读写混跑时先垮的往往是写。\n\n样本刻意小（默认 6 次）——写操作会真的建项目，\n一轮压测建 60 个项目既慢又会给实例留下一堆垃圾。\n性能测试的目的是**发现趋势**，不是把实例压垮。\n\n每次采样都是「创建 → 立即永久删除」的完整往返，\n所以测的是一次真实业务写入的成本，而不是单次 HTTP 往返。", "fixtures": ["gl", "perf", "settings", "perf_thresholds"], "estimate": 1, "id": "PERF-DEEP-006", "nodeid": "tests/perf/test_perf_deep.py::test_write_path_latency", "executable": 1, "estimated": false}], "collection_error": false}]}, {"key": "UI", "name": "UI 测试（Playwright）", "desc": "页面级冒烟：登录、导航、项目与议题操作。只验证「界面能不能完成这件事」，不重复验证 API 已覆盖的业务规则。", "order": 5, "modules": [{"file": "tests/ui/test_issues_ui.py", "code": "ISSUE-UI", "name": "test_issues_ui.py", "doc": "议题（work items）相关的界面用例。\n\nGitLab 19 把议题迁到了 work items，路径从 /-/issues 变成 /-/work_items，\nDOM 也整套换掉了。这个文件的用例如果打老实例，页面对象里的回退选择器\n仍然有效——这就是为什么选择器要写成\"候选列表\"而不是单个字符串。\n\n这里刻意保留一条**失败路径**用例（空标题提交）：\n只看成功路径的界面测试等于没测——\n按钮点了、页面跳了，但\"该拦的没拦住\"这类缺陷一个都发现不了。", "marks": ["ui"], "cases": [{"name": "test_issues_page_renders", "line": 27, "cls": null, "epic": "GitLab UI", "feature": "议题", "story": "议题列表页能打开", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "议题列表页：有条目或有空态，二者必居其一。", "fixtures": ["signed_in", "settings", "data_factory"], "estimate": 1, "id": "UI-ISSUE-UI-001", "nodeid": "tests/ui/test_issues_ui.py::test_issues_page_renders", "executable": 1, "estimated": false}, {"name": "test_create_issue_via_ui", "line": 51, "cls": null, "epic": "GitLab UI", "feature": "议题", "story": "能在界面上新建议题", "severity": "critical", "marks": ["destructive"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "走界面建一条议题，然后回读确认真的建出来了。\n\n只断言\"提交后跳转了\"是不够的：按钮点了、页面也跳了，\n数据却可能压根没落库（前端吞掉了错误）。\n所以最后一步一定要回到数据上确认——UI 用例同样需要\"回读\"这一步。", "fixtures": ["signed_in", "settings", "data_factory", "gl"], "estimate": 1, "id": "UI-ISSUE-UI-002", "nodeid": "tests/ui/test_issues_ui.py::test_create_issue_via_ui", "executable": 1, "estimated": false}, {"name": "test_empty_title_is_rejected", "line": 84, "cls": null, "epic": "GitLab UI", "feature": "议题", "story": "空标题提交被拦住", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "标题留空提交，不应该创建成功。\n\n用 API 回读作判据而不是看页面提示：\n提示条的文案和 DOM 每个版本都在变，\n而\"库里有没有多出一条空标题议题\"是稳定的事实。", "fixtures": ["signed_in", "settings", "data_factory", "gl"], "estimate": 1, "id": "UI-ISSUE-UI-003", "nodeid": "tests/ui/test_issues_ui.py::test_empty_title_is_rejected", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/ui/test_login.py", "code": "LOGIN", "name": "test_login.py", "doc": "UI 冒烟：登录流程。\n\nUI 用例的纪律：\n1. 只验证「界面能不能完成这件事」，不重复验证 API 已经验证过的业务规则；\n2. 断言用「登录后跳转到了哪里」而不是「有没有报错条」——后者会有假阴性；\n3. 每条用例独立 context，失败自动留截图与 trace。", "marks": ["ui", "smoke"], "cases": [{"name": "test_login_page_renders", "line": 23, "cls": null, "epic": "GitLab UI", "feature": "登录", "story": "登录页可打开", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["page", "settings", "request"], "estimate": 1, "id": "UI-LOGIN-001", "nodeid": "tests/ui/test_login.py::test_login_page_renders", "executable": 1, "estimated": false}, {"name": "test_login_with_wrong_password_fails", "line": 43, "cls": null, "epic": "GitLab UI", "feature": "登录", "story": "错误密码登录失败", "severity": "critical", "marks": ["destructive"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "用错误密码登录必须失败，且不能进入已登录状态。\n\n这条用例的价值是验证「失败路径被正确拦截」——\n只看成功路径的 UI 测试等于没测。", "fixtures": ["page", "settings"], "estimate": 1, "id": "UI-LOGIN-002", "nodeid": "tests/ui/test_login.py::test_login_with_wrong_password_fails", "executable": 1, "estimated": false}, {"name": "test_login_success", "line": 64, "cls": null, "epic": "GitLab UI", "feature": "登录", "story": "正确凭据可登录", "severity": "blocker", "marks": ["requires_token"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "正确凭据登录成功。需要管理员密码，未配置时跳过。", "fixtures": ["page", "settings"], "estimate": 1, "id": "UI-LOGIN-003", "nodeid": "tests/ui/test_login.py::test_login_success", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/ui/test_navigation.py", "code": "NAV", "name": "test_navigation.py", "doc": "导航与会话：用户\"进不去\"和\"出得来\"这两件事。\n\n导航类用例最容易被写成\"点一下菜单看跳没跳\"，\n那样测的是前端路由，价值很低。这里只留三类真正会出事的：\n\n1. **未登录访问内页必须被拦** —— 这条红了就是事故级：\n   意味着有页面绕过了登录态校验。\n2. **会话失效后要被踢回登录页** —— 不是测\"登出按钮长什么样\"\n   （那个 DOM 每次改版都要重写），而是测\"没凭据就不能待在里面\"。\n3. **登录页不能有未捕获的 JS 异常** —— 前端报错往往只出现在控制台，\n   页面上看起来完全正常，等用户点某个按钮才发现整片功能不可用。", "marks": ["ui"], "cases": [{"name": "test_dashboard_requires_login", "line": 28, "cls": null, "epic": "GitLab UI", "feature": "访问控制", "story": "未登录访问内页被拦回登录页", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "未登录直接访问仪表盘，必须跳到登录页。\n\n用 URL 断言而不是\"页面上有登录框\"：\n有些实现会把内页渲染出来再弹一个模态框，\n数据其实已经发出去了——URL 没变就说明根本没有重定向。", "fixtures": ["web_target", "page", "settings"], "estimate": 1, "id": "UI-NAV-001", "nodeid": "tests/ui/test_navigation.py::test_dashboard_requires_login", "executable": 1, "estimated": false}, {"name": "test_cleared_session_is_kicked_out", "line": 50, "cls": null, "epic": "GitLab UI", "feature": "访问控制", "story": "会话失效后不能停留在内页", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "清掉 Cookie 再访问内页，必须回到登录页。\n\n刻意用\"清 Cookie\"而不是去点登出按钮：\n登出按钮的选择器每个大版本都在变（从链接变成表单再变成菜单项），\n为它维护选择器成本高、收益低；\n而\"没有会话凭据就应该被拦住\"这条语义是稳定的，\n用哪种方式失去凭据并不重要。", "fixtures": ["signed_in", "settings"], "estimate": 1, "id": "UI-NAV-002", "nodeid": "tests/ui/test_navigation.py::test_cleared_session_is_kicked_out", "executable": 1, "estimated": false}, {"name": "test_login_page_has_no_uncaught_errors", "line": 75, "cls": null, "epic": "GitLab UI", "feature": "前端健康", "story": "登录页无未捕获 JS 异常", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "登录页加载期间不能有未捕获的 JS 异常。\n\n只判 `pageerror`（未捕获异常），不判 console.error：\n后者里混着大量 404、favicon、第三方资源失败，\n强断言会变成天天红的噪声，最后没人看。\n而未捕获异常几乎总是真的坏了——它意味着某段脚本没跑完。", "fixtures": ["web_target", "page", "settings"], "estimate": 1, "id": "UI-NAV-003", "nodeid": "tests/ui/test_navigation.py::test_login_page_has_no_uncaught_errors", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/ui/test_projects_ui.py", "code": "PROJ-UI", "name": "test_projects_ui.py", "doc": "项目相关的界面用例。\n\nUI 层只回答一个问题：**用户能不能用界面完成这件事**。\n业务规则由 API 层验证过，这里不重复——\n重复验证的代价是每次 DOM 改动都要同时改两层，最后两层一起腐化。\n\n所以断言都落在\"界面状态\"上：列出来了 / 没列出来、过滤之后还剩几条、\n点进去标题对不对，而不是\"接口返回了什么\"。", "marks": ["ui"], "cases": [{"name": "test_projects_page_renders", "line": 25, "cls": null, "epic": "GitLab UI", "feature": "项目列表", "story": "登录后能看到项目列表区域", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "列表页要么有项目，要么有空态——但不能两者都没有。\n\n\"两者都没有\"是界面真的坏了（前端报错后白屏），\n而只断言\"有项目\"会在空实例上假红。", "fixtures": ["signed_in", "settings"], "estimate": 1, "id": "UI-PROJ-UI-001", "nodeid": "tests/ui/test_projects_ui.py::test_projects_page_renders", "executable": 1, "estimated": false}, {"name": "test_project_filter_narrows_list", "line": 50, "cls": null, "epic": "GitLab UI", "feature": "项目列表", "story": "按名字过滤能筛出目标项目", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "过滤一个真实存在的项目能留下它，过滤不存在的名字列表应为空。\n\n只测\"能搜到\"是不够的：如果过滤压根没生效、返回的还是全部列表，\n\"能搜到\"照样成立——那就成了假绿。所以必须配一条**反向断言**。", "fixtures": ["signed_in", "settings", "data_factory"], "estimate": 1, "id": "UI-PROJ-UI-002", "nodeid": "tests/ui/test_projects_ui.py::test_project_filter_narrows_list", "executable": 1, "estimated": false}, {"name": "test_project_detail_shows_name", "line": 84, "cls": null, "epic": "GitLab UI", "feature": "项目详情", "story": "能进入项目详情且标题正确", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "点进项目详情，页面上应当能看到项目名。", "fixtures": ["signed_in", "settings", "data_factory"], "estimate": 1, "id": "UI-PROJ-UI-003", "nodeid": "tests/ui/test_projects_ui.py::test_project_detail_shows_name", "executable": 1, "estimated": false}], "collection_error": false}]}, {"key": "SMOKE", "name": "冒烟测试", "desc": "部署就绪探针：健康检查、读写就绪、版本一致性。失败即表示「实例还没到能跑其余用例的状态」。", "order": 6, "modules": [{"file": "tests/smoke/test_health.py", "code": "HEALTH", "name": "test_health.py", "doc": "冒烟：只关心「服务活着、基本契约没破」。\n\n这一层的特点是**不依赖 Token**，因为它是部署后第一个要跑的东西——\n如果连冒烟都要先配好认证，那部署完就没法立刻验证。\n\n判定口径刻意宽松：只要不是 5xx 就算过。\n冒烟的职责是「发现完全不可用」，不是「发现质量下降」。", "marks": ["smoke", "api"], "cases": [{"name": "test_service_is_reachable", "line": 28, "cls": null, "epic": "GitLab 可用性", "feature": "系统健康", "story": "服务响应正常", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "服务必须在超时时间内给出非 5xx 响应。", "fixtures": ["anon_client", "settings"], "estimate": 1, "id": "SMOKE-HEALTH-001", "nodeid": "tests/smoke/test_health.py::test_service_is_reachable", "executable": 1, "estimated": false}, {"name": "test_version_endpoint_responds", "line": 50, "cls": null, "epic": "GitLab 可用性", "feature": "系统健康", "story": "版本接口可用", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "版本接口：200（公开）或 401（需要认证）都算正常，5xx 才是故障。\n\n自建 GitLab CE 默认公开此接口；gitlab.com 等公共实例会要求认证。\n这里不把 401 判为失败——它是鉴权策略，不是服务故障。", "fixtures": ["anon_client"], "estimate": 1, "id": "SMOKE-HEALTH-002", "nodeid": "tests/smoke/test_health.py::test_version_endpoint_responds", "executable": 1, "estimated": false}, {"name": "test_public_projects_list", "line": 75, "cls": null, "epic": "GitLab 可用性", "feature": "系统健康", "story": "项目列表接口可用", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "列出可见项目。匿名时返回公开项目，这本身就验证了鉴权边界没被写错。", "fixtures": ["anon_client"], "estimate": 1, "id": "SMOKE-HEALTH-003", "nodeid": "tests/smoke/test_health.py::test_public_projects_list", "executable": 1, "estimated": false}, {"name": "test_pagination_headers", "line": 97, "cls": null, "epic": "GitLab 可用性", "feature": "系统健康", "story": "分页元信息正确", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "分页头必须自洽：X-Per-Page 要等于请求值。\n\n这个断言拦的是「服务端忽略了 per_page 参数」这类缺陷——\n正文看起来正常，只有头信息对不上。", "fixtures": ["anon_client"], "estimate": 1, "id": "SMOKE-HEALTH-004", "nodeid": "tests/smoke/test_health.py::test_pagination_headers", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/smoke/test_readiness.py", "code": "READY", "name": "test_readiness.py", "doc": "部署后即时验证：服务活着、鉴权开着、错误体正常。\n\n冒烟层有两条硬纪律，写在最前面：\n\n1. **不依赖 Token**。它是部署完第一个要跑的东西，\n   如果连冒烟都要先配好认证，那部署完就没法立刻验证。\n\n2. **判定口径\"宽松但不空转\"**。\n   宽松是因为不同实例的公开策略不同（有的 /version 要认证，有的不要），\n   把策略差异判成失败会让冒烟天天红、最后没人看；\n   不空转是因为每条都必须有一个「真错了会红」的判据——\n   状态码属于 (200/401/403/404) 就过，但 5xx 和连接失败必须红。\n\n这组用例里最容易写错的是鉴权那几条：\n用「假 Token 访问 /user 必须 401」而不是「真 Token 能用」——\n后者在 Token 配错时会整片 skip，看起来风平浪静，实际什么都没验证。", "marks": ["smoke", "api"], "cases": [{"name": "test_health_probe_responds", "line": 38, "cls": null, "epic": "GitLab 可用性", "feature": "运维探针", "story": "健康检查端点不报 5xx", "severity": "blocker", "marks": [], "params": [{"argnames": "probe_path", "count": 3, "ids": ["/-/health", "/-/liveness", "/-/readiness"], "auto_ids": false}], "param_ids": ["/-/health", "/-/liveness", "/-/readiness"], "xfail": null, "skip": null, "doc": "运维探针只要不是 5xx、不是连不上，就算服务活着。\n\n为什么允许 404：这些端点受实例配置影响（有的只对监控网段开放、\n有的版本没开 readiness）。404 是\"这个探针没开\"，不是\"服务挂了\"。\n5xx 和连接失败才是真故障——判据收敛在这两点上，才不会天天误报。", "fixtures": ["probe", "probe_path"], "estimate": 3, "id": "SMOKE-READY-001", "nodeid": "tests/smoke/test_readiness.py::test_health_probe_responds", "executable": 3, "estimated": false}, {"name": "test_api_entrypoint_is_alive", "line": 61, "cls": null, "epic": "GitLab 可用性", "feature": "运维探针", "story": "API 入口存活", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "API 根命名空间必须能应答：200（公开）或 401（要认证）都算活着。", "fixtures": ["probe"], "estimate": 1, "id": "SMOKE-READY-002", "nodeid": "tests/smoke/test_readiness.py::test_api_entrypoint_is_alive", "executable": 1, "estimated": false}, {"name": "test_web_root_is_reachable", "line": 75, "cls": null, "epic": "GitLab 可用性", "feature": "运维探针", "story": "Web 根路径可达", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "网页端也要活着。\n\n只测 API 是不够的：Nginx 配错时常见「API 全通、页面全 502」，\n而用户报障的第一句话永远是\"网页打不开\"。", "fixtures": ["probe"], "estimate": 1, "id": "SMOKE-READY-003", "nodeid": "tests/smoke/test_readiness.py::test_web_root_is_reachable", "executable": 1, "estimated": false}, {"name": "test_missing_token_cannot_read_user", "line": 93, "cls": null, "epic": "GitLab 可用性", "feature": "鉴权", "story": "无凭据读用户被拒", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "不带任何凭据读 /user，必须是 401。\n\n这条红的唯一可能是「鉴权被关了」——那是比服务宕机更严重的事故，\n因为它往往意味着有人为了图方便改了配置却没人发现。", "fixtures": ["probe"], "estimate": 1, "id": "SMOKE-READY-004", "nodeid": "tests/smoke/test_readiness.py::test_missing_token_cannot_read_user", "executable": 1, "estimated": false}, {"name": "test_bogus_token_is_rejected", "line": 111, "cls": null, "epic": "GitLab 可用性", "feature": "鉴权", "story": "假 Token 被拒绝", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "形似而实非的 Token 必须被拒：证明服务端**真的在校验 Token**。\n\n只测「无凭据被拒」还不够——那只能证明\"没带不行\"，\n证明不了\"带了假的也不行\"。这两者在实现上是两条不同的分支。", "fixtures": ["bogus_client"], "estimate": 1, "id": "SMOKE-READY-005", "nodeid": "tests/smoke/test_readiness.py::test_bogus_token_is_rejected", "executable": 1, "estimated": false}, {"name": "test_malformed_token_is_rejected", "line": 127, "cls": null, "epic": "GitLab 可用性", "feature": "鉴权", "story": "畸形凭据被拒绝", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "把 OAuth 的 `Bearer` 前缀塞进 PRIVATE-TOKEN 头，必须被拒。\n\n这类\"用错认证方式\"的请求最容易撞上实现里的兜底分支：\n有的服务端遇到不认识的 scheme 会走「当作没有」而不是「当作无效」，\n两者的差别就是「默认拒绝」和「默认放行」。", "fixtures": ["probe"], "estimate": 1, "id": "SMOKE-READY-006", "nodeid": "tests/smoke/test_readiness.py::test_malformed_token_is_rejected", "executable": 1, "estimated": false}, {"name": "test_anonymous_write_is_rejected", "line": 144, "cls": null, "epic": "GitLab 可用性", "feature": "鉴权", "story": "匿名写操作被拒", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "匿名创建项目必须失败。\n\n「读可以不鉴权」是产品策略，「写可以不鉴权」是缺陷。\n这条用例是这两者的分界线，不能合并进上一条。", "fixtures": ["anon_client", "settings"], "estimate": 1, "id": "SMOKE-READY-007", "nodeid": "tests/smoke/test_readiness.py::test_anonymous_write_is_rejected", "executable": 1, "estimated": false}, {"name": "test_unknown_endpoint_returns_error_envelope", "line": 163, "cls": null, "epic": "GitLab 可用性", "feature": "错误语义", "story": "未知端点返回标准错误信封", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "访问不存在的端点：404 + 形如 {\"message\": ...} 的信封。\n\n断言信封而不只是状态码，是因为客户端代码普遍依赖 `message` 字段——\n哪天服务端改成 {\"error\": ...} 或返回 HTML 错误页，\n状态码还是 404，但调用方会全线炸在解析上。", "fixtures": ["anon_client"], "estimate": 1, "id": "SMOKE-READY-008", "nodeid": "tests/smoke/test_readiness.py::test_unknown_endpoint_returns_error_envelope", "executable": 1, "estimated": false}, {"name": "test_error_body_has_no_stacktrace", "line": 186, "cls": null, "epic": "GitLab 可用性", "feature": "错误语义", "story": "错误响应不吐堆栈", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "错误响应里不能出现堆栈 / SQL / 内部路径。\n\n这是「信息泄露」的冒烟版：不用专门的扫描器，\n只看最常见的 401/404 有没有把内部实现吐出来。", "fixtures": ["anon_client"], "estimate": 1, "id": "SMOKE-READY-009", "nodeid": "tests/smoke/test_readiness.py::test_error_body_has_no_stacktrace", "executable": 1, "estimated": false}, {"name": "test_version_matches_metadata", "line": 212, "cls": null, "epic": "GitLab 可用性", "feature": "版本一致性", "story": "/version 与 /metadata 报同一个版本", "severity": "normal", "marks": ["requires_token"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "两个版本接口必须报同一个版本号。\n\n升级过程中（尤其是灰度 / 多节点）这两个接口来自不同的数据源，\n对不上说明有节点没升上去，而这种问题在功能测试里完全看不出来。", "fixtures": ["gl"], "estimate": 1, "id": "SMOKE-READY-010", "nodeid": "tests/smoke/test_readiness.py::test_version_matches_metadata", "executable": 1, "estimated": false}], "collection_error": false}]}, {"key": "UNIT", "name": "框架自检测试", "desc": "不依赖 GitLab 实例的自检：YAML 用例数据写坏会响（而不是静默少跑）、分页扫描器等框架组件的正确性。", "order": 7, "modules": [{"file": "tests/unit/test_framework.py", "code": "FW", "name": "test_framework.py", "doc": "框架自检：不依赖任何 GitLab 实例，永远可跑。\n\n这一层的意义是「框架本身的正确性」，和被测系统无关：\n百分位算法算错了、阈值判定写反了、契约校验漏了——这些错误\n如果只能靠跑真实环境才能发现，那排查成本会非常高。", "marks": [], "cases": [{"name": "test_p95_of_sequential_data", "line": 21, "cls": "TestPercentile", "epic": null, "feature": null, "story": null, "severity": "normal", "marks": [], "params": [], "pa , "params": [{"argnames": "path", "count": null, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "加载器会在字段拼错 / 缺必填 / id 重复时直接抛，这里兜住这些情况。", "fixtures": ["path"], "estimate": 1, "id": "UNIT-DATA-CHK-001", "nodeid": "tests/test_case_data.py::test_case_file_is_loadable", "executable": 3, "estimated": false}, {"name": "test_expectations_are_not_self_defeating", "line": 39, "cls": null, "epic": null, "feature": null, "story": null, "severity": "normal", "marks": [], "params": [{"argnames": "path", "count": null, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "`expect: [200, 400]` 是最常见的自欺写法：两种结果都通过，等于没测。\n\n校验规则：一个期望集合里不能既有 2xx 又有 4xx/5xx。\n确实存在\"两种实现都说得通\"的情况（比如 per_page 超限可以 400 也可以\n归一到 100），那种情况应当写两条用例、各自只认一种结果，\n而不是写一条\"怎样都行\"的。", "fixtures": ["path"], "estimate": 1, "id": "UNIT-DATA-CHK-002", "nodeid": "tests/test_case_data.py::test_expectations_are_not_self_defeating", "executable": 3, "estimated": false}, {"name": "test_no_case_declares_both_success_and_failure_message", "line": 56, "cls": null, "epic": null, "feature": null, "story": null, "severity": "normal", "marks": [], "params": [{"argnames": "path", "count": null, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "expect_msg 只在失败码用例上有意义。\n\n给\"期望 200\"的用例配 expect_msg 是自相矛盾的——成功响应里\n不会有错误消息，子串匹配永远失败，或者更糟：匹配上了别的内容。", "fixtures": ["path"], "estimate": 1, "id": "UNIT-DATA-CHK-003", "nodeid": "tests/test_case_data.py::test_no_case_declares_both_success_and_failure_message", "executable": 3, "estimated": false}, {"name": "test_get_cases_carry_no_body", "line": 70, "cls": null, "epic": null, "feature": null, "story": null, "severity": "normal", "marks": [], "params": [{"argnames": "path", "count": null, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "GET 用例带 body 是个安静的错误：请求体被忽略，用例在测别的东西。\n\n这类用例会绿——因为它真能发出去、也真能拿到 200——\n只是它验证的那条规则从未被执行过。", "fixtures": ["path"], "esti const PRIO = {blocker:["P0","p0"],critical:["P1","p1"],normal:["P2","p2"],
              minor:["P3","p3"],trivial:["P4","p4"]};
const PRIO_NAME = {blocker:"P0 阻断",critical:"P1 严重",normal:"P2 一般",
                   minor:"P3 次要",trivial:"P4 轻微"};
const LS_KEY = "gqa-inventory-v1";

/* ---------- 状态 ---------- */
let S = {q:"", suites:new Set(), sevs:new Set(), defectOnly:false,
         open:new Set(), mods:new Set()};
try{
  const saved = JSON.parse(localStorage.getItem(LS_KEY)||"null");
  if(saved){ S.q=saved.q||""; S.suites=new Set(saved.suites||[]);
    S.sevs=new Set(saved.sevs||[]); S.defectOnly=!!saved.defectOnly;
    S.open=new Set(saved.open||[]); S.mods=new Set(saved.mods||[]); }
}catch(e){}
function save(){
  try{localStorage.setItem(LS_KEY, JSON.stringify({
    q:S.q, suites:[...S.suites], sevs:[...S.sevs], defectOnly:S.defectOnly,
    open:[...S.open].slice(-40), mods:[...S.mods]}));}catch(e){}
}

/* ---------- 工具 ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function prioBadge(sev){
  const [lbl, cls] = PRIO[sev]||PRIO.normal;
  return `<span class="prio ${cls}" title="${esc(PRIO_NAME[sev]||"")}">${lbl}</span>`;
}
const methods = new Set(["GET","POST","PUT","PATCH","DELETE"]);
function methodTag(m){
  const up = String(m||"").toUpperCase();
  if(!methods.has(up)) return `<span class="mth">${esc(m)}</span>`;
  return `<span class="mth ${up}">${up}</span>`;
}
const SVG_CARET = '<svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- 全量展平 ---------- */
const FLAT = [];
DATA.suites.forEach(su => su.modules.forEach(m => m.cases.forEach(c => {
  FLAT.push({su, m, c});
})));

function caseVisible({su,m,c}){
  if(S.suites.size && !S.suites.has(su.key)) return false;
  if(S.sevs.size && !S.sevs.has(c.severity)) return false;
  if(S.defectOnly && !c.xfail) return false;
  if(S.q){
    const hay = [c.id,c.name,c.story,c.doc,c.feature,
      ...(c.marks||[]),m.code,m.name,su.name].join(" ").toLowerCase();
    if(!hay.includes(S.q)) return false;
  }
  return true;
}

/* ---------- 头部统计 ---------- */
(function header(){
  const st = DATA.stats;
  document.getElementById("subline").textContent =
    DATA.project + " · 覆盖 " + st.total_funcs + " 个测试函数 / "
    + st.total_exec + " 条可执行用例 / " + DATA.suites.length + " 个测试套件";
  document.getElementById("gen-time").textContent =
    "清单生成时间：" + st.generated + "　·　工具：tools/export_case_inventory.py";
  const chips = [
    ["套件", DATA.suites.length, ""],
    ["测试函数", st.total_funcs, ""],
    ["可执行用例", st.total_exec, ""],
    ["YAML 矩阵用例", st.yaml_total, ""],
  ];
  if(st.xfail) chips.push(["已知缺陷 xfail", st.xfail, "warn"]);
  if(st.skips) chips.push(["显式跳过条件", st.skips, "neutral"]);
  if(st.collection_errors.length)
    chips.push(["收集报错文件 " + st.collection_errors.length, "", "neutral"]);
  document.getElementById("metachips").innerHTML = chips.map(c =>
    `<span class="chip ${c[2]}">${esc(c[0])} ${c[1]!==""?("<b>"+c[1]+"</b>"):""}</span>`
  ).join("").replace(/<\/b><b>/g,"</b> <b>");

  const sevRow = Object.entries(st.sev_exec).sort(
    (a,b)=> (PRIO[a[0]]||PRIO.normal)[0].localeCompare((PRIO[b[0]]||PRIO.normal)[0]));
  const sevTotal = sevRow.reduce((s,x)=>s+x[1],0)||1;
  let sevBar = '<div style="display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:12px">';
  sevBar += sevRow.map(([sev,n])=>{
    const [lbl,cls]=PRIO[sev]||PRIO.normal;
    const colors={p0:"var(--p0)",p1:"var(--p1)",p2:"var(--p2)",p3:"var(--p3)",p4:"var(--p4)"};
    return `<div title="${esc(PRIO_NAME[sev]||sev)} ${n} 条" style="flex:${n/sevTotal};background:${colors[cls]}"></div>`;
  }).join("") + "</div>";
  sevBar += '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--ink-2)">'
    + sevRow.map(([sev,n])=>{
      const [lbl,cls]=PRIO[sev]||PRIO.normal;
      return `<span><span class="prio ${cls}" style="margin-right:5px">${lbl}</span>${esc(PRIO_NAME[sev]||sev)} · ${n} 条</span>`;
    }).join("") + "</div>";

  const cards = [
    `<div class="stat"><div class="num">${st.total_exec}</div><div class="lbl">可执行用例总数</div></div>`,
    `<div class="stat"><div class="num">${st.total_funcs}</div><div class="lbl">测试函数</div></div>`,
    `<div class="stat"><div class="num">${st.yaml_total}</div><div class="lbl">YAML 数据驱动用例</div></div>`,
  ];
  if(st.xfail) cards.push(`<div class="stat warn"><div class="num">${st.xfail}</div><div class="lbl">已知缺陷（xfail 固化）</div></div>`);
  if(st.skips) cards.push(`<div class="stat ok"><div class="num">${st.skips}</div><div class="lbl">显式跳过条件用例</div></div>`);
  cards.push(`<div class="stat" style="grid-column:span 2;min-width:100%">
    <div class="lbl" style="margin:0"><b style="color:var(--ink)">优先级分布（按可执行条数）</b></div>${sevBar}</div>`);
  document.getElementById("stats").innerHTML = cards.join("");
})();

/* ---------- 过滤器 ---------- */
(function filters(){
  const suBox = document.getElementById("suite-filter");
  DATA.stats.per_suite.forEach(p=>{
    const b=document.createElement("button");
    b.className="fbtn"; b.dataset.suite=p.key;
    b.innerHTML = esc(p.name)+` <span class="n">${p.exec}</span>`;
    b.onclick=()=>{ S.suites.has(p.key)?S.suites.delete(p.key):S.suites.add(p.key); render(); };
    suBox.appendChild(b);
  });
  const sevBox=document.getElementById("sev-filter");
  Object.keys(PRIO).forEach(sev=>{
    const n=(DATA.stats.sev_exec[sev]||0); if(!n) return;
    const [lbl,cls]=PRIO[sev];
    const b=document.createElement("button");
    b.className="fbtn "+cls; b.dataset.sev=sev;
    b.innerHTML=`${lbl} <span class="n">${n}</span>`;
    b.onclick=()=>{ S.sevs.has(sev)?S.sevs.delete(sev):S.sevs.add(sev); render(); };
    sevBox.appendChild(b);
  });
  document.getElementById("n-defect").textContent=DATA.stats.xfail_exec;
  document.getElementById("fx-defect").onclick=()=>{
    S.defectOnly=!S.defectOnly; render(); };
  document.getElementById("fx-reset").onclick=()=>{
    S={q:"",suites:new Set(),sevs:new Set(),defectOnly:false,
       open:new Set(),mods:new Set()};
    document.getElementById("q").value="";
    render(); };
  const qi=document.getElementById("q");
  qi.value=S.q;
  qi.addEventListener("input",()=>{ S.q=qi.value.trim().toLowerCase(); render(); });
})();

function syncFilterButtons(){
  document.querySelectorAll("#suite-filter .fbtn").forEach(b=>
    b.classList.toggle("on", S.suites.has(b.dataset.suite)));
  document.querySelectorAll("#sev-filter .fbtn").forEach(b=>
    b.classList.toggle("on", S.sevs.has(b.dataset.sev)));
  document.getElementById("fx-defect").classList.toggle("on", S.defectOnly);
}

/* ---------- 主体渲染 ---------- */
function caseRow(entry){
  const {su,m,c}=entry;
  const open=S.open.has(c.id);
  const title=c.story
    || ((c.cls ? c.cls.replace(/^Test/,"")+" · " : "") + c.name);
  const firstDoc=(c.doc||"").split(/\n\s*\n/)[0]||"";
  const n=c.executable;
  const tags=[];
  if(c.xfail) tags.push(`<span class="tag xf">已知缺陷</span>`);
  if(c.skip) tags.push(`<span class="tag sk">跳过条件</span>`);
  if(c.estimated) tags.push(`<span class="tag est">条数估算</span>`);
  (c.marks||[]).forEach(t=>{ if(!["api","security"].includes(t)) tags.push(`<span class="tag">${esc(t)}</span>`); });
  if(c.params.length) tags.push(`<span class="tag">参数化×${c.params.length}</span>`);
  let html=`<tr class="case ${open?"open":""}" data-id="${esc(c.id)}">
    <td class="cid">${esc(c.id)}</td>
    <td><div class="ctitle">${esc(title)}</div>${firstDoc?`<div class="cdesc">${esc(firstDoc)}</div>`:""}</td>
    <td>${prioBadge(c.severity)}</td>
    <td><div class="tags">${tags.join("")||'<span class="tag">—</span>'}</div></td>
    <td class="cnum">${n>1?`<b>${n}</b> 条`:n+" 条"}</td>
  </tr>`;
  if(open){
    const p=c.params.map(p=>`<code>${esc(p.argnames)}：${p.count?p.count+" 组":""}${p.ids&&p.ids.length?"（"+p.ids.map(esc).join("、")+"）":""}</code>`).join("");
    html+=`<tr class="detail"><td colspan="5"><div class="detail-box">
      <div class="detail-grid">
        <div class="kv"><b>pytest 节点</b><code>${esc(c.nodeid)}</code></div>
        <div class="kv"><b>源码位置</b><code>${esc(c.nodeid.split("::")[0])}:${c.line}</code></div>
        <div class="kv"><b>功能域</b>${esc(c.feature||"—")} ${c.epic?`· ${esc(c.epic)}`:""}</div>
        <div class="kv"><b>依赖 fixtures</b>${(c.fixtures||[]).map(f=>`<code>${esc(f)}</code>`).join("")}</div>
        ${p?`<div class="kv" style="grid-column:1/-1"><b>参数化</b>${p}</div>`:""}
      </div>
      ${c.doc?`<div class="doc">${esc(c.doc)}</div>`:""}
      ${c.xfail?`<div class="xf-box"><b>已知缺陷（xfail）</b>　${c.xfail.strict?"strict=True（修复后 XPASS 会变红提醒去掉标记）":"strict=False"}<br>${esc(c.xfail.reason)}</div>`:""}
      ${c.skip?`<div class="xf-box" style="background:var(--p1-bg);color:var(--p1)"><b>跳过条件</b>　${esc(c.skip.reason||"（见源码）")}</div>`:""}
    </div></td></tr>`;
  }
  return html;
}

function render(){
  syncFilterButtons(); save();
  const vis = FLAT.filter(caseVisible);
  const perSuite = new Map();
  vis.forEach(e=>{
    if(!perSuite.has(e.su.key)) perSuite.set(e.su.key,{su:e.su,mods:new Map(),total:0});
    const g=perSuite.get(e.su.key); g.total+=e.c.executable;
    if(!g.mods.has(e.m)) g.mods.set(e.m,[]); g.mods.get(e.m).push(e);
  });
  document.getElementById("count-hint").textContent =
    `显示 ${vis.reduce((s,e)=>s+e.c.executable,0)} / ${DATA.stats.total_exec} 条`;

  const main=document.getElementById("main");
  if(!vis.length){ main.innerHTML='<div class="panel"><div class="empty">没有匹配的用例</div></div>'; renderPanels(); return; }

  let html="";
  DATA.suites.forEach(su=>{
    const g=perSuite.get(su.key);
    if(!g) return;
    const suiteVisibleFuncs=g.mods.size;
    const suiteExec=g.total;
    html+=`<section class="suite" id="suite-${su.key}">
      <div class="suite-head">
        <h2>${esc(su.name)}</h2>
        <span class="tag">${su.key}</span>
        <span class="tag">${suiteVisibleFuncs} 个模块</span>
        <span class="tag">${suiteExec} 条可执行</span>
      </div>
      <div class="suite-desc">${esc(su.desc)}</div>`;
    [...g.mods.keys()].sort((a,b)=>a.file<b.file?-1:1).forEach(m=>{
      const entries=g.mods.get(m);
      const modOpen = !S.mods.size || S.mods.has(m.file);
      html+=`<div class="module ${modOpen?"open":""}" id="mod-${m.code}">
        <div class="mod-head" data-file="${esc(m.file)}">
          ${SVG_CARET}
          <span class="mod-code">${esc(m.code)}</span>
          <span class="mod-file">${esc(m.name)}</span>
          <span class="mod-count">${entries.length} 条用例</span>
        </div>
        <div class="mod-body">
          ${m.doc?`<div class="mod-doc">${esc(m.doc)}</div>`:""}
          ${m.collection_error?`<div class="mod-doc" style="color:var(--warn)">⚠ 此文件在收集时报错，可执行条数为估算值</div>`:""}
          <table>
            <thead><tr><th style="width:120px">编号</th><th>用例</th>
              <th style="width:52px">优先级</th><th style="width:180px">标签</th>
              <th style="width:70px;text-align:right">条数</th></tr></thead>
            <tbody>${entries.map(caseRow).join("")}</tbody>
          </table>
        </div>
      </div>`;
    });
    html+="</section>";
  });
  main.innerHTML=html;
  renderPanels();

  main.querySelectorAll(".case").forEach(tr=>{
    tr.addEventListener("click",()=>{
      const id=tr.dataset.id;
      S.open.has(id)?S.open.delete(id):S.open.add(id); render();
    });
  });
  main.querySelectorAll(".mod-head").forEach(h=>{
    h.addEventListener("click",()=>{
      const f=h.dataset.file;
      S.mods.has(f)?S.mods.delete(f):S.mods.add(f);
      h.parentElement.classList.toggle("open");
      save();
    });
  });
}

        <td class="reason">${esc(x.reason)}</td>

  }

    html+=`<div class="panel panel-extra">
      <h3><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--p1)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        显式跳过条件 <span class="n">${DATA.skip_cases.length} 条</span></h3>
      <div class="pdesc">在什么条件下不执行——跳过是有语义的：缺第二身份、实例未配置某能力时，相关用例没有验证价值。</div>
      <table><thead><tr><th style="width:130px">编号</th><th style="width:240px">用例</th>
        <th>跳过原因</th></tr></thead><tbody>
      ${DATA.skip_cases.map(x=>`<tr><td class="cid">${esc(x.id)}</td>
        <td class="ctitle" style="font-size:13px">${esc(x.title)}</td>
        <td class="reason">${esc(x.reason||"（见源码条件）")}</td></tr>`).join("")}
      </tbody></table></div>`;
  }
  if(DATA.matrices.length){
    html+=`<div class="panel panel-extra" id="matrices">
      <h3><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
        数据驱动矩阵（YAML）<span class="n">${DATA.stats.yaml_total} 条</span></h3>
      <div class="pdesc">由 <code style="font-family:var(--mono)">tests/api/test_data_driven.py</code> 经 <code style="font-family:var(--mono)">cases</code> 标记装载执行；期望值全部来自实测。YAML 数据写坏由框架自检（UNIT-DATA-CHK）拦截，不会静默少跑。</div>`;
    DATA.matrices.forEach(mx=>{
      html+=`<div style="padding:4px 16px 14px">
        <div style="display:flex;align-items:center;gap:10px;margin:10px 0 6px">
          <span class="mod-code">${esc(mx.file.split("/").pop())}</span>
          <b style="font-size:14px">${esc(mx.title)}</b>
          <span style="font-size:12px;color:var(--ink-3)">${mx.cases.length} 条</span>
        </div>
        <table><thead><tr><th style="width:150px">用例 ID</th><th style="width:70px">方法</th>
          <th>目标与说明</th><th style="width:90px">期望状态码</th><th style="width:60px">说明匹配</th></tr></thead><tbody>
        ${mx.cases.map(c=>`<tr><td class="cid">${esc(c.id)}</td>
          <td>${methodTag(c.method)}</td>
          <td><div class="pcell">${esc(c.path)}</div>
            <div style="font-size:12.5px;color:var(--ink-2)">${esc(c.desc)}</div>
            ${c.skip?'<span class="tag sk" style="margin-top:3px;display:inline-block">跳过</span>':""}</td>
          <td class="cnum" style="text-align:left">${Array.isArray(c.expect)?esc(c.expect.join(" / ")):esc(c.expect)}</td>
          <td>${c.expect_msg?'<span class="tag">子串匹配</span>':'<span class="tag">—</span>'}</td></tr>`).join("")}
        </tbody></table></div>`;
    });
    html+="</div>";
  }
  main.insertAdjacentHTML("beforeend", html);
}

/* ---------- 侧边导航 ---------- */
(function nav(){
  const nav=document.getElementById("sidenav");
  let html='<div class="nav-title">套件</div>';
  DATA.stats.per_suite.forEach(p=>{
    html+=`<a href="#suite-${p.key}"><span>${esc(p.name)}</span><span class="n">${p.exec}</span></a>`;
  });
  if(DATA.xfail_cases.length)
    html+=`<a href="#defects"><span>已知缺陷</span><span class="n">${DATA.xfail_cases.length}</span></a>`;
  if(DATA.matrices.length)
    html+=`<a href="#matrices"><span>数据矩阵</span><span class="n">${DATA.stats.yaml_total}</span></a>`;
  nav.innerHTML=html;
})();

render();
</script>
</body>
</html>
