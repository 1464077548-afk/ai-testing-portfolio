<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitLab QA · 测试用例清单</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2430; --ink-2:#5a6474; --ink-3:#8a93a5;
  --line:#e4e7ec; --accent:#3b6ef5; --accent-soft:#eaf0fe;
  --p0:#d92d20; --p0-bg:#fee4e2; --p1:#d97706; --p1-bg:#fef0c7;
  --p2:#3b6ef5; --p2-bg:#eaf0fe; --p3:#667085; --p3-bg:#eceef1;
  --p4:#98a2b3; --p4-bg:#f2f4f7;
  --ok:#067647; --ok-bg:#e7f6ee; --warn:#b54708; --warn-bg:#fef4e6;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#10141c; --panel:#181e29; --ink:#e8ecf3; --ink-2:#a7b0c0; --ink-3:#78829a;
    --line:#2a3244; --accent:#6b93ff; --accent-soft:#1d2740;
    --p0:#ff6b5e; --p0-bg:#3a1c1a; --p1:#f7b955; --p1-bg:#382a14;
    --p2:#6b93ff; --p2-bg:#1c2740; --p3:#9aa5bb; --p3-bg:#232a38;
    --p4:#7c879e; --p4-bg:#1e2430;
    --ok:#4ade9e; --ok-bg:#12291d; --warn:#ffb763; --warn-bg:#332512;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}
a{color:var(--accent);text-decoration:none}

/* ---------- 头部 ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:28px 24px 20px}
.wrap{max-width:1280px;margin:0 auto}
.head-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:11px;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
h1{font-size:22px;font-weight:700;letter-spacing:.3px}
.sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.meta-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);
  color:var(--accent);border-radius:20px;padding:4px 12px;font-size:12.5px;
  font-weight:600}
.chip.neutral{background:var(--p4-bg);color:var(--ink-2)}

/* ---------- 统计卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-top:18px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 16px}
.stat .num{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:12px;color:var(--ink-2);margin-top:1px}
.stat.warn .num{color:var(--warn)}
.stat.ok .num{color:var(--ok)}

/* ---------- 工具栏 ---------- */
.toolbar{position:sticky;top:0;z-index:50;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 24px;
  box-shadow:0 2px 8px rgba(16,24,40,.05)}
.toolbar-in{max-width:1280px;margin:0 auto;display:flex;gap:10px;
  flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--bg)}
.search input{border:none;outline:none;background:transparent;color:var(--ink);
  width:100%;font-size:14px}
.search svg{flex:none;opacity:.55}
.fgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
  border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;
  user-select:none;white-space:nowrap;font-weight:500;transition:all .15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.fbtn .n{opacity:.65;margin-left:4px;font-size:11.5px}
.fdivider{width:1px;height:20px;background:var(--line);margin:0 2px}
.count-hint{font-size:12.5px;color:var(--ink-3);white-space:nowrap}

/* ---------- 主体布局 ---------- */
.layout{max-width:1280px;margin:0 auto;display:grid;
  grid-template-columns:1fr;gap:20px;padding:20px 24px 60px}
@media(min-width:1024px){
  .layout{grid-template-columns:250px 1fr;align-items:start}
  .sidenav{position:sticky;top:64px;max-height:calc(100vh - 84px);
    overflow-y:auto;scrollbar-width:thin}
}
.sidenav{display:none}
@media(min-width:1024px){.sidenav{display:block}}
.sidenav .nav-title{font-size:11px;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:1px;margin:14px 0 6px;font-weight:700}
.sidenav a{display:flex;justify-content:space-between;gap:8px;
  padding:5px 10px;border-radius:7px;color:var(--ink-2);font-size:13px}
.sidenav a:hover{background:var(--accent-soft);color:var(--accent)}
.sidenav a .n{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- 套件/模块 ---------- */
.suite{margin-bottom:34px}
.suite-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:8px;border-bottom:2px solid var(--accent);margin-bottom:14px}
.suite-head h2{font-size:19px;font-weight:700}
.suite-head .tag{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.suite-desc{color:var(--ink-2);font-size:13.5px;margin:-6px 0 14px;max-width:820px}
.module{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.mod-head{display:flex;align-items:center;gap:10px;padding:12px 16px;
  cursor:pointer;user-select:none}
.mod-head:hover{background:var(--accent-soft)}
.mod-code{font-family:var(--mono);font-size:11.5px;font-weight:700;
  background:var(--accent-soft);color:var(--accent);padding:2px 8px;
  border-radius:6px;white-space:nowrap}
.mod-file{font-weight:600;font-size:14px}
.mod-count{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.mod-doc{padding:0 16px 10px;color:var(--ink-2);font-size:13px;
  border-bottom:1px solid var(--line);white-space:pre-wrap}
.mod-doc:empty{display:none}

/* ---------- 用例表 ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--ink-3);text-align:left;font-weight:600;
  padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  letter-spacing:.4px;text-transform:uppercase}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.case{cursor:pointer}
tr.case:hover td{background:var(--accent-soft)}
tr.case.open td{background:var(--accent-soft)}
.cid{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.ctitle{font-weight:600;font-size:13.5px}
.cdesc{color:var(--ink-2);font-size:12.5px;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prio{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;
  border-radius:12px;white-space:nowrap}
.p0{background:var(--p0-bg);color:var(--p0)}.p1{background:var(--p1-bg);color:var(--p1)}
.p2{background:var(--p2-bg);color:var(--p2)}.p3{background:var(--p3-bg);color:var(--p3)}
.p4{background:var(--p4-bg);color:var(--p4)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--p4-bg);
  color:var(--ink-2);white-space:nowrap}
.tag.xf{background:var(--p0-bg);color:var(--p0);font-weight:700}
.tag.sk{background:var(--p1-bg);color:var(--p1)}
.tag.est{background:var(--warn-bg);color:var(--warn)}
.cnum{font-variant-numeric:tabular-nums;font-size:13px;text-align:right;
  white-space:nowrap;color:var(--ink-2)}
.cnum b{font-size:14px;color:var(--ink)}

/* ---------- 展开详情 ---------- */
tr.detail td{background:var(--bg);padding:14px 16px}
.detail-box{border-left:3px solid var(--accent);padding-left:14px}
.detail-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media(min-width:720px){.detail-grid{grid-template-columns:1fr 1fr}}
.kv{font-size:12.5px}
.kv b{color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;display:block;margin-bottom:2px}
.kv code{font-family:var(--mono);font-size:12px;background:var(--panel);
  border:1px solid var(--line);padding:2px 7px;border-radius:5px;
  word-break:break-all;display:inline-block;margin:2px 4px 2px 0}
.doc{font-size:13px;color:var(--ink-2);white-space:pre-wrap;margin-top:8px;
  padding:10px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px}
.xf-box{margin-top:8px;padding:10px 12px;border-radius:8px;
  background:var(--p0-bg);color:var(--p0);font-size:12.5px}
.xf-box b{font-weight:800}

/* ---------- 缺陷/跳过/矩阵 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:18px;box-shadow:var(--shadow)}
.panel>h3{padding:14px 16px 10px;font-size:16px;display:flex;
  align-items:center;gap:8px}
.panel>h3 .n{font-size:12px;color:var(--ink-3);font-weight:500}
.panel .pdesc{padding:0 16px 12px;color:var(--ink-2);font-size:13px}
.reason{font-size:12.5px;color:var(--ink-2);max-width:560px}
.badge{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:10px}
.badge.strict{background:var(--p0-bg);color:var(--p0)}
.badge.loose{background:var(--p3-bg);color:var(--p3)}
.badge.cond{background:var(--p1-bg);color:var(--p1)}
.mth{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;
  border-radius:5px;white-space:nowrap}
.mth.GET{background:var(--ok-bg);color:var(--ok)}
.mth.POST{background:var(--p2-bg);color:var(--p2)}
.mth.PUT,.mth.PATCH{background:var(--p1-bg);color:var(--p1)}
.mth.DELETE{background:var(--p0-bg);color:var(--p0)}
.pcell{font-family:var(--mono);font-size:12px;word-break:break-all;color:var(--ink-2)}

/* ---------- 折叠 & 空态 ---------- */
.mod-body{display:none}
.module.open .mod-body{display:block}
.module.open .caret{transform:rotate(90deg)}
.caret{transition:transform .18s;flex:none;opacity:.5}
.hidden{display:none!important}
.empty{padding:40px;text-align:center;color:var(--ink-3);font-size:14px}
section[id],.panel[id]{scroll-margin-top:72px}

footer{border-top:1px solid var(--line);background:var(--panel);
  padding:20px 24px;color:var(--ink-3);font-size:12.5px}
footer .wrap{display:flex;flex-direction:column;gap:6px}
footer code{font-family:var(--mono);background:var(--bg);padding:1px 6px;
  border-radius:4px;border:1px solid var(--line)}
@media(max-width:1023px){
  .toolbar-in{gap:8px}
  header{padding:20px 16px 16px}
  .layout{padding:16px 12px 40px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-row">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
      </div>
      <div>
        <h1>GitLab QA · 测试用例清单</h1>
        <div class="sub" id="subline"></div>
      </div>
    </div>
    <div class="meta-line" id="metachips"></div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-in">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="搜索用例编号、名称、说明、标签…">
    </div>
    <div class="fgroup" id="suite-filter"></div>
    <div class="fdivider"></div>
    <div class="fgroup" id="sev-filter"></div>
    <div class="fdivider"></div>
    <div class="fgroup">
      <button class="fbtn" id="fx-defect">已知缺陷 <span class="n" id="n-defect"></span></button>
      <button class="fbtn" id="fx-reset">重置</button>
    </div>
    <span class="count-hint" id="count-hint"></span>
  </div>
</div>

<div class="layout">
  <nav class="sidenav" id="sidenav"></nav>
  <main id="main"></main>
</div>

<footer>
  <div class="wrap">
    <div>数据来源：AST 解析 <code>tests/**</code> 全部用例源码（用例名 / allure 元数据 / 说明 / 标记 / xfail 原因）＋ <code>pytest --collect-only</code> 实际收集（可执行条数）＋ <code>tests/data/api/*.yaml</code>（数据驱动矩阵）。</div>
    <div>重新生成：<code>python tools/export_case_inventory.py</code>　·　可执行条数＝参数化展开后的真实用例数；标记 <span style="color:var(--warn)">估算</span> 表示该模块收集报错、条数为推算值。</div>
    <div id="gen-time"></div>
  </div>
</footer>

<script>
"use strict";
const DATA = {"generated": "2026-11-16 19:49", "project": "gitlab-qa · GitLab CE 19.0.1 自动化测试框架", "suites": [{"key": "API", "name": "API 接口测试", "desc": "GitLab REST API v4 的功能覆盖：鉴权、资源 CRUD、分页完整性、边界值、幂等性、状态流转、请求语义与契约校验。", "order": 1, "modules": [{"file": "tests/api/test_auth.py", "code": "AUTH", "name": "test_auth.py", "doc": "鉴权：测的是「拒绝得是否准确」，不只是「能不能访问」。\n\n401 与 403 的分界在这里最有价值：\n    401 = 我不知道你是谁\n    403 = 我知道你是谁，但你不能做\n很多实现把两者混成 401，前端就只能一律踢回登录页。", "marks": ["api", "regression"], "cases": [{"name": "test_valid_token_identifies_user", "line": 24, "cls": null, "epic": "GitLab API", "feature": "鉴权", "story": "有效 Token 可识别身份,返回当前用户信息", "severity": "blocker", "marks": ["requires_token"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "有效 Token 可识别身份", "fixtures": ["gl"], "estimate": 1, "id": "API-AUTH-001", "nodeid": "tests/api/test_auth.py::test_valid_token_identifies_user", "executable": 1, "estimated": false}, {"name": "test_invalid_token_is_rejected", "line": 42, "cls": null, "epic": "GitLab API", "feature": "鉴权", "story": "无效 Token 被拒绝", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "伪造的 Token 必须 401，不能因为「反正拿不到数据」就返回 200 空列表。", "fixtures": ["settings"], "estimate": 1, "id": "API-AUTH-002", "nodeid": "tests/api/test_auth.py::test_invalid_token_is_rejected", "executable": 1, "estimated": false}, {"name": "test_anonymous_cannot_read_private_data", "line": 63, "cls": null, "epic": "GitLab API", "feature": "鉴权", "story": "匿名访问受保护资源被拒绝", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "匿名访问 /user 必须被拒（401）。\n\n如果这里返回 200，说明鉴权中间件没生效——这是 P0 级的安全缺陷。", "fixtures": ["anon_client"], "estimate": 1, "id": "API-AUTH-003", "nodeid": "tests/api/test_auth.py::test_anonymous_cannot_read_private_data", "executable": 1, "estimated": false}, {"name": "test_forbidden_is_403_not_401", "line": 77, "cls": null, "epic": "GitLab API", "feature": "鉴权", "story": "缺权限时是 403 而不是 401", "severity": "normal", "marks": ["requires_token"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "已认证但无权 → 403，而不是 401。\n\n两种状态码语义完全不同：401 是「服务端没认出你」，403 是「认出你了但不给你」。\n只有第二个身份才能验证这件事 —— 用管理员访问管理员端点永远 200，断言恒真，\n是典型的假绿。没配 GITLAB_MEMBER_TOKEN 时本用例 skip，不假装通过。\n\n探针用 /application/settings：真实存在、只读、仅管理员可访问。\n旧版用 /admin/users，那是 Web 路径不是 API 端点，管理员访问也返回 404\n——在 mock 靶机上能过，在真实实例上必然失败。", "fixtures": ["gl", "member_client"], "estimate": 1, "id": "API-AUTH-004", "nodeid": "tests/api/test_auth.py::test_forbidden_is_403_not_401", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_auth_state_machine.py", "code": "AUTH-SM", "name": "test_auth_state_machine.py", "doc": "鉴权状态机：登录 → 过期 → 透明续期 → refresh 一次性 → 登出。\n\n这组用例不是按接口清单写的，而是先在本实例（GitLab CE 19.0.1）上逐条探测，\n再把探测到的真实行为固化成断言。探测过程中有四处与「常见认知」相反，\n每一处都在对应用例的注释里写明了，改动前请先重跑探测：\n\n1. **过期日当天就失效**。直觉上 expires_at=今天应该「今天还能用」，\n   实测 active=false、调 API 直接 401。判定是过期日当天零点起不可用。\n2. **登出是 POST /users/sign_out**（204），不是 DELETE——DELETE 实测 404，\n   GET 只是 301 重定向，两者都能让用例「看起来测过」而实际没登出。\n3. **refresh_token 确实是一次性的**，但失败码是 **400 invalid_grant**\n   而不是 401，且新 refresh_token 立刻可用（轮换链条延续）。\n4. **password grant 已被废弃**（unsupported_grant_type）。要拿 refresh_token\n   只能走 authorization_code，而它必须过一遍浏览器同意页。\n\n状态图（每条用例对应一条边或一次守卫）：\n\n    匿名 ──登录成功──> 已认证 ──过期日到达──> 已过期 ──访问──> 401（不可自愈）\n      │                  │\n      │                  ├──刷新──> 新已认证（旧令牌全部作废，refresh 一次性）\n    登录失败              │\n      └──> 仍是匿名       └──登出──> 已登出 ──访问──> 401 ──刷新──> 拒绝", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_login_issues_token_in_active_state", "line": 76, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "登录成功：新令牌立即处于已认证态", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "登录后进入 ACTIVE：令牌 active=true 且能调通 API。\n\n只断言「创建成功」是不够的——创建返回 201 但令牌 active=false\n的情况在本实例上真实存在（见过期边界用例），所以这里两个都查。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-001", "nodeid": "tests/api/test_auth_state_machine.py::test_login_issues_token_in_active_state", "executable": 1, "estimated": false}, {"name": "test_login_with_wrong_password_stays_anonymous", "line": 100, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "登录失败：错误密码不产生会话", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "错误密码之后必须仍是匿名：认证态不成立，API 仍是 401。\n\n这里踩过一个真实的坑，值得写下来：**不能拿「有没有会话 cookie」当判据**。\n本实例在密码错误时照样下发 `_gitlab_session`（这是 Devise 的正常行为：失败后重定向回登录页，会话 cookie 用于存 flash 消息/CSRF），\n按 cookie 断言会得到一条漂亮的假绿。实测区分点是：\n\n    失败：cookies=[_gitlab_session, preferred_language]，API 401\n    成功：多一个 known_sign_in，API 200\n\n所以这里断言认证态（known_sign_in）与 API 结果，不断言 cookie 存在与否。", "fixtures": ["web_session", "settings"], "estimate": 1, "id": "API-AUTH-SM-002", "nodeid": "tests/api/test_auth_state_machine.py::test_login_with_wrong_password_stays_anonymous", "executable": 1, "estimated": false}, {"name": "test_login_with_valid_password_establishes_session", "line": 130, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "登录成功：密码正确建立可调用 API 的会话", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "UI 会话与 API Token 是两条独立的认证通道，这里验证前者。\n\n与失败路径配成一对，两条用同一组判据（known_sign_in + API 状态码），\n才说明「这个判据真的能区分成功与失败」——只写成功侧的话，\n拿 cookie 是否存在断言也能过，那就等于没测。", "fixtures": ["web_session", "settings"], "estimate": 1, "id": "API-AUTH-SM-003", "nodeid": "tests/api/test_auth_state_machine.py::test_login_with_valid_password_establishes_session", "executable": 1, "estimated": false}, {"name": "test_token_expiring_today_is_already_dead", "line": 158, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "过期日边界：到期当天即失效", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "反直觉边界：expires_at=今天创建的令牌，当天就不可用。\n\n直觉是「今天到期 = 今天还能用到 24:00」，实测不是：\n本实例把「过期日 <= 今天」都算作已过期，创建出来 active 直接是 false。\n\n这条最容易被人「顺手改对」——把它改成期待 200 会让用例永远绿，\n但真实用户会在到期日当天发现自己提前掉线。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-004", "nodeid": "tests/api/test_auth_state_machine.py::test_token_expiring_today_is_already_dead", "executable": 1, "estimated": false}, {"name": "test_token_expiring_tomorrow_is_active", "line": 187, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "过期日边界：明天到期仍然有效", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "与上面那条配成一对，把边界夹住。\n\n单测「今天失效」是不够的：如果实现改成「一律失效」，那条也会通过。\n必须有反向样本证明「没到期的确实能用」。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-005", "nodeid": "tests/api/test_auth_state_machine.py::test_token_expiring_tomorrow_is_active", "executable": 1, "estimated": false}, {"name": "test_expired_token_is_rejected", "line": 205, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "已过期令牌被拒绝", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "昨天到期的令牌一律 401。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-006", "nodeid": "tests/api/test_auth_state_machine.py::test_expired_token_is_rejected", "executable": 1, "estimated": false}, {"name": "test_expired_token_cannot_self_heal", "line": 221, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "已过期令牌不能自愈", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "连续访问多次，过期令牌不得「用着用着又活了」。\n\n能抓住一类真实缺陷：缓存里还留着旧的认证结果，第一次请求 401，\n后续请求走了缓存副本反而 200——这种抖动比一直 401 更难查。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-007", "nodeid": "tests/api/test_auth_state_machine.py::test_expired_token_cannot_self_heal", "executable": 1, "estimated": false}, {"name": "test_instance_enforces_expiry_on_new_tokens", "line": 244, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "实例强制令牌必须带过期日", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "不传 expires_at 时，实例必须补一个过期日，而不是发永不过期的令牌。\n\n实测本实例自动补一年（2027-10-28）。允许永不过期的实例等于\n把「过期」这条边从状态机上摘掉了——后面的过期用例会全部失去意义，\n所以这条是整组用例的前置守卫。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-008", "nodeid": "tests/api/test_auth_state_machine.py::test_instance_enforces_expiry_on_new_tokens", "executable": 1, "estimated": false}, {"name": "test_access_token_ttl_is_declared", "line": 269, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "访问令牌的 TTL 是固定的", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "签发的 access_token 必须声明有限寿命，不能是「永久」。\n\n没有 expires_in 就等于声称永不过期，那么刷新机制毫无必要，\n整套一次性 refresh 的设计也失去前提。", "fixtures": ["oauth_token"], "estimate": 1, "id": "API-AUTH-SM-009", "nodeid": "tests/api/test_auth_state_machine.py::test_access_token_ttl_is_declared", "executable": 1, "estimated": false}, {"name": "test_refresh_resets_ttl_rather_than_extends", "line": 287, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "刷新是重置 TTL，不是叠加", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "刷新后新令牌的 TTL 必须回到初始值，而不是在原基础上累加。\n\n累加式实现会让频繁刷新的客户端攒出一个无限长的会话，\n等于用合法手段绕过了过期策略。", "fixtures": ["oauth_flow", "oauth_app", "oauth_token"], "estimate": 1, "id": "API-AUTH-SM-010", "nodeid": "tests/api/test_auth_state_machine.py::test_refresh_resets_ttl_rather_than_extends", "executable": 1, "estimated": false}, {"name": "test_using_token_does_not_extend_its_life", "line": 314, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "使用令牌不会自动延长寿命（无透明续期）", "severity": "normal", "marks": ["slow"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "从服务端记录看：令牌被使用不会推后它的过期时间。\n\n这是「透明续期」这条边的直接验证。GitLab 没有滑动续期，\n所以这里断言的是**不变**——如果哪天有人在实例上开启了滑动续期，\n这条会变红，提醒回来重新设计刷新策略的用例。\n\n依赖 docker exec 读服务端记录；读不到就 skip，不用猜的数据蒙混过关。", "fixtures": ["oauth_flow", "oauth_app", "oauth_token"], "estimate": 1, "id": "API-AUTH-SM-011", "nodeid": "tests/api/test_auth_state_machine.py::test_using_token_does_not_extend_its_life", "executable": 1, "estimated": false}, {"name": "test_refresh_issues_new_token_and_kills_old", "line": 356, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "刷新签发新令牌并立即作废旧令牌", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "刷新后：新 access_token 可用，旧 access_token 立刻失效。\n\n只断言「新令牌能用」是常见漏法——旧令牌如果还活着，\n就等于一次刷新变成了令牌复制，轮换机制形同虚设。", "fixtures": ["oauth_flow", "oauth_app", "oauth_token"], "estimate": 1, "id": "API-AUTH-SM-012", "nodeid": "tests/api/test_auth_state_machine.py::test_refresh_issues_new_token_and_kills_old", "executable": 1, "estimated": false}, {"name": "test_refresh_token_is_single_use", "line": 384, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "refresh_token 一次性：二次兑换被拒", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "核心断言：同一个 refresh_token 不能用第二次。\n\n实测本实例返回 400 + invalid_grant（不是 401）。\n接受 400/401 两种：实现换成 401 时不应该让这条用例变红，\n但**绝不接受 200**——那意味着被截获的 refresh_token 可以无限续期，\n相当于长期有效的口令。", "fixtures": ["oauth_flow", "oauth_app", "oauth_token"], "estimate": 1, "id": "API-AUTH-SM-013", "nodeid": "tests/api/test_auth_state_machine.py::test_refresh_token_is_single_use", "executable": 1, "estimated": false}, {"name": "test_refresh_rotation_chain_continues", "line": 411, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "轮换链条延续：新的 refresh_token 可用", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "一次性的前提是「给你一个新的」，否则用户会被永久登出。\n\n与上一条配成一对：只测一次性会漏掉「轮换后链条断了」；\n只测链条会漏掉「旧令牌还能用」。", "fixtures": ["oauth_flow", "oauth_app", "oauth_token"], "estimate": 1, "id": "API-AUTH-SM-014", "nodeid": "tests/api/test_auth_state_machine.py::test_refresh_rotation_chain_continues", "executable": 1, "estimated": false}, {"name": "test_refresh_with_wrong_secret_is_rejected", "line": 435, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "错误 client_secret 无法刷新", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "光有 refresh_token 不够，还得出示应用密钥。\n\n实测返回 401。这条拦的是「refresh_token 泄露即可独立续期」——\n双因子里少一个因子，泄露的影响面会成倍放大。", "fixtures": ["oauth_flow", "oauth_app", "oauth_token"], "estimate": 1, "id": "API-AUTH-SM-015", "nodeid": "tests/api/test_auth_state_machine.py::test_refresh_with_wrong_secret_is_rejected", "executable": 1, "estimated": false}, {"name": "test_refresh_after_revoke_is_rejected", "line": 453, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "会话已终结后不得续出新令牌", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "登出之后再拿 refresh_token 来刷，必须拒绝。\n\n这是「登出」这条边真正的分量：如果撤销只作废 access_token 而\nrefresh_token 还能用，登出就是一个可被绕过的假动作。", "fixtures": ["oauth_flow", "oauth_app", "oauth_token"], "estimate": 1, "id": "API-AUTH-SM-016", "nodeid": "tests/api/test_auth_state_machine.py::test_refresh_after_revoke_is_rejected", "executable": 1, "estimated": false}, {"name": "test_ui_logout_destroys_session", "line": 480, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "UI 登出销毁会话", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "登出后会话立即失效——用 API 状态码验证，而不是看页面跳没跳。\n\n实测：POST /users/sign_out → 204，之后 /api/v4/user → 401。\n用 DELETE 会拿到 404、用 GET 只拿到 301，两者都不会真正登出，\n但都能让「我调用了登出接口」这句话成立。", "fixtures": ["web_session", "settings"], "estimate": 1, "id": "API-AUTH-SM-017", "nodeid": "tests/api/test_auth_state_machine.py::test_ui_logout_destroys_session", "executable": 1, "estimated": false}, {"name": "test_logout_is_idempotent", "line": 505, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "登出幂等", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "重复登出必须稳定返回成功，不能报错。\n\n前端常在多个标签页各发一次登出；服务端若对「已登出」报 500，\n用户就会看到莫名的错误页。", "fixtures": ["web_session", "settings"], "estimate": 1, "id": "API-AUTH-SM-018", "nodeid": "tests/api/test_auth_state_machine.py::test_logout_is_idempotent", "executable": 1, "estimated": false}, {"name": "test_logout_redirects_to_login", "line": 528, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "登出后被踢回登录页", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "服务端状态之外再看一眼用户可见结果：首页不再展示已登录内容。", "fixtures": ["web_session", "settings"], "estimate": 1, "id": "API-AUTH-SM-019", "nodeid": "tests/api/test_auth_state_machine.py::test_logout_redirects_to_login", "executable": 1, "estimated": false}, {"name": "test_revoke_personal_token_ends_session", "line": 545, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "撤销个人令牌即登出", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "令牌撤销后必须立刻不可用——这是 API 侧「登出」的等价动作。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-020", "nodeid": "tests/api/test_auth_state_machine.py::test_revoke_personal_token_ends_session", "executable": 1, "estimated": false}, {"name": "test_revoke_personal_token_is_idempotent", "line": 564, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "撤销幂等", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "重复撤销同一张令牌应当稳定成功，而不是报「不存在」。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-021", "nodeid": "tests/api/test_auth_state_machine.py::test_revoke_personal_token_is_idempotent", "executable": 1, "estimated": false}, {"name": "test_oauth_revoke_ends_session", "line": 583, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "OAuth 撤销即登出", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "RFC 7009 撤销：成功返回 200，之后令牌立刻不可用。", "fixtures": ["oauth_flow", "oauth_app", "oauth_token"], "estimate": 1, "id": "API-AUTH-SM-022", "nodeid": "tests/api/test_auth_state_machine.py::test_oauth_revoke_ends_session", "executable": 1, "estimated": false}, {"name": "test_expired_and_revoked_look_the_same", "line": 602, "cls": null, "epic": "GitLab API", "feature": "鉴权状态机", "story": "过期与撤销对客户端不可区分", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "同样是 401，且不透露是哪一种原因。\n\n如果「令牌不存在」返回 404、「已过期」返回 401，攻击者就能\n枚举出哪些令牌 ID 真实存在。对外必须收敛成同一个结论。", "fixtures": ["token_factory"], "estimate": 1, "id": "API-AUTH-SM-023", "nodeid": "tests/api/test_auth_state_machine.py::test_expired_and_revoked_look_the_same", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_award_emoji.py", "code": "EMOJI", "name": "test_award_emoji.py", "doc": "表情奖励（award_emoji）：议题/评论上的反应接口。\n\n全部期望值来自本实例实测（GitLab 19.0.1）：\n  · POST rocket → 201；GET 列表 200；GET 单查 200；DELETE → 204\n  · **同一用户对同一对象重复同一 emoji → 404**，消息\n    'Award Emoji Name has already been taken'——语义上这是个冲突（4xx 系），\n    但状态码选择了 404。这条怪癖必须实测才能写对，猜 409 会假红。\n  · 非法 emoji 名（含大写）→ 404 'not a valid emoji name'\n  · 删除后再删 → 404（幂等）\n  · 不存在的议题 → 404（防枚举）\n覆盖缺口来源：award_emoji 模块 32 个操作 QA 覆盖为 0。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_issue_emoji_crud_roundtrip", "line": 55, "cls": null, "epic": "GitLab API", "feature": "表情奖励", "story": "议题 emoji CRUD", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "发 → 查 → 删 → 消失，每步的 id 都取自上一步的返回。", "fixtures": ["emoji_scope", "gl"], "estimate": 1, "id": "API-EMOJI-001", "nodeid": "tests/api/test_award_emoji.py::test_issue_emoji_crud_roundtrip", "executable": 1, "estimated": false}, {"name": "test_issue_accepts_multiple_distinct_emoji", "line": 82, "cls": null, "epic": "GitLab API", "feature": "表情奖励", "story": "同一对象多个不同 emoji", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "rocket 与 fire 可并存：唯一性约束在「用户 × emoji 名」组合上。\n\n实测依据：rocket 201（探针一）、fire 201（探针三，独立议题上）。\n这条把它们放到同一议题上，守的是\"多选不互斥\"。", "fixtures": ["emoji_scope", "gl"], "estimate": 1, "id": "API-EMOJI-002", "nodeid": "tests/api/test_award_emoji.py::test_issue_accepts_multiple_distinct_emoji", "executable": 1, "estimated": false}, {"name": "test_duplicate_emoji_by_same_user_is_404", "line": 113, "cls": null, "epic": "GitLab API", "feature": "表情奖励", "story": "重复奖励同一 emoji", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "同一用户重复发同一 emoji → 404 'has already been taken'。\n\n状态码是 404 而不是 409——这是实测出的怪癖，测试里**按实测固化**，\n并同时断言消息文本，防止服务端哪天静默改成\"允许重复\"（列表里\n出现两条 rocket）也不被发现。", "fixtures": ["emoji_scope", "gl"], "estimate": 1, "id": "API-EMOJI-003", "nodeid": "tests/api/test_award_emoji.py::test_duplicate_emoji_by_same_user_is_404", "executable": 1, "estimated": false}, {"name": "test_invalid_emoji_name_is_404", "line": 141, "cls": null, "epic": "GitLab API", "feature": "表情奖励", "story": "非法 emoji 名", "severity": "normal", "marks": [], "params": [{"argnames": "name", "count": 3, "ids": ["fake", "uppercase", "empty"], "auto_ids": false}], "param_ids": ["fake", "uppercase", "empty"], "xfail": null, "skip": null, "doc": "非法/大写/空 emoji 名 → 404 'not a valid emoji name'。\n\n大写也拒（emoji 名大小写敏感），空串同样走这条 404 分支——\n三种输入共用同一拒绝语义，实测确认。", "fixtures": ["emoji_scope", "gl", "name"], "estimate": 3, "id": "API-EMOJI-004", "nodeid": "tests/api/test_award_emoji.py::test_invalid_emoji_name_is_404", "executable": 3, "estimated": false}, {"name": "test_emoji_double_delete_is_404", "line": 162, "cls": null, "epic": "GitLab API", "feature": "表情奖励", "story": "重复删除幂等", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["emoji_scope", "gl"], "estimate": 1, "id": "API-EMOJI-005", "nodeid": "tests/api/test_award_emoji.py::test_emoji_double_delete_is_404", "executable": 1, "estimated": false}, {"name": "test_note_emoji_crud", "line": 178, "cls": null, "epic": "GitLab API", "feature": "表情奖励", "story": "评论 emoji CRUD", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "评论上的 emoji 与议题同构：POST 201 / GET 200 / DELETE 204。\n\n评论是三层路径（项目/议题/评论），最容易因为中间层校验缺失\n出现越权读写——单独走一遍全链路。", "fixtures": ["emoji_scope", "gl"], "estimate": 1, "id": "API-EMOJI-006", "nodeid": "tests/api/test_award_emoji.py::test_note_emoji_crud", "executable": 1, "estimated": false}, {"name": "test_emoji_on_missing_issue_is_404", "line": 202, "cls": null, "epic": "GitLab API", "feature": "表情奖励", "story": "404 防枚举语义", "severity": "normal", "marks": [], "params": [{"argnames": "method", "count": 2, "ids": ["GET", "POST"], "auto_ids": false}], "param_ids": ["GET", "POST"], "xfail": null, "skip": null, "doc": "GET/POST 都必须 404，且不泄漏议题是否存在之外的信息。", "fixtures": ["emoji_scope", "gl", "method"], "estimate": 2, "id": "API-EMOJI-007", "nodeid": "tests/api/test_award_emoji.py::test_emoji_on_missing_issue_is_404", "executable": 2, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_badges.py", "code": "BADGE", "name": "test_badges.py", "doc": "项目徽章（badges）：企业级 CRUD + 校验 + 幂等 + 越界语义。\n\n全部期望值来自本实例实测（GitLab 19.0.1，探针 .tmp/probe_new_modules.txt）：\n  · 创建 201 / 列表 200 / 单查 200 / 更新 200 / 删除 204\n  · 删除后单查 404，重复删除 404（幂等）\n  · **缺 name 也返回 201，且 name 忠实存为 null**——name 是可选项，\n    这不是缺陷；断言写死 400 就是在猜。\n  · link_url / image_url 只允许 http/https，非法 scheme 返回 400 且\n    消息精确指向字段（javascript: 注入这种输入是最该拦的）\n  · 项目不存在时 404 \"Project Not Found\"（防枚举语义与其他资源一致）\n\n覆盖缺口来源：接口文档统计显示 badges 模块 12 个操作 QA 覆盖为 0。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_badge_crud_roundtrip", "line": 58, "cls": null, "epic": "GitLab API", "feature": "徽章", "story": "CRUD 全链路", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "创建 → 列表可见 → 单查一致 → 更新生效 → 删除 → 消失。\n\n一条链路走完五个动作而不是拆五条用例：中间任何一环断了，\n后面的环节必然失败，拆开的\"单环用例\"反而看不出因果。\n每一步的断言值都取自**上一步创建接口的返回**，不是再查一遍列表。", "fixtures": ["badge_scope", "gl"], "estimate": 1, "id": "API-BADGE-001", "nodeid": "tests/api/test_badges.py::test_badge_crud_roundtrip", "executable": 1, "estimated": false}, {"name": "test_badge_double_delete_is_404", "line": 97, "cls": null, "epic": "GitLab API", "feature": "徽章", "story": "重复删除幂等", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "删除是幂等的：第二次删除不会复活资源，也不会 5xx。\n\n调用方重试删除是常态（网络闪断后重发），第二次必须是干净的成功\n语义（404 视为\"目标已不存在\"）——实测返回 404 而不是 400/500。", "fixtures": ["badge_scope", "gl"], "estimate": 1, "id": "API-BADGE-002", "nodeid": "tests/api/test_badges.py::test_badge_double_delete_is_404", "executable": 1, "estimated": false}, {"name": "test_badge_name_is_optional_and_stored_verbatim", "line": 122, "cls": null, "epic": "GitLab API", "feature": "徽章", "story": "可选字段 name", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测：缺 name 返回 201，name 忠实存为 None。\n\n这条用例守住的是\"忠实保存\"而不是\"必须拒绝\"：name 是可选项，\n服务端选择接受。要抓的缺陷是**静默改写**——比如悄悄补一个\n空字符串或默认名。回查必须还是 null 才算忠实。", "fixtures": ["badge_scope", "gl"], "estimate": 1, "id": "API-BADGE-003", "nodeid": "tests/api/test_badges.py::test_badge_name_is_optional_and_stored_verbatim", "executable": 1, "estimated": false}, {"name": "test_badge_link_url_rejects_non_http_scheme", "line": 154, "cls": null, "epic": "GitLab API", "feature": "徽章", "story": "link_url scheme 白名单", "severity": "critical", "marks": [], "params": [{"argnames": "url", "count": 3, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "javascript: / ftp: / file: 一律 400，且消息指向 link_url。\n\n徽章最终会渲染成用户可点击的链接——scheme 校验失效等于把\nXSS 入口直接开给所有能改项目设置的人。实测消息为\n'is blocked: Only allowed schemes are http, https'。", "fixtures": ["badge_scope", "gl", "url"], "estimate": 3, "id": "API-BADGE-004", "nodeid": "tests/api/test_badges.py::test_badge_link_url_rejects_non_http_scheme", "executable": 3, "estimated": false}, {"name": "test_badge_image_url_rejects_javascript_scheme", "line": 176, "cls": null, "epic": "GitLab API", "feature": "徽章", "story": "image_url scheme 白名单", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "image_url 的 scheme 校验与 link_url 同源但必须独立生效。", "fixtures": ["badge_scope", "gl"], "estimate": 1, "id": "API-BADGE-005", "nodeid": "tests/api/test_badges.py::test_badge_image_url_rejects_javascript_scheme", "executable": 1, "estimated": false}, {"name": "test_badge_on_missing_project_is_404", "line": 196, "cls": null, "epic": "GitLab API", "feature": "徽章", "story": "404 防枚举语义", "severity": "normal", "marks": [], "params": [{"argnames": "method", "count": 2, "ids": ["GET", "POST"], "auto_ids": false}], "param_ids": ["GET", "POST"], "xfail": null, "skip": null, "doc": "不存在的项目一律 404 'Project Not Found'，GET/POST 语义一致。\n\n写这条而不是复用全局错误语义用例的原因：徽章路由是\n二层资源，实现里少一层 project 预检就会漏成 500 或空列表 200。", "fixtures": ["gl", "method"], "estimate": 2, "id": "API-BADGE-006", "nodeid": "tests/api/test_badges.py::test_badge_on_missing_project_is_404", "executable": 2, "estimated": false}, {"name": "test_badge_update_missing_is_404", "line": 217, "cls": null, "epic": "GitLab API", "feature": "徽章", "story": "更新不存在的徽章", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "PUT 不存在的徽章 404——不是 404 之外的任何东西（实测确认）。", "fixtures": ["badge_scope", "gl"], "estimate": 1, "id": "API-BADGE-007", "nodeid": "tests/api/test_badges.py::test_badge_update_missing_is_404", "executable": 1, "estimated": false}, {"name": "test_group_badge_crud", "line": 230, "cls": null, "epic": "GitLab API", "feature": "徽章", "story": "群组徽章 CRUD", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "群组徽章与项目徽章同构：实测 POST 201 / GET 列表 200 / DELETE 204。\n\n群组是延迟删除资源，用独立数据工厂造、用完整体回收，\n不进 badge_scope（那个只管项目）。", "fixtures": ["gl", "settings"], "estimate": 1, "id": "API-BADGE-008", "nodeid": "tests/api/test_badges.py::test_group_badge_crud", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_boundaries.py", "code": "BND", "name": "test_boundaries.py", "doc": "边界值。\n\n这批用例的共同点：**不猜服务端会接受还是拒绝**。\n\n    超长标题到底该 400 还是该 200，是 GitLab 的实现选择。把它写死成其中\n    一边，只会在版本升级时换来一条无意义的红，然后被人放宽成\n    `in (200, 400)`——从此这条断言不再验任何东西。\n\n    这里守的是另一套判据（见 gqa.api.verdict）：\n\n        接受 → 回查到的值必须与送出去的**逐字相等**\n        拒绝 → 必须是 4xx，且消息里指向该字段\n\n    它能抓到状态码断言抓不到的缺陷：标题被静默截断、数值被悄悄取整、\n    日期被改写成\"最接近的合法值\"。这些都不报错，但用户的数据已经变了。\n\n    「重新 GET 一次再比对」是刻意的：创建响应里回显的是**入参**，\n    不是数据库里真正存下的值。只比对响应体，截断类缺陷照样漏过去。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_issue_title_length_is_stored_verbatim", "line": 49, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "议题标题长度", "severity": "normal", "marks": [], "params": [{"argnames": "n", "count": 5, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "1 / 255 / 256 / 1000 / 5000 字符：接受就必须一字不差地存下来。\n\n255/256 这一对是刻意的：如果服务端有 255 的上限，边界就落在两者之间，\n只测 1 和 1000 的话，\"截断到 255\" 和 \"接受 1000\" 两种实现都看不出来。", "fixtures": ["gl", "a_project", "n"], "estimate": 5, "id": "API-BND-001", "nodeid": "tests/api/test_boundaries.py::test_issue_title_length_is_stored_verbatim", "executable": 5, "estimated": false}, {"name": "test_label_name_length_is_stored_verbatim", "line": 76, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "标签名长度", "severity": "normal", "marks": [], "params": [{"argnames": "n", "count": 4, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "别名 title 是实测逼出来的：标签超长时报的是\n`{\"title\": [\"is too long (maximum is 255 characters)\"]}`——\n键名用了内部模型的 title，而不是入参 name。照 name 去匹配会假红。", "fixtures": ["gl", "a_project", "n"], "estimate": 4, "id": "API-BND-002", "nodeid": "tests/api/test_boundaries.py::test_label_name_length_is_stored_verbatim", "executable": 4, "estimated": false}, {"name": "test_milestone_title_length_is_stored_verbatim", "line": 99, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "里程碑标题长度", "severity": "minor", "marks": [], "params": [{"argnames": "n", "count": 4, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "a_project", "n"], "estimate": 4, "id": "API-BND-003", "nodeid": "tests/api/test_boundaries.py::test_milestone_title_length_is_stored_verbatim", "executable": 4, "estimated": false}, {"name": "test_project_name_length_is_stored_verbatim", "line": 118, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "项目名长度", "severity": "minor", "marks": [], "params": [{"argnames": "n", "count": 4, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "项目创建不经过数据工厂：工厂失败时会重试并抛 RuntimeError，\n把\"服务端拒绝\"伪装成框架错误，就看不出这条边界到底是怎么处理的。\n\nvisibility 必须显式给 private：不给就走实例默认值，\n而「默认允许建公开项目」和「默认不允许」两种实例上的结论完全不同。", "fixtures": ["gl", "n"], "estimate": 4, "id": "API-BND-004", "nodeid": "tests/api/test_boundaries.py::test_project_name_length_is_stored_verbatim", "executable": 4, "estimated": false}, {"name": "test_issue_weight_is_not_a_recognised_field", "line": 148, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "议题 weight 在 CE 上不被识别", "severity": "normal", "marks": [], "params": [{"argnames": "weight", "count": 6, "ids": ["one", "zero", "neg-1", "big-1e6", "huge-1e9", "text"], "auto_ids": false}], "param_ids": ["one", "zero", "neg-1", "big-1e6", "huge-1e9", "text"], "xfail": null, "skip": null, "doc": "weight 是 Premium 功能，CE 上这个参数**根本不在允许列表里**。\n\n实测（GitLab 19.0.1 CE）：只发 weight 会得到\n\n    400 assignee_id, ..., title, issue_type are missing,\n        at least one parameter must be provided\n\n服务端说的不是\"权重超范围\"，而是\"你一个有效参数都没给\"——\nweight 被当成不存在的键直接丢掉了。排障时看到这句话去查\n\"到底漏了哪个参数\"，永远查不到 weight 头上。\n\n这正是版本差异类缺陷的典型长相：EE 文档写着支持，CE 上静默忽略，\n调用方拿到一条与 weight 毫无关系的报错。", "fixtures": ["gl", "data_factory", "a_project", "weight"], "estimate": 6, "id": "API-BND-005", "nodeid": "tests/api/test_boundaries.py::test_issue_weight_is_not_a_recognised_field", "executable": 6, "estimated": false}, {"name": "test_issue_update_without_weight_succeeds", "line": 181, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "议题更新的对照组", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "同一个请求去掉 weight 就能成功。\n\n没有这条对照，上一条的 400 也可能只是\"这个接口今天坏了\"——\n两条一起看，才能把原因锁定在 weight 这个字段上。", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-BND-006", "nodeid": "tests/api/test_boundaries.py::test_issue_update_without_weight_succeeds", "executable": 1, "estimated": false}, {"name": "test_milestone_bad_due_date", "line": 217, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "里程碑截止日期", "severity": "normal", "marks": [], "params": [{"argnames": "due", "count": 5, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": {"reason": "已知缺陷（实测 GitLab 19.0.1）：非法 due_date 返回 201 但存成 null。2026-02-30 / 2026-13-01 / 2026-00-10 / not-a-date / 2026/12/31 五种输入全部被静默丢弃，调用方无法区分「我传了空」和「我的日期被扔了」。strict=True：一旦 GitLab 改为拒绝或改为忠实保存，这条会 XPASS 变红，提醒把这个标记去掉。", "strict": true, "conditional": false}, "skip": null, "doc": "2026-02-30 这种\"格式对但日子不存在\"的日期最容易被放过。\n\n判据：接受就必须存成 2026-02-30（被改成 2026-03-02 是改写），\n拒绝就必须说明 due_date 有问题。实测两者都不是——它「接受并丢弃」，\n这是三种结局里最差的一种，所以这条用例本来就应该红。", "fixtures": ["gl", "data_factory", "a_project", "due"], "estimate": 5, "id": "API-BND-007", "nodeid": "tests/api/test_boundaries.py::test_milestone_bad_due_date", "executable": 5, "estimated": false}, {"name": "test_issue_bad_due_date", "line": 248, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "议题截止日期", "severity": "minor", "marks": [], "params": [{"argnames": "due", "count": 5, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": {"reason": "已知缺陷（实测 GitLab 19.0.1）：议题 due_date 同样被静默丢弃。接口返回 200，回查 due_date 为 null，没有任何提示。", "strict": true, "conditional": false}, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project", "due"], "estimate": 5, "id": "API-BND-008", "nodeid": "tests/api/test_boundaries.py::test_issue_bad_due_date", "executable": 5, "estimated": false}, {"name": "test_valid_due_date_is_kept", "line": 265, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "合法截止日期作为对照", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "对照组：合法日期必须原样存下来。\n\n上面两条 xfail 如果连这条也红了，说明问题不是\"非法日期被丢弃\"，\n而是\"due_date 根本写不进去\"——那是完全不同、更严重的故障。", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-BND-009", "nodeid": "tests/api/test_boundaries.py::test_valid_due_date_is_kept", "executable": 1, "estimated": false}, {"name": "test_member_access_level_boundaries", "line": 289, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "成员权限等级", "severity": "critical", "marks": [], "params": [{"argnames": "level", "count": 4, "ids": ["zero", "five", "ninety-nine", "thousand"], "auto_ids": false}], "param_ids": ["zero", "five", "ninety-nine", "thousand"], "xfail": null, "skip": null, "doc": "access_level 只有 5/10/20/30/40/50 几个合法值。\n\n0 和 5 最危险：0 表示\"没有权限\"，5 在 GitLab 里是 Minimal Access。\n如果 0 被当成合法值存下来，等于加了个看不见的成员；\n如果 5 被悄悄抬成 10，调用方以为给了最小权限，实际给了 Guest。", "fixtures": ["gl", "a_project", "level"], "estimate": 4, "id": "API-BND-010", "nodeid": "tests/api/test_boundaries.py::test_member_access_level_boundaries", "executable": 4, "estimated": false}, {"name": "test_label_color_boundaries", "line": 329, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "标签颜色格式", "severity": "minor", "marks": [], "params": [{"argnames": "color", "count": 5, "ids": ["non-hex", "five-digits", "seven-digits", "lowercase", "uppercase"], "auto_ids": false}], "param_ids": ["non-hex", "five-digits", "seven-digits", "lowercase", "uppercase"], "xfail": null, "skip": null, "doc": "#RRGGBB 之外的形式应被拒；大小写是合法的等价写法，必须原样保留。\n\n实测：`#abcdef` 存回 `#abcdef`，`#ABCDEF` 存回 `#ABCDEF`——\n服务端不做大小写归一。所以这里**不做** tolower 再比：\n先降级成小写比对，会把\"服务端偷偷把 A 改成 a\"这种改写放过去。\n\n另外实测 `red` 会被接受并存成 `#FF0000`：把颜色名翻译成等价值不算\n改写数据，所以没有把它放进这组（放进来会得到一条无意义的红）。", "fixtures": ["gl", "a_project", "color"], "estimate": 5, "id": "API-BND-011", "nodeid": "tests/api/test_boundaries.py::test_label_color_boundaries", "executable": 5, "estimated": false}, {"name": "test_issue_title_whitespace_only", "line": 361, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "纯空白标题", "severity": "normal", "marks": [], "params": [{"argnames": "title", "count": 3, "ids": ["space", "tab", "newline"], "auto_ids": false}], "param_ids": ["space", "tab", "newline"], "xfail": null, "skip": null, "doc": "只由 ASCII 空白组成的标题必须被拒。\n\n与「空串」不同：`title: \"\"` 走的是必填校验，而 `title: \" \"` 长度不为零，\n很容易从校验里溜过去，最后变成列表里一条点不开的空白议题。", "fixtures": ["gl", "a_project", "title"], "estimate": 3, "id": "API-BND-012", "nodeid": "tests/api/test_boundaries.py::test_issue_title_whitespace_only", "executable": 3, "estimated": false}, {"name": "test_issue_title_ideographic_space_is_rejected", "line": 400, "cls": null, "epic": "GitLab API", "feature": "边界值", "story": "全角空格标题", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": {"reason": "已知缺陷（实测 GitLab 19.0.1）：ASCII 空格 / Tab / 换行都被 400 拒绝，但全角空格 U+3000 组成的标题被接受（201），回查 title 就是 '\\u3000'。说明空白判定只用了 ASCII 的 strip，没做 Unicode 归一化。strict=True：修复后 XPASS 变红，提醒去掉标记。", "strict": true, "conditional": false}, "skip": null, "doc": "全角空格是最容易漏的一种\"看起来是空的\"输入。\n\n它和前一条的 ASCII 空格在业务上完全等价，但走的是不同的校验分支——\n只测半角空格会得出\"空白标题已被拦下\"的错误结论。\n使用全角输入法的用户敲出来的正是这个字符。", "fixtures": ["gl", "a_project"], "estimate": 1, "id": "API-BND-013", "nodeid": "tests/api/test_boundaries.py::test_issue_title_ideographic_space_is_rejected", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_ci_variables.py", "code": "CIVAR", "name": "test_ci_variables.py", "doc": "CI/CD 变量（project variables）：机密类资源的读写与掩码规则。\n\n全部期望值来自本实例实测（GitLab 19.0.1）：\n  · POST {key,value} → 201，variable_type=env_var、environment_scope=*\n  · 重复 key → 400 '(KEY) has already been taken'（注意：不是 409）\n  · GET 列表 200 / GET 单查 200 / PUT 更新 200\n  · masked=true 要求值\"可掩码\"（Base32 风格、≥8 位）：\n      短值 \"v3\" → 400 'value is invalid'\n      \"8af3d51c9e7f4b26a4c9d2e\" → 200 且 masked=true\n  · **PUT 只传 key（不带 value）→ 200 且变量原样不变**：key 不能\n    通过 PUT 改名，缺省 value 不会被清空（用例复跑纠正了探针误判）\n  · DELETE → 204，重复删 404 'Variable Not Found'\n  · 缺 key → 400 'key is missing'；key 含空格 → 400\n    \"can contain only letters, digits and '_'\"\n  · 项目不存在 → 404 'Project Not Found'\n覆盖缺口来源：ci_variables 模块 15 个操作 QA 覆盖为 0。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_variable_crud_roundtrip", "line": 69, "cls": null, "epic": "GitLab API", "feature": "CI/CD 变量", "story": "CRUD 全链路", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["var_scope", "gl"], "estimate": 1, "id": "API-CIVAR-001", "nodeid": "tests/api/test_ci_variables.py::test_variable_crud_roundtrip", "executable": 1, "estimated": false}, {"name": "test_duplicate_key_is_400", "line": 96, "cls": null, "epic": "GitLab API", "feature": "CI/CD 变量", "story": "重复 key 拒绝", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "同一 key 二次创建 → 400 'has already been taken'（实测，不是 409）。\n\n变量按 key 寻址，重复创建如果被静默接受，旧值会被覆盖——\nCI 流水线在两个版本间拿到的值不同，且没有任何提示。", "fixtures": ["var_scope", "gl"], "estimate": 1, "id": "API-CIVAR-002", "nodeid": "tests/api/test_ci_variables.py::test_duplicate_key_is_400", "executable": 1, "estimated": false}, {"name": "test_masked_value_must_be_maskable", "line": 130, "cls": null, "epic": "GitLab API", "feature": "CI/CD 变量", "story": "masked 值可掩码校验", "severity": "critical", "marks": [], "params": [{"argnames": "value,ok", "count": 2, "ids": ["short", "maskable"], "auto_ids": false}], "param_ids": ["short", "maskable"], "xfail": null, "skip": null, "doc": "masked=true 时值必须可掩码。\n\n实测边界：短值 \"v3\" → 400；24 位 Base32 风格 → 200 且 masked=true。\n为什么这是 CRITICAL：masked 是机密标记，规则过松 = 日志里泄漏\n凭据；规则过严 = 用户以为掩了其实没掩上。", "fixtures": ["var_scope", "gl", "value", "ok"], "estimate": 2, "id": "API-CIVAR-003", "nodeid": "tests/api/test_ci_variables.py::test_masked_value_must_be_maskable", "executable": 2, "estimated": false}, {"name": "test_missing_key_is_400", "line": 164, "cls": null, "epic": "GitLab API", "feature": "CI/CD 变量", "story": "必填 key", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "缺 key → 400 'key is missing'。key 是变量的主键，必填没有商量。", "fixtures": ["var_scope", "gl"], "estimate": 1, "id": "API-CIVAR-004", "nodeid": "tests/api/test_ci_variables.py::test_missing_key_is_400", "executable": 1, "estimated": false}, {"name": "test_key_charset_is_rejected", "line": 176, "cls": null, "epic": "GitLab API", "feature": "CI/CD 变量", "story": "key 字符集", "severity": "normal", "marks": [], "params": [{"argnames": "key", "count": 3, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "key 只允许字母/数字/下划线：CI 语法里变量名要能直接被引用。\n\n空格、连字符、非 ASCII 字母都 400，实测消息\n\"can contain only letters, digits and '_'\"。", "fixtures": ["var_scope", "gl", "key"], "estimate": 3, "id": "API-CIVAR-005", "nodeid": "tests/api/test_ci_variables.py::test_key_charset_is_rejected", "executable": 3, "estimated": false}, {"name": "test_update_key_field_is_ignored", "line": 192, "cls": null, "epic": "GitLab API", "feature": "CI/CD 变量", "story": "PUT 改 key 被忽略", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测：PUT 只传 key（不带 value）→ 200，变量原样不变。\n\n即：key 不能通过 PUT 改名，缺省的 value 也不会被清空——\nPUT 在这里表现为\"忽略未知操作的无操作\"。\n（探针阶段曾误判为 400：那次 PUT 附带了 value \"x\"，\n而变量残留着上一轮的 masked=true，\"x\" 不可掩码才被拒——\n被这条用例复跑纠了出来，这也是\"期望值必须实测\"的注脚。）", "fixtures": ["var_scope", "gl"], "estimate": 1, "id": "API-CIVAR-006", "nodeid": "tests/api/tes 得对不对\"。\n少了后者，一条把 path 写错、拿到 404/400 的用例也会是绿的。", "fixtures": ["gl", "matrix_project", "case"], "estimate": 1, "id": "API-DATA-001", "nodeid": "tests/api/test_data_driven.py::test_validation_matrix", "executable": 14, "estimated": false}, {"name": "test_naming_matrix", "line": 154, "cls": null, "epic": "GitLab API", "feature": "数据驱动矩阵", "story": "分支名与标签名的合法性", "severity": "normal", "marks": ["cases"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "命名规则是纯业务约束，最适合放在 YAML 里——规则变了改数据即可。\n\n合法命名的用例会真的创建成功（201），所以带 {uniq} 防重名，\n并用 cleanup 回收。这里断言的是\"该收的收、该放的放\"，\n两边任一方向写反都会红。", "fixtures": ["gl", "matrix_project", "case"], "estimate": 1, "id": "API-DATA-002", "nodeid": "tests/api/test_data_driven.py::test_naming_matrix", "executable": 19, "estimated": false}, {"name": "test_query_params_matrix", "line": 169, "cls": null, "epic": "GitLab API", "feature": "数据驱动矩阵", "story": "查询参数边界", "severity": "normal", "marks": ["cases"], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "把服务端对边界值的真实态度固定下来。\n\n这里最有价值的是几处\"不一致\"：per_page=0 报 400 但 page=0 收 200；\nper_page=-1 静默回落成默认页宽。这些没法靠推理得出，只能实测记录。\n将来若版本变更，红的原因就写在对应 YAML 条目的 desc 里。", "fixtures": ["gl", "matrix_project", "case"], "estimate": 1, "id": "API-DATA-003", "nodeid": "tests/api/test_data_driven.py::test_query_params_matrix", "executable": 23, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_error_semantics.py", "code": "ERR", "name": "test_error_semantics.py", "doc": "错误语义。\n\n状态码用错的代价远高于「少一个字段」：调用方靠状态码决定重试还是报错。\n401 与 403 混用会让客户端在凭据失效时反复重试；404 用成 200 + 空列表，\n则会让「拼错 id」变成「查无数据」，排查方向彻底跑偏。\n\n这组用例不验证业务，只验证「错了的时候说得清楚」。", "marks": ["api", "regression", "requires_token"], "cases": [{"name": "test_missing_resources_are_404", "line": 27, "cls": null, "epic": "GitLab API", "feature": "错误语义", "story": "不存在的资源一律 404", "severity": "normal", "marks": [], "params": [{"argnames": "fetch", "count": 6, "ids": ["project", "issue", "label", "milestone", "note", "merge_request"], "auto_ids": false}], "param_ids": ["project", "issue", "label", "milestone", "note", "merge_request"], "xfail": null, "skip": null, "doc": "每种资源都要 404，且错误体形状一致。", "fixtures": ["gl", "a_project", "fetch"], "estimate": 6, "id": "API-ERR-001", "nodeid": "tests/api/test_error_semantics.py::test_missing_resources_are_404", "executable": 6, "estimated": false}, {"name": "test_bad_parameters_are_400", "line": 53, "cls": null, "epic": "GitLab API", "feature": "错误语义", "story": "参数非法是 400 而不是 500", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "参数错误必须是 4xx。返回 500 会把调用方引到重试逻辑上去，\n而重试一百次也是同样的错误参数。", "fixtures": ["gl", "a_project"], "estimate": 1, "id": "API-ERR-002", "nodeid": "tests/api/test_error_semantics.py::test_bad_parameters_are_400", "executable": 1, "estimated": false}, {"name": "test_anonymous_is_401", "line": 67, "cls": null, "epic": "GitLab API", "feature": "错误语义", "story": "匿名访问受保护资源是 401", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["anon_client"], "estimate": 1, "id": "API-ERR-003", "nodeid": "tests/api/test_error_semantics.py::test_anonymous_is_401", "executable": 1, "estimated": false}, {"name": "test_authenticated_but_forbidden_is_403", "line": 76, "cls": null, "epic": "GitLab API", "feature": "错误语义", "story": "已认证但无权限是 403 而非 401", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "401 表示「你是谁」，403 表示「你是谁，但不行」。\n\n两者混用时最典型的后果：客户端拿着有效 Token 收到 401，\n于是去刷新凭据，刷完还是 401，形成静默的死循环。\n\n判定必须建立在**对照组**上：先证明第二身份的 Token 确实有效（200），\n再去碰它无权访问的资源。少了这一步，Token 过期时用例拿到 401，\n断言 `status in (401, 403)` 照样通过——一条永远不会红的假绿。", "fixtures": ["gl", "member_client"], "estimate": 1, "id": "API-ERR-004", "nodeid": "tests/api/test_error_semantics.py::test_authenticated_but_forbidden_is_403", "executable": 1, "estimated": false}, {"name": "test_error_body_has_no_stacktrace", "line": 106, "cls": null, "epic": "GitLab API", "feature": "错误语义", "story": "错误体不泄露堆栈与内部信息", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "错误体里出现 backtrace / sql / 路径，等于把内部结构送出去。", "fixtures": ["gl"], "estimate": 1, "id": "API-ERR-005", "nodeid": "tests/api/test_error_semantics.py::test_error_body_has_no_stacktrace", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_groups_advanced.py", "code": "GRP", "name": "test_groups_advanced.py", "doc": "群组进阶：详情、修改、群组内项目、子群组、群组标签。\n\n群组是「命名空间」也是「权限容器」，两条身份叠在一个对象上，\n所以这里除了 CRUD，还要验证「在群组下建的项目确实归到该群组」——\n这条语义错了，后面所有按群组聚合的统计都会静默偏。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_group_lifecycle", "line": 39, "cls": null, "epic": "GitLab API", "feature": "群组", "story": "创建、修改、删除", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl"], "estimate": 1, "id": "API-GRP-001", "nodeid": "tests/api/test_groups_advanced.py::test_group_lifecycle", "executable": 1, "estimated": false}, {"name": "test_project_created_under_group", "line": 77, "cls": null, "epic": "GitLab API", "feature": "群组", "story": "在群组下创建项目", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory"], "estimate": 1, "id": "API-GRP-002", "nodeid": "tests/api/test_groups_advanced.py::test_project_created_under_group", "executable": 1, "estimated": false}, {"name": "test_group_appears_in_list", "line": 94, "cls": null, "epic": "GitLab API", "feature": "群组", "story": "群组列表", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory"], "estimate": 1, "id": "API-GRP-003", "nodeid": "tests/api/test_groups_advanced.py::test_group_appears_in_list", "executable": 1, "estimated": false}, {"name": "test_create_project_via_group_endpoint", "line": 107, "cls": null, "epic": "GitLab API", "feature": "群组", "story": "用群组端点创建项目", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "「在群组下建项目」这条语义必须成立。\n\nGitLab 19 把 `POST /groups/{id}/projects` 撤了（实测 404），\n唯一入口是 `POST /projects` + `namespace_id`（封装层已改走这条）。\n这条用例守的是**结果**而不是具体路径：建出来的项目必须归到该群组下。\n路径变了用例不用改——这正是「资源封装层」存在的意义。", "fixtures": ["gl", "data_factory"], "estimate": 1, "id": "API-GRP-004", "nodeid": "tests/api/test_groups_advanced.py::test_create_project_via_group_endpoint", "executable": 1, "estimated": false}, {"name": "test_subgroups_are_listed", "line": 136, "cls": null, "epic": "GitLab API", "feature": "群组", "story": "子群组", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory"], "estimate": 1, "id": "API-GRP-005", "nodeid": "tests/api/test_groups_advanced.py::test_subgroups_are_listed", "executable": 1, "estimated": false}, {"name": "test_group_labels_are_listed", "line": 152, "cls": null, "epic": "GitLab API", "feature": "群组", "story": "群组标签", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory"], "estimate": 1, "id": "API-GRP-006", "nodeid": "tests/api/test_groups_advanced.py::test_group_labels_are_listed", "executable": 1, "estimated": false}, {"name": "test_missing_group_is_404", "line": 165, "cls": null, "epic": "GitLab API", "feature": "群组", "story": "群组不存在时 404", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl"], "estimate": 1, "id": "API-GRP-007", "nodeid": "tests/api/test_groups_advanced.py::test_missing_group_is_404", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_hooks.py", "code": "HOOK", "name": "test_hooks.py", "doc": "项目 Webhooks（hooks）：事件推送配置的 CRUD 与 URL 校验。\n\n全部期望值来自本实例实测（GitLab 19.0.1）：\n  · POST {url, push_events, issues_events} → 201\n  · **重复 URL 不去重：第二个同 URL 钩子同样 201**——钩子没有\n    唯一约束（对比标签的 409）。这不是缺陷断言，是行为固化：\n    测试守住\"两次成功 = 列表里真有两条\"的一致性。\n  · GET 列表 200 / 单查 200 / PUT 更新 200 / DELETE → 204\n  · 删除后 404，重复删 404（幂等）\n  · URL 校验：空串 / 非法串 / ftp:// → **422** 'Invalid url given'\n    （注意不是 400；且只允许 http/https）\n  · 项目不存在 → 404 'Project Not Found'\n覆盖缺口来源：hooks 模块 22 个操作 QA 覆盖为 0。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_hook_crud_roundtrip", "line": 64, "cls": null, "epic": "GitLab API", "feature": "Webhooks", "story": "CRUD 全链路", "severity": "blocker", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "创建（带事件开关）→ 列表可见 → 单查一致 → 改事件开关 → 删除。\n\n事件开关（push_events / issues_events）是钩子唯一的意义所在：\n创建时带 true、回查必须仍是 true——开关被静默丢掉的话，\n用户配了钩子却收不到任何推送，且界面上看不出异常。", "fixtures": ["hook_scope", "gl"], "estimate": 1, "id": "API-HOOK-001", "nodeid": "tests/api/test_hooks.py::test_hook_crud_roundtrip", "executable": 1, "estimated": false}, {"name": "test_duplicate_url_is_accepted_consistently", "line": 104, "cls": null, "epic": "GitLab API", "feature": "Webhooks", "story": "重复 URL 不去重", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测：同 URL 第二次创建同样 201，钩子没有唯一约束。\n\n固化的是一致性而不是\"应该拒绝\"：N 个成功响应必须对应列表里\nN 条钩子。少一条 = 创建凭空消失；多一条 = 写入被重复执行。\n（如果哪天服务端加了唯一约束，这条会以 400 出现——届时按新实测改。）", "fixtures": ["hook_scope", "gl"], "estimate": 1, "id": "API-HOOK-002", "nodeid": "tests/api/test_hooks.py::test_duplicate_url_is_accepted_consistently", "executable": 1, "estimated": false}, {"name": "test_hook_bad_url_is_422", "line": 137, "cls": null, "epic": "GitLab API", "feature": "Webhooks", "story": "URL scheme 白名单", "severity": "critical", "marks": [], "params": [{"argnames": "url", "count": 3, "ids": ["empty", "not-a-url", "ftp-scheme"], "auto_ids": false}], "param_ids": ["empty", "not-a-url", "ftp-scheme"], "xfail": null, "skip": null, "doc": "空/非法/ftp 的 URL → 422 'Invalid url given'。\n\n状态码是 422 而不是 400——实测固化。钩子是 SSRF 高危面：\n服务端会主动向这个 URL 发请求，scheme 白名单（http/https）失效\n意味着攻击者能让实例去访问内网任意地址。", "fixtures": ["hook_scope", "gl", "url"], "estimate": 3, "id": "API-HOOK-003", "nodeid": "tests/api/test_hooks.py::test_hook_bad_url_is_422", "executable": 3, "estimated": false}, {"name": "test_hook_double_delete_is_404", "line": 157, "cls": null, "epic": "GitLab API", "feature": "Webhooks", "story": "重复删除幂等", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["hook_scope", "gl"], "estimate": 1, "id": "API-HOOK-004", "nodeid": "tests/api/test_hooks.py::test_hook_double_delete_is_404", "executable": 1, "estimated": false}, {"name": "test_hooks_on_missing_project_is_404", "line": 171, "cls": null, "epic": "GitLab API", "feature": "Webhooks", "story": "404 防枚举语义", "severity": "normal", "marks": [], "params": [{"argnames": "method", "count": 2, "ids": ["GET", "POST"], "auto_ids": false}], "param_ids": ["GET", "POST"], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "method"], "estimate": 2, "id": "API-HOOK-005", "nodeid": "tests/api/test_hooks.py::test_hooks_on_missing_project_is_404", "executable": 2, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_idempotency.py", "code": "IDEM", "name": "test_idempotency.py", "doc": "幂等性。\n\n为什么单独一组：\n\n    \"重复调用会发生什么\"是接口契约里最容易被忽略、又最容易在上游重试\n    逻辑里炸掉的部分。客户端 SDK、网关、队列消费者都会重发请求，\n    而它们重发的时机恰恰是\"上一次可能已经成功了\"的时候。\n\n    这里把三类行为钉死：\n\n        删除类   → 重复删不得报错、不得让资源复活\n        覆盖写类 → 重复 PUT 同一份内容不得产生第二条记录\n        创建类   → 同名资源并发创建，最终只能有一个\n\n    第三类最有价值：单线程下\"先查后建\"永远看不出竞态，\n    只有真并发才能暴露\"两个 201、两条同名记录\"。\n\n    POST 天然不幂等，这一点也显式固定下来（见 test_same_note_body_...）——\n    它是框架「POST 绝不自动重试」这条规则的依据，写进用例比写在注释里可靠。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_delete_label_twice", "line": 95, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复删除标签", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-001", "nodeid": "tests/api/test_idempotency.py::test_delete_label_twice", "executable": 1, "estimated": false}, {"name": "test_delete_milestone_twice", "line": 107, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复删除里程碑", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-002", "nodeid": "tests/api/test_idempotency.py::test_delete_milestone_twice", "executable": 1, "estimated": false}, {"name": "test_delete_issue_twice", "line": 120, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复删除议题", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-003", "nodeid": "tests/api/test_idempotency.py::test_delete_issue_twice", "executable": 1, "estimated": false}, {"name": "test_delete_note_twice", "line": 133, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复删除评论", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-004", "nodeid": "tests/api/test_idempotency.py::test_delete_note_twice", "executable": 1, "estimated": false}, {"name": "test_delete_branch_twice", "line": 148, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复删除分支", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-005", "nodeid": "tests/api/test_idempotency.py::test_delete_branch_twice", "executable": 1, "estimated": false}, {"name": "test_delete_project_twice", "line": 161, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复删除项目", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "项目删除**不**像其他资源那样幂等——这是实测出来的差异。\n\n    标签 / 里程碑 / 议题 / 分支：第二次 DELETE → 404\n    项目：第二次 DELETE → 400 \"Project has already been marked for deletion\"\n\n原因是项目走「延迟删除」：第一次把状态标成待删，第二次再删时\n服务端认为这个动作已经做过了，直接报错而不是静默接受。\n\n对调用方的影响是实打实的：把 400 当失败重试的清理脚本会在这里卡住，\n然后留一堆待删项目在实例上。所以这条用例记录的不是\"应该 400\"，\n而是\"必须知道它可能 400，并且此时资源确实已经不可见了\"。", "fixtures": ["gl", "data_factory"], "estimate": 1, "id": "API-IDEM-006", "nodeid": "tests/api/test_idempotency.py::test_delete_project_twice", "executable": 1, "estimated": false}, {"name": "test_repeated_put_issue_does_not_duplicate", "line": 203, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复写入议题内容", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-007", "nodeid": "tests/api/test_idempotency.py::test_repeated_put_issue_does_not_duplicate", "executable": 1, "estimated": false}, {"name": "test_repeated_put_milestone_does_not_duplicate", "line": 230, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复写入里程碑", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-008", "nodeid": "tests/api/test_idempotency.py::test_repeated_put_milestone_does_not_duplicate", "executable": 1, "estimated": false}, {"name": "test_close_issue_twice_stays_closed", "line": 250, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复关闭议题", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-009", "nodeid": "tests/api/test_idempotency.py::test_close_issue_twice_stays_closed", "executable": 1, "estimated": false}, {"name": "test_close_milestone_twice_stays_closed", "line": 267, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "重复关闭里程碑", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-010", "nodeid": "tests/api/test_idempotency.py::test_close_milestone_twice_stays_closed", "executable": 1, "estimated": false}, {"name": "test_same_note_body_creates_two_notes", "line": 283, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "同内容评论两次", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "POST 天然不幂等——两条内容相同的评论是两条评论。\n\n这不是缺陷，是 HTTP 语义。它的实际后果是：框架绝不能自动重试 POST。\n一旦\"超时重发\"，用户的议题下就会多一条重复评论，而报告上一切正常。\n所以这条用例断言的其实是「重试策略必须存在的理由」。", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-IDEM-011", "nodeid": "tests/api/test_idempotency.py::test_same_note_body_creates_two_notes", "executable": 1, "estimated": false}, {"name": "test_concurrent_label_create_yields_one", "line": 328, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "并发创建同名标签", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": {"reason": "已知缺陷（实测 GitLab 19.0.1）：4 线程并发创建同名标签，实测返回 [201, 400, 500, 500]——其中两个请求拿到 500 Internal Server Error。串行重复创建是干净的 409，说明唯一约束存在，但并发下数据库唯一性冲突没有变成 4xx。strict=False 是刻意的：这是概率性竞态，不是每次都复现，strict=True 会让「这一轮没复现」变成构建失败，结果是用例变成掷骰子。", "strict": false, "conditional": false}, "skip": null, "doc": "两个请求同时到达时的正确结局：一个 201，其余被 4xx 拒绝。\n\n这里敢断言\"恰好一个成功\"，是因为**标签名唯一是实测过的既有行为**\n（test_labels.test_duplicate_label_conflicts 已固定：重名 409）。\n\n同时要求\"不得出现 5xx\"：冲突是业务上完全预期得到的结果。\n用 500 表达冲突，调用方只能当成服务故障去重试，越重试越乱。", "fixtures": ["gl", "settings", "a_project"], "estimate": 1, "id": "API-IDEM-012", "nodeid": "tests/api/test_idempotency.py::test_concurrent_label_create_yields_one", "executable": 1, "estimated": false}, {"name": "test_concurrent_milestone_create_yields_one", "line": 371, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "并发创建同名里程碑", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": {"reason": "已知缺陷（实测 GitLab 19.0.1）：4 线程并发创建同名里程碑，曾观测到返回 [201, 201, 400, 400] 且实例上落库 2 条同名里程碑。串行创建同名是 400 'already being used'，说明唯一性有校验，但「校验」与「插入」之间的窗口没锁住（TOCTOU）。strict=False：竞态复现与否取决于时序，把不确定的行为标成 strict 会让构建随机红。复现率低不代表不存在——这条用例的作用是持续观察，不是稳定门禁。", "strict": false, "conditional": false}, "skip": null, "doc": "里程碑同名在串行下是被明确拒绝的（实测 400 already being used）。\n\n既然串行拒绝，并发也不该放行——否则\"先查后建\"的校验形同虚设，\n而这类竞态单线程用例永远发现不了。\n\n断言的是**落库数量**，不是 201 的个数：即使两个请求都拿到 201，\n只要库里只有一条，对调用方就是安全的；反过来一个 201 落下两条更糟。", "fixtures": ["gl", "settings", "a_project"], "estimate": 1, "id": "API-IDEM-013", "nodeid": "tests/api/test_idempotency.py::test_concurrent_milestone_create_yields_one", "executable": 1, "estimated": false}, {"name": "test_concurrent_branch_create_yields_one_ref", "line": 399, "cls": null, "epic": "GitLab API", "feature": "幂等性", "story": "并发创建同名分支", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "同名分支在 git 层面只可能有一条 ref。\n\n断言的是\"没有第二条 ref\"和\"至少有一次成功\"——两次都 201 也算合理\n（创建分支本身可以做成幂等），所以不把\"只能一个成功\"写死。", "fixtures": ["gl", "settings", "a_project"], "estimate": 1, "id": "API-IDEM-014", "nodeid": "tests/api/test_idempotency.py::test_concurrent_branch_create_yields_one_ref", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_issues.py", "code": "ISSUE", "name": "test_issues.py", "doc": "议题：跨资源的数据依赖与状态流转。\n\n议题依附于项目，所以这组用例天然演示了「资源之间的依赖怎么组织」——\n用 data_factory 一次创建，用例结束后按 议题→项目 的顺序回收。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_create_issue", "line": 23, "cls": null, "epic": "GitLab API", "feature": "议题", "story": "创建议题", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null,
