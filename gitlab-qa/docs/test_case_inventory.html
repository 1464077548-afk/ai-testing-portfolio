": "", "fixtures": ["data_factory", "gl", "an_open_issue"], "estimate": 1, "id": "API-NOTE-003", "nodeid": "tests/api/test_notes.py::test_update_note_body", "executable": 1, "estimated": false}, {"name": "test_delete_note_is_gone", "line": 64, "cls": null, "epic": "GitLab API", "feature": "议题评论", "story": "删除评论", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["data_factory", "gl", "an_open_issue"], "estimate": 1, "id": "API-NOTE-004", "nodeid": "tests/api/test_notes.py::test_delete_note_is_gone", "executable": 1, "estimated": false}, {"name": "test_notes_are_ordered_by_id", "line": 75, "cls": null, "epic": "GitLab API", "feature": "议题评论", "story": "评论顺序", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "顺序断言的价值在于分页：顺序不稳时，翻页会漏记录或重复。\n\n这里刻意不写死「必须升序」。GitLab 19 的评论列表默认按创建时间**倒序**\n（新在前，实测 [7, 6]），写死升序会得到一条永远红的用例，而它红的\n原因只是「我猜错了默认排序」。真正要守的不变式是两条：\n  1. 单调——要么全升要么全降，不能乱序；\n  2. 稳定——连查两次顺序一致，否则翻页必然丢数据。", "fixtures": ["data_factory", "gl", "an_open_issue"], "estimate": 1, "id": "API-NOTE-005", "nodeid": "tests/api/test_notes.py::test_notes_are_ordered_by_id", "executable": 1, "estimated": false}, {"name": "test_closing_issue_produces_system_note", "line": 105, "cls": null, "epic": "GitLab API", "feature": "议题评论", "story": "系统评论与人工评论区分", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "系统记录必须与人工评论区分开，且不得混进人工计数。\n\n实测（GitLab 19.0.1）：关闭议题**不再产生** system note——\n议题已 work-item 化，状态变更走事件表而非 notes 表。\n所以这里分两段断言：\n  · 关闭这个动作本身必须生效（state=closed），这是硬断言；\n  · 若实例确实产生了 system note，则它必须带 system=true 且不污染人工计数；\n    没有产生就显式 skip 并写明原因——不把「版本能力缺失」报成「产品缺陷」。", "fixtures": ["data_factory", "gl", "an_open_issue"], "estimate": 1, "id": "API-NOTE-006", "nodeid": "tests/api/test_notes.py::test_closing_issue_produces_system_note", "executable": 1, "estimated": false}, {"name": "test_notes_of_missing_issue_are_404", "line": 138, "cls": null, "epic": "GitLab API", "feature": "议题评论", "story": "议题不存在时评论接口 404", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "a_project"], "estimate": 1, "id": "API-NOTE-007", "nodeid": "tests/api/test_notes.py::test_notes_of_missing_issue_are_404", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_pagination.py", "code": "PAGE", "name": "test_pagination.py", "doc": "分页：接口测试里最容易写漏的区域。\n\n三个必测项：\n1. per_page 生效（服务端不能忽略它）\n2. 边界值（下限 1、上限 100、越界 101）\n3. 翻完全部页——不重不漏", "marks": ["api", "regression"], "cases": [{"name": "test_per_page_is_respected", "line": 24, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "per_page 生效", "severity": "critical", "marks": [], "params": [{"argnames": "per_page", "count": 3, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "判据是 X-Per-Page 回显，不是「返回条数 <= per_page」。\n\n后者在数据不足一页时恒真：实例上若只有 3 个项目，请求 per_page=20 返回\n3 条，服务端把 per_page 整个忽略也照样通过。头里回显的是服务端**实际采纳**\n的页宽，与数据量无关，才是硬判据。", "fixtures": ["anon_client", "per_page"], "estimate": 3, "id": "API-PAGE-001", "nodeid": "tests/api/test_pagination.py::test_per_page_is_respected", "executable": 3, "estimated": false}, {"name": "test_per_page_over_limit", "line": 51, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "per_page 上限", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "per_page 超过上限时必须归一到 100，判据看 X-Per-Page。\n\n实测（GitLab 19.0.1）：`per_page=101` 返回 200，`X-Per-Page: 100`，\n条数按 100 封顶；`per_page=0` 才是 400。\n真正的缺陷是「嘴上接受 101，实际给回第一页的默认条数」。\n\n这里特意不再用「返回条数 <= 100」当判据：项目总数不到 100 时那条断言\n恒真，服务端把 per_page 当 1 用也发现不了——本文件原来就是这么写的。", "fixtures": ["anon_client"], "estimate": 1, "id": "API-PAGE-002", "nodeid": "tests/api/test_pagination.py::test_per_page_over_limit", "executable": 1, "estimated": false}, {"name": "test_pages_cover_without_duplication", "line": 83, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "翻页不重不漏", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "翻完全部页：不重复，且 X-Total 与实际翻到的条数一致。\n\n原来这条只查前 3 页：项目不足 20 个时第 2、3 页是空的，实际只验了 1 页，\n等于没测。现在改成按 X-Next-Page 一路翻到底。\n\n不造数据也能有检测力——因为 X-Total 是服务端自己算的，\n拿它和「实际翻到多少条」比对，翻页提前结束、丢尾页、越界回落都会被抓住。\n需要「造数据证明不遗漏」的场景在 test_pagination_scoped.py。", "fixtures": ["anon_client"], "estimate": 1, "id": "API-PAGE-003", "nodeid": "tests/api/test_pagination.py::test_pages_cover_without_duplication", "executable": 1, "estimated": false}, {"name": "test_deep_page_never_falls_back_to_first", "line": 105, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "越界页不得回落到第一页", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "深翻页的真实行为：GitLab 对 offset 分页有 50000 条上限，\n超过会返回 405 而不是空列表（第一次跑到这里才发现）。\n\n这个用例要拦的不是「405 不对」，而是最危险的一种实现：\n服务端发现页码越界后**悄悄回落到第一页**。那样调用方会以为翻到了新数据，\n实际上一直在重复处理同一批。", "fixtures": ["anon_client"], "estimate": 1, "id": "API-PAGE-004", "nodeid": "tests/api/test_pagination.py::test_deep_page_never_falls_back_to_first", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_pagination_scoped.py", "code": "PAGE-X", "name": "test_pagination_scoped.py", "doc": "按资源分页扫描：造够数据跨页，证明「不重复、不遗漏」。\n\n和 `tests/api/test_pagination.py` 的分工\n----------------------------------------\n那个文件测的是**分页参数语义**（per_page 生效、越界页不回落），\n走匿名客户端看 `/projects`，不造数据。\n这个文件测的是**分功能列表在真实数据深度下翻页是否完整**——\n每条资源造 7 条、per_page=3、翻 3 页，用创建时记下的 id 做全集比对。\n\n为什么非要造数据\n----------------\n列表不足一页时，任何「只取第一页」的实现都能通过。本框架原有的\n`test_per_page_over_limit` 就是这样恒真的：实例上只有几十个项目，\n断言「返回不超过 100 条」永远成立，服务端就算把 per_page 改成 1 也发现不了。\n所以这里的每一条用例都先把数据造到**至少 3 页**，再做断言。\n\n为什么基准用 id 而不是再查一次列表\n----------------------------------\n拿列表当标准答案是循环论证：两次查询走同一段代码，同一个缺陷会同时污染\n两边，比对结果永远相等。这里的预期集一律来自**创建接口的返回值**。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_full_scan_covers_every_record", "line": 172, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "分功能跨页扫描", "severity": "blocker", "marks": [], "params": [{"argnames": "res", "count": 7, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "造 7 条、每页 3 条、翻到底：必须一条不少、一条不重。\n\n这条用例同时盯四个缺陷，任何一个都会让前端列表\"看起来正常但少几条\"：\n  · 只取第一页（翻页逻辑没实现）→ 漏 4 条\n  · offset 算错（每页偏移少 1）→ 重复 + 漏\n  · 排序不稳定（created_at 同秒时顺序漂移）→ 重复 + 漏\n  · 越界页回落到第一页 → 大量重复", "fixtures": ["paged_scope", "gl", "res"], "estimate": 7, "id": "API-PAGE-X-001", "nodeid": "tests/api/test_pagination_scoped.py::test_full_scan_covers_every_record", "executable": 7, "estimated": false}, {"name": "test_scan_is_complete_at_page_size_one", "line": 193, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "最小页宽的极限扫描", "severity": "critical", "marks": [], "params": [{"argnames": "name", "count": 3, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "per_page=1 时翻 7 次，任何 off-by-one 都无所遁形。\n\n满载判据在这里退化为\"每页恰好 1 条\"，比 per_page=3 更严格：\nper_page=3 时尾页不满是正常的，容易掩盖\"最后一页少返回一条\"；\nper_page=1 时每页都必须有且只有 1 条，边界错误无处可藏。", "fixtures": ["paged_scope", "gl", "name"], "estimate": 3, "id": "API-PAGE-X-002", "nodeid": "tests/api/test_pagination_scoped.py::test_scan_is_complete_at_page_size_one", "executable": 3, "estimated": false}, {"name": "test_per_page_over_cap_is_normalised", "line": 219, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "per_page 超上限的归一化", "severity": "critical", "marks": [], "params": [{"argnames": "requested", "count": 3, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "超过硬上限时必须归一到 100，判据看 X-Per-Page 头。\n\n为什么不能用「返回条数 <= 100」判：数据只有 7 条时这个断言恒真，\n服务端把 per_page 直接当 1 用也照样绿——这就是原有那条用例的漏洞。\nX-Per-Page 回显的是服务端**实际采纳**的值，与数据量无关，才是硬判据。", "fixtures": ["paged_scope", "gl", "requested"], "estimate": 3, "id": "API-PAGE-X-003", "nodeid": "tests/api/test_pagination_scoped.py::test_per_page_over_cap_is_normalised", "executable": 3, "estimated": false}, {"name": "test_illegal_per_page_never_becomes_offset", "line": 249, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "非法 per_page 不得变成偏移量", "severity": "normal", "marks": [], "params": [{"argnames": "bad,ok_status", "count": 3, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "负数 per_page 最危险的实现是「当成偏移量」：返回第 N 条之后的数据。\n\n实测 GitLab 19.0.1：per_page=0 → 400；per_page=-1 → 200 且 X-Per-Page\n回落成默认 20。两种都算合理，但都必须满足同一条不变式：\n**返回的必须是列表开头，而不是被跳过一段之后的尾巴。**", "fixtures": ["paged_scope", "gl", "bad", "ok_status"], "estimate": 3, "id": "API-PAGE-X-004", "nodeid": "tests/api/test_pagination_scoped.py::test_illegal_per_page_never_becomes_offset", "executable": 3, "estimated": false}, {"name": "test_sort_parameter_really_reverses_order", "line": 279, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "排序参数生效性", "severity": "critical", "marks": [], "params": [{"argnames": "name", "count": 2, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "asc 的第一条必须等于 desc 的最后一条。\n\n这比「asc 结果递增」更强：只检查递增的话，服务端完全忽略 sort、\n永远返回升序，用例照样绿。镜像关系一验，sort 参数是否真的生效就藏不住了。", "fixtures": ["paged_scope", "gl", "name"], "estimate": 2, "id": "API-PAGE-X-005", "nodeid": "tests/api/test_pagination_scoped.py::test_sort_parameter_really_reverses_order", "executable": 2, "estimated": false}, {"name": "test_unsortable_endpoint_keeps_stable_order", "line": 308, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "不支持排序的端点必须保持稳定顺序", "severity": "normal", "marks": [], "params": [{"argnames": "name", "count": 2, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "labels / milestones 实测忽略 order_by/sort（恒升序）。\n\n忽略参数本身不是缺陷，但**顺序必须稳定**：同一批数据连查两次，\n顺序不同就意味着翻页必然丢记录。这条用例守的是稳定性，不是排序方向。", "fixtures": ["paged_scope", "gl", "name"], "estimate": 2, "id": "API-PAGE-X-006", "nodeid": "tests/api/test_pagination_scoped.py::test_unsortable_endpoint_keeps_stable_order", "executable": 2, "estimated": false}, {"name": "test_filter_and_paging_partition_the_whole_set", "line": 334, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "过滤条件与翻页组合", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "关掉一部分议题后，opened / closed 两路必须**恰好瓜分**全集。\n\n过滤 + 分页是缺陷高发组合：过滤在内存里做（先取一页再筛）就会出现\n\"某条在 opened 里没有、在 closed 里也没有\"——两边都说不在。这条用例\n验的是分区完整性，不是单个过滤条件对不对。", "fixtures": ["data_factory", "gl"], "estimate": 1, "id": "API-PAGE-X-007", "nodeid": "tests/api/test_pagination_scoped.py::test_filter_and_paging_partition_the_whole_set", "executable": 1, "estimated": false}, {"name": "test_insert_during_scan_never_silently_drops_records", "line": 375, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "翻页期间插入新记录", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "翻到一半时插入新数据，offset 分页会出现重复——这是固有行为，不是缺陷。\n\n真正要拦的是「静默丢失」：新数据插到最前面，整体后移一位，\n如果实现按 offset 硬跳，就会跳过一条从未返回过的记录。\n所以判据是：**旧的 7 条必须全部出现过**，重复可以容忍。", "fixtures": ["data_factory", "gl"], "estimate": 1, "id": "API-PAGE-X-008", "nodeid": "tests/api/test_pagination_scoped.py::test_insert_during_scan_never_silently_drops_records", "executable": 1, "estimated": false}, {"name": "test_last_page_closes_the_chain", "line": 415, "cls": null, "epic": "GitLab API", "feature": "分页", "story": "尾页与越界页", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "尾页必须没有 X-Next-Page；再往后翻必须是空数组。\n\n最危险的实现是越界后**回落第一页**：调用方以为翻到了新数据，\n实际上一直在重复处理同一批。这里连\"空页却还给下一页\"这种\n更隐蔽的情况一起验（那会让调用方空转几十次）。", "fixtures": ["paged_scope", "gl"], "estimate": 1, "id": "API-PAGE-X-009", "nodeid": "tests/api/test_pagination_scoped.py::test_last_page_closes_the_chain", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_projects.py", "code": "PROJ", "name": "test_projects.py", "doc": "项目 CRUD 与数据依赖。\n\n这组用例是接口测试的基本盘：创建 → 读回一致 → 列表可见 ", "executable": 1, "estimated": false}, {"name": "test_release_list_and_get", "line": 90, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "单查与列表", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-002", "nodeid": "tests/api/test_releases.py::test_release_list_and_get", "executable": 1, "estimated": false}, {"name": "test_duplicate_release_is_409", "line": 108, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "重复 tag 发布 409", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "同一 tag 二次发布 → 409 'Release already exists'（实测，标准冲突码）。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-003", "nodeid": "tests/api/test_releases.py::test_duplicate_release_is_409", "executable": 1, "estimated": false}, {"name": "test_release_missing_fields", "line": 123, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "必填与引用校验", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "两个必填分支实测分别为 422 与 400：\n无 ref 且 tag 不存在 → 422 'Ref is not specified'；\n空 body → 400 'tag_name is missing'。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-004", "nodeid": "tests/api/test_releases.py::test_release_missing_fields", "executable": 1, "estimated": false}, {"name": "test_release_update_description", "line": 146, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "更新描述与名称", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "PUT 改 name/description → 200，回查生效；tag_name 不可变。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-005", "nodeid": "tests/api/test_releases.py::test_release_update_description", "executable": 1, "estimated": false}, {"name": "test_release_update_empty_body_is_400", "line": 165, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "更新空 body", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "PUT 空 body → 400 'params is empty'（实测；不是无操作的 200）。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-006", "nodeid": "tests/api/test_releases.py::test_release_update_empty_body_is_400", "executable": 1, "estimated": false}, {"name": "test_release_update_missing_is_403", "line": 180, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "更新不存在的发布", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测怪癖：PUT 不存在的 release → 403 Forbidden，而不是 404。\n\n固化实测行为（403），同时断言状态没被误改——这个怪癖值得写进\n接口文档，调用方按 404 写重试逻辑会直接失效。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-007", "nodeid": "tests/api/test_releases.py::test_release_update_missing_is_403", "executable": 1, "estimated": false}, {"name": "test_release_link_crud", "line": 199, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "资产链接 CRUD", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "链接：POST 201 → GET 列表 → PUT 更新 → DELETE 200（带体）→ 404。\n\n注意 DELETE 返回 200 + 响应体，与大多数资源的 204 不同——\n写死 204 的调用方会把它当失败处理。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-008", "nodeid": "tests/api/test_releases.py::test_release_link_crud", "executable": 1, "estimated": false}, {"name": "test_release_link_validation", "line": 233, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "链接重复与非法 URL", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "三个校验分支全为 400（实测）：\n重复 name+url → ['Url has already been taken', 'Name has already been taken']；\n非法 URL → 'Only allowed schemes are http, https, ftp'；\n缺 url → 'url is missing'。\n链接允许 ftp 而钩子不允许——两个模块的 scheme 白名单不同，不能共用一条用例。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-009", "nodeid": "tests/api/test_releases.py::test_release_link_validation", "executable": 1, "estimated": false}, {"name": "test_delete_release_keeps_tag", "line": 269, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "删除发布保留 tag", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "DELETE release → 200；之后 release 404，**tag 仍在**。\n\n这条语义决定清理脚本的写法：只删 release 不删 tag，实例上会\n堆积孤儿 tag。反向（删 tag 连带删 release）同样要实测确认——\n这里只固化已实测的前半段，避免用例互相依赖。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-010", "nodeid": "tests/api/test_releases.py::test_delete_release_keeps_tag", "executable": 1, "estimated": false}, {"name": "test_release_double_delete_is_403", "line": 292, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "重复删除发布", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测：重复 DELETE release → 403（不是 404，与\"更新不存在\"同一怪癖）。\n\n与徽章/变量/链接的 404 幂等语义**不一致**——固化实测行为，\n一旦上游统一成 404 这条会变红提醒更新期望值。", "fixtures": ["release_scope", "gl"], "estimate": 1, "id": "API-REL-011", "nodeid": "tests/api/test_releases.py::test_release_double_delete_is_403", "executable": 1, "estimated": false}, {"name": "test_releases_on_missing_project_is_404", "line": 313, "cls": null, "epic": "GitLab API", "feature": "发布", "story": "404 防枚举语义", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl"], "estimate": 1, "id": "API-REL-012", "nodeid": "tests/api/test_releases.py::test_releases_on_missing_project_is_404", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_repository.py", "code": "REPO", "name": "test_repository.py", "doc": "仓库：文件 / 提交 / 分支 / 标签。\n\n这组是覆盖率提升的大头，也是最容易写出「只在靶机上绿」的用例的地方：\n文件路径和分支名都可能带斜杠，写死 main 在默认分支不同的实例上直接 404，\nbase64 编码假设错了则断言看起来通过了、比对的实际是乱码。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_file_lifecycle", "line": 38, "cl e}], "collection_error": false}, {"file": "tests/api/test_request_semantics.py", "code": "REQ", "name": "test_request_semantics.py", "doc": "请求层语义：请求体、内容类型、方法、路由。\n\n这批用例验的不是\"业务规则对不对\"，而是**协议层怎么表达错误**。\n它们的价值在于：客户端 SDK、网关、重试中间件都靠这些信号做决策。\n\n    畸形 JSON   → 必须是 4xx 而不是 500（否则会被当成服务故障去重试）\n    text/plain  → 必须是 415（明确说\"我不认这个类型\"，而不是默默解析失败）\n    不支持的方法 → 实测是 404 而不是 405，这条差异必须写下来\n    表单编码     → 实测被接受，意味着\"必须发 JSON\"是个假前提\n\n期望值全部来自实测（GitLab 19.0.1 CE），探针见 tools/_probe_edge.py 的\n「D 异常：请求体畸形」「D 异常：方法与路由」两节。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_malformed_json_is_a_client_error", "line": 60, "cls": null, "epic": "GitLab API", "feature": "请求语义", "story": "畸形 JSON 请求体", "severity": "critical", "marks": [], "params": [{"argnames": "payload", "count": 4, "ids": ["truncated", "trailing-comma", "array", "null"], "auto_ids": false}], "param_ids": ["truncated", "trailing-comma", "array", "null"], "xfail": null, "skip": null, "doc": "解析不了的请求体必须是 4xx。\n\n500 的代价不只是这一条失败：调用方看到 5xx 会认为服务端抖动，\n于是自动重试，把一条本该立刻失败的坏请求重放三遍。\n\n实测：截断的 JSON 返回 400 `{\"error\": \"Invalid JSON format\"}`。\n注意它用的是 `error` 外壳，而字段校验错误用的是 `message` 外壳——\n同一个 API 两种错误体形状，解析方必须两边都认。这一点没有写成断言\n（那属于 API 设计风格，不是缺陷），但值得留在注释里。", "fixtures": ["gl", "payload"], "estimate": 4, "id": "API-REQ-001", "nodeid": "tests/api/test_request_semantics.py::test_malformed_json_is_a_client_error", "executable": 4, "estimated": false}, {"name": "test_unsupported_content_type_is_415", "line": 89, "cls": null, "epic": "GitLab API", "feature": "请求语义", "story": "不支持的 Content-Type", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "text/plain 必须得到 415，而不是\"当成 JSON 试着解析\"。\n\n415 和 400 对调用方的意义完全不同：415 说的是\"接口不认这种格式\"，\n客户端该换序列化方式；400 说的是\"你的内容有问题\"，客户端会去改内容。\n把 415 写成 400，会让人在错误的方向上排查很久。", "fixtures": ["gl"], "estimate": 1, "id": "API-REQ-002", "nodeid": "tests/api/test_request_semantics.py::test_unsupported_content_type_is_415", "executable": 1, "estimated": false}, {"name": "test_form_encoded_body_is_accepted", "line": 111, "cls": null, "epic": "GitLab API", "feature": "请求语义", "story": "表单编码同样被接受", "severity": "minor", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "实测：`application/x-www-form-urlencoded` 也能创建项目（201）。\n\n这条记录的是\"必须发 JSON\"这个前提并不成立。它的实际影响是：\n写客户端时若用 `requests.post(url, data=...)` 也不会报错，\n于是某些字段的类型（数组、布尔）会被悄悄变成字符串——\n例如 `labels: [\"a\",\"b\"]` 走表单会变成 `\"['a', 'b']\"` 一个标签。\n\n所以这里只固定\"表单能被接受\"这一个事实，项目用完即删。", "fixtures": ["gl"], "estimate": 1, "id": "API-REQ-003", "nodeid": "tests/api/test_request_semantics.py::test_form_encoded_body_is_accepted", "executable": 1, "estimated": false}, {"name": "test_unsupported_method_is_404_not_405", "line": 148, "cls": null, "epic": "GitLab API", "feature": "请求语义", "story": "不支持的方法返回 404", "severity": "normal", "marks": [], "params": [{"argnames": "method,path_tpl", "count": 4, "ids": ["patch-issue", "post-issue-detail", "put-version", "delete-version"], "auto_ids": false}], "param_ids": ["patch-issue", "post-issue-detail", "put-version", "delete-version"], "xfail": null, "skip": null, "doc": "实测：方法不对时 GitLab 返回 **404**，不是 405。\n\n这和 RFC 的期望不一致（405 Method Not Allowed 才是标准答案），\n但它是这个 API 事实上的行为，必须固定下来，因为：\n\n  - 客户端把 404 解释成\"资源不存在\"，会去检查 id 而不是检查方法；\n  - 契约测试若按 405 写，会在真实实例上永远红。\n\n/version 是只读端点，任何写方法都不该生效——这一条与\"方法不支持\"\n是同一个判据：不得成功。", "fixtures": ["gl", "data_factory", "a_project", "method", "path_tpl"], "estimate": 4, "id": "API-REQ-004", "nodeid": "tests/api/test_request_semantics.py::test_unsupported_method_is_404_not_405", "executable": 4, "estimated": false}, {"name": "test_version_endpoint_rejects_writes_without_side_effect", "line": 173, "cls": null, "epic": "GitLab API", "feature": "请求语义", "story": "只读端点的写方法不生效", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "对 /version 发 PUT：404 且版本号不变。\n\n只看状态码不够——万一它 404 了却顺手改了点什么，状态码完全看不出来。\n所以再读一次版本，确认没有被改动。", "fixtures": ["gl"], "estimate": 1, "id": "API-REQ-005", "nodeid": "tests/api/test_request_semantics.py::test_version_endpoint_rejects_writes_without_side_effect", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_state_transitions.py", "code": "STATE", "name": "test_state_transitions.py", "doc": "状态流转。\n\n三条判据，与具体状态码无关：\n\n    1. **每一步之后的状态必须对**——不是\"接口返回 200\"，是回查 confirmed；\n    2. **非法事件不得改动状态**——返回什么都行，状态不许变；\n    3. **终态必须挡住后续流转**——已合并的 MR 不能被关闭或重启。\n\n第 3 条是这批用例里最容易出真缺陷的地方：很多系统把\"合并\"实现成\n设置一个状态字段，却没有在后续 update 里挡住它，于是合并后的 MR 还能被\nreopen，跨资源的统计立刻对不上。\n\n    状态机的名字在不同资源上并不统一：议题是 opened/closed，\n    里程碑是 active/closed。这类\"同一概念两种叫法\"在联调时最容易写错，\n    所以每一步都从回查里取 state，而不是从请求参数里推。", "marks": ["api", "regression", "destructive", "requires_token"], "cases": [{"name": "test_issue_full_cycle", "line": 71, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "议题完整回路", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "关→开→关 整条回路。只测\"关得掉\"是不够的。\n\n真实场景里议题被误关后重开、又再次关闭的比例不低。回路的第二步\n（reopen）才是最容易坏的一步：很多实现把 close 做成单向操作，\n或者 reopen 后 issue 的 closed_at 没清空，导致按 state 过滤时\n两边都查不到。", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-STATE-001", "nodeid": "tests/api/test_state_transitions.py::test_issue_full_cycle", "executable": 1, "estimated": false}, {"name": "test_illegal_issue_event_leaves_state_untouched", "line": 111, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "议题非法状态事件", "severity": "normal", "marks": [], "params": [{"argnames": "event", "count": 6, "ids": null, "auto_ids": true}], "param_ids": [], "xfail": null, "skip": null, "doc": "非法 state_event：可以 400，也可以 200 但什么都不做。\n\n唯一不能发生的是「状态被改了」或「500」。写死 400 会误伤那些\n宽松处理的实现，而只断言\"没报错\"又放过 500——所以只盯状态本身。", "fixtures": ["gl", "data_factory", "a_project", "event"], "estimate": 6, "id": "API-STATE-002", "nodeid": "tests/api/test_state_transitions.py::test_illegal_issue_event_leaves_state_untouched", "executable": 6, "estimated": false}, {"name": "test_milestone_full_cycle", "line": 141, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "里程碑完整回路", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "里程碑用 active/closed，和议题的 opened/closed 不是一套词。\n\n这里连续走两轮，验证「反复开关」不会把状态卡在中间态。", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-STATE-003", "nodeid": "tests/api/test_state_transitions.py::test_milestone_full_cycle", "executable": 1, "estimated": false}, {"name": "test_illegal_milestone_event_leaves_state_untouched", "line": 166, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "里程碑非法状态事件", "severity": "minor", "marks": [], "params": [{"argnames": "event", "count": 3, "ids": ["bogus", "upper", "issue-word"], "auto_ids": false}], "param_ids": ["bogus", "upper", "issue-word"], "xfail": null, "skip": null, "doc": "特意把议题的词（reopen）丢给里程碑：两套状态机不通用，\n服务端不该把 reopen 当成 activate。", "fixtures": ["gl", "data_factory", "a_project", "event"], "estimate": 3, "id": "API-STATE-004", "nodeid": "tests/api/test_state_transitions.py::test_illegal_milestone_event_leaves_state_untouched", "executable": 3, "estimated": false}, {"name": "test_mr_close_reopen_then_merge", "line": 192, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "合并请求完整回路", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-STATE-005", "nodeid": "tests/api/test_state_transitions.py::test_mr_close_reopen_then_merge", "executable": 1, "estimated": false}, {"name": "test_merged_mr_rejects_further_transitions", "line": 218, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "已合并的 MR 是终态", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "合并之后不许再关闭或重开。\n\n这是\"状态机少了最后一条边\"的典型缺陷：合并只是把 state 写成 merged，\n后续 update 没拦住，于是统计里\"已合并\"的 MR 还能变成\"已关闭\"。", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-STATE-006", "nodeid": "tests/api/test_state_transitions.py::test_merged_mr_rejects_further_transitions", "executable": 1, "estimated": false}, {"name": "test_closed_mr_cannot_be_merged", "line": 250, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "已关闭的 MR 不能直接合并", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "关闭 → 合并 是一条不存在的边，必须先 reopen。", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-STATE-007", "nodeid": "tests/api/test_state_transitions.py::test_closed_mr_cannot_be_merged", "executable": 1, "estimated": false}, {"name": "test_deleted_issue_rejects_transitions", "line": 273, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "已删除议题拒绝状态动作", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "删除是终态里的终态。对已删除资源做状态流转必须 404，\n不能出现\"删了又能改\"——那意味着删除只是打了个标记却仍在接受写入。", "fixtures": ["gl", "data_factory", "a_project"], "estimate": 1, "id": "API-STATE-008", "nodeid": "tests/api/test_state_transitions.py::test_deleted_issue_rejects_transitions", "executable": 1, "estimated": false}, {"name": "test_archived_project_becomes_read_only", "line": 295, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "归档项目变为只读", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "归档的语义是\"只读封存\"，不是\"隐藏\"。\n\n如果归档后还能往仓库里提交，归档就只是个 UI 过滤条件，\n而合规场景（保留证据、冻结交付）完全依赖这个只读性。", "fixtures": ["gl", "data_factory"], "estimate": 1, "id": "API-STATE-009", "nodeid": "tests/api/test_state_transitions.py::test_archived_project_becomes_read_only", "executable": 1, "estimated": false}, {"name": "test_unarchive_restores_writes", "line": 337, "cls": null, "epic": "GitLab API", "feature": "状态流转", "story": "取消归档后恢复可写", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "取消归档不是\"再归档一次\"的反面——要验证写权限真的回来了。\n\n只断言 archived 字段变 false 是不够的：内部只读锁没释放的话，\n字段看着正常、写入仍然 403。", "fixtures": ["gl", "data_factory"], "estimate": 1, "id": "API-STATE-010", "nodeid": "tests/api/test_state_transitions.py::test_unarchive_restores_writes", "executable": 1, "estimated": false}], "collection_error": false}, {"file": "tests/api/test_system.py", "code": "SYS", "name": "test_system.py", "doc": "系统级端点：版本、元信息、实例设置、统计。\n\n放在接口套件里是刻意的：这几个端点不需要鉴权或只需要管理员，\n以前只有冒烟/安全套件会碰它们，于是「跑一次接口套件」永远看不到\n完整覆盖率。把系统端点收进接口套件，覆盖率这个数字才对得上一次运行。\n\n写操作（PUT 实例设置）的做法值得说明：先读当前值，再把它原样写回。\n这样既验证了写通道可用，又不会把实例配置改掉——\n测试改配置是最难排查的一类副作用，因为它影响的是之后所有的用例。", "marks": ["api", "regression"], "cases": [{"name": "test_version_and_metadata", "line": 26, "cls": null, "epic": "GitLab API", "feature": "系统", "story": "版本与元信息", "severity": "critical", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl"], "estimate": 1, "id": "API-SYS-001", "nodeid": "tests/api/test_system.py::test_version_and_metadata", "executable": 1, "estimated": false}, {"name": "test_statistics_require_admin", "line": 46, "cls": null, "epic": "GitLab API", "feature": "系统", "story": "实例统计", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl"], "estimate": 1, "id": "API-SYS-002", "nodeid": "tests/api/test_system.py::test_statistics_require_admin", "executable": 1, "estimated": false}, {"name": "test_application_settings_readable", "line": 57, "cls": null, "epic": "GitLab API", "feature": "系统", "story": "实例设置可读", "severity": "normal", "marks": [], "params": [], "param_ids": [], "xfail": null, "skip": null, "doc": "", "fixtures": ["gl"], "estimate": 1, "id": "API-SYS-003", "nodeid": "tests/api/test_system.py::test_application_settings_readable", "executable": 1, "estimated": false}, {"name": "test_application_settings_write_is_idempotent", "line": 69, "cls": null, "epic": "GitLab API",
